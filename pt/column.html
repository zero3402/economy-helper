<!DOCTYPE html>
<html lang="pt" data-theme="corporate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy Column</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <script src="../components.js"></script>
    <script src="columns-data.js"></script>
    <script>initHead('columnDetail');</script>

    <style>
        .column-content h2 { scroll-margin-top: 100px; }
        .column-content p { text-align: justify; }
        .reading-progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #3B82F6, #8B5CF6); z-index: 100; transition: width 0.1s ease-out; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <div class="reading-progress" id="reading-progress" style="width: 0%"></div>
    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <article class="max-w-3xl mx-auto">
            <a href="columns.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-blue-600 mb-8 group">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span id="back-text">Back to list</span>
            </a>

            <header class="mb-10">
                <div class="flex items-center gap-3 mb-4">
                    <span id="column-number" class="inline-flex items-center px-4 py-1.5 rounded-full text-sm font-semibold bg-blue-100 text-blue-700"></span>
                    <span id="read-time" class="text-sm text-slate-400 flex items-center gap-1"></span>
                </div>
                <h1 id="column-title" class="text-3xl sm:text-4xl font-bold text-slate-800 mb-3"></h1>
                <p id="column-subtitle" class="text-xl text-blue-600 font-medium mb-4"></p>
                <p id="column-description" class="text-slate-600 leading-relaxed"></p>
            </header>

            <nav id="toc" class="bg-slate-50 rounded-xl p-6 mb-10 hidden">
                <h3 class="font-semibold text-slate-800 mb-3">Table of Contents</h3>
                <ul id="toc-list" class="space-y-2 text-slate-600"></ul>
            </nav>

            <div id="column-content" class="column-content prose prose-slate max-w-none"></div>

            <div class="border-t border-slate-200 mt-12 pt-8">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <span class="text-slate-600 font-medium">Did you find this helpful?</span>
                    <div class="flex gap-3">
                        <button onclick="shareToTwitter()" class="btn btn-sm btn-ghost gap-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                            X
                        </button>
                        <button onclick="shareToFacebook()" class="btn btn-sm btn-ghost gap-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            Facebook
                        </button>
                        <button onclick="copyLink()" class="btn btn-sm btn-ghost gap-2" id="copy-btn">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            <span id="copy-text">Copy Link</span>
                        </button>
                    </div>
                </div>
            </div>

            <nav class="border-t border-slate-200 mt-8 pt-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <a id="prev-link" href="#" class="hidden group p-4 rounded-xl border border-slate-200 hover:border-blue-300 hover:bg-blue-50 transition-all">
                        <div class="flex items-center gap-2 text-sm text-slate-500 mb-1">
                            <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Previous
                        </div>
                        <div id="prev-title" class="font-medium text-slate-800 group-hover:text-blue-600"></div>
                    </a>
                    <a id="next-link" href="#" class="hidden group p-4 rounded-xl border border-slate-200 hover:border-blue-300 hover:bg-blue-50 transition-all sm:text-right">
                        <div class="flex items-center justify-end gap-2 text-sm text-slate-500 mb-1">
                            Next
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                        <div id="next-title" class="font-medium text-slate-800 group-hover:text-blue-600"></div>
                    </a>
                </div>
            </nav>
        </article>
    </main>

    <footer id="footer" class="bg-white border-t border-slate-200"></footer>

    <script>
        let currentColumn = null;

        function initColumnPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const columnId = urlParams.get('id');
            if (!columnId) { window.location.href = 'columns.html'; return; }
            currentColumn = COLUMNS_DATA.find(col => col.id === columnId);
            if (!currentColumn) { window.location.href = 'columns.html'; return; }
            renderColumn();
            setupReadingProgress();
            setupNavigation();
            updateMeta();
        }

        function renderColumn() {
            document.getElementById('back-text').textContent = COLUMNS_I18N.BACK_TO_LIST;
            document.getElementById('column-number').textContent = currentColumn.id === 'summary' ? 'Summary' : '#' + currentColumn.id;
            document.getElementById('read-time').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${currentColumn.readTime} ${COLUMNS_I18N.READ_TIME}`;
            document.getElementById('column-title').textContent = currentColumn.title;
            document.getElementById('column-subtitle').textContent = currentColumn.subtitle;
            document.getElementById('column-description').textContent = currentColumn.description;
            document.getElementById('column-content').innerHTML = currentColumn.content;
            document.title = `${currentColumn.title} - Economy Columns`;
            generateTOC();
        }

        function generateTOC() {
            const content = document.getElementById('column-content');
            const headings = content.querySelectorAll('h2');
            const tocList = document.getElementById('toc-list');
            const toc = document.getElementById('toc');
            if (headings.length > 2) {
                toc.classList.remove('hidden');
                tocList.innerHTML = Array.from(headings).map((heading, index) => {
                    heading.id = 'section-' + index;
                    return `<li><a href="#section-${index}" class="hover:text-blue-600 transition-colors">${heading.textContent}</a></li>`;
                }).join('');
            }
        }

        function setupReadingProgress() {
            const progressBar = document.getElementById('reading-progress');
            window.addEventListener('scroll', () => {
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPos = window.scrollY;
                const progress = (scrollPos / docHeight) * 100;
                progressBar.style.width = Math.min(progress, 100) + '%';
            });
        }

        function setupNavigation() {
            const currentIndex = COLUMNS_DATA.findIndex(col => col.id === currentColumn.id);
            if (currentIndex > 0) {
                const prevColumn = COLUMNS_DATA[currentIndex - 1];
                const prevLink = document.getElementById('prev-link');
                prevLink.href = `column.html?id=${prevColumn.id}`;
                document.getElementById('prev-title').textContent = prevColumn.title;
                prevLink.classList.remove('hidden');
            }
            if (currentIndex < COLUMNS_DATA.length - 1) {
                const nextColumn = COLUMNS_DATA[currentIndex + 1];
                const nextLink = document.getElementById('next-link');
                nextLink.href = `column.html?id=${nextColumn.id}`;
                document.getElementById('next-title').textContent = nextColumn.title;
                nextLink.classList.remove('hidden');
            }
        }

        function updateMeta() {
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.content = currentColumn.description;
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify({
                "@context": "https://schema.org", "@type": "Article",
                "headline": currentColumn.title, "description": currentColumn.description,
                "author": { "@type": "Organization", "name": "Economy Helper" },
                "publisher": { "@type": "Organization", "name": "Economy Helper", "logo": { "@type": "ImageObject", "url": "https://economyhelper.com/images/logo.png" } },
                "mainEntityOfPage": { "@type": "WebPage", "@id": window.location.href }
            });
            document.head.appendChild(script);
        }

        function shareToTwitter() {
            const text = encodeURIComponent(`${currentColumn.title}: ${currentColumn.subtitle}`);
            const url = encodeURIComponent(window.location.href);
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
        }

        function shareToFacebook() {
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const copyText = document.getElementById('copy-text');
                copyText.textContent = 'Copied!';
                setTimeout(() => { copyText.textContent = 'Copy Link'; }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initComponents('columnDetail');
            initColumnPage();
        });
    </script>
</body>

</html>
