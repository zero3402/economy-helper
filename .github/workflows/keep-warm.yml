# 잠든 인스턴스를 아침에 한 번 깨운다. **깨어 있게 유지하는 일은 앱이 한다**(SelfPing).
#
# 역할을 나눈 이유는 실측이다. GitHub 예약 실행의 전달률이 6~11%였다 —
# 4시간 28분에 3회, 예정은 27~53회. 문서가 "부하가 높으면 지연되거나 건너뛴다"고
# 명시한 그대로라 15분 박자에는 쓸 수 없다.
#
# 다만 **기상 한 번**에는 충분하다. KST 06:00~08:59에 5분 간격이면 36회 시도이고,
# 전달률이 10%여도 한 번은 성공할 확률이 98%다. 09시 브리핑 전에 깨어 있으면 된다.
#
# Render 무료는 "15분 무활동 시 스핀다운"이고 재기동에 ~1분 걸린다. 그냥 두면 하루 대부분
# 첫 요청이 1분씩 걸린다. 인바운드 트래픽이 깨우므로 health를 주기적으로 치면 된다.
#
# ⚠️ 왜 완전 24/7이 아닌가 — 산수 때문이다.
#   무료 한도는 워크스페이스당 월 750 인스턴스-시간이고, 넘기면 Render가 그 달 내내
#   모든 무료 웹 서비스를 정지시킨다("suspends all of your Free web services").
#   24시간 x 31일 = 744시간이라 여유가 6시간뿐이다. 무료 웹 서비스를 하나만 더 붙이거나
#   배포가 잦으면 한도를 넘겨 한 달을 통째로 잃는다.
#   KST 04:00~06:00 두 시간을 재우면 682시간이 되어 여유가 68시간이 된다 —
#   그 시간대 첫 요청만 ~1분 늦고, 연간 가동률은 오히려 이쪽이 높다.
#
# 발송 엔드포인트가 아니라 health를 친다. 공개돼도 무해하므로 시크릿이 필요 없고,
# 앱에는 배포처를 아는 코드가 한 줄도 없다 — 항상 켜져 있는 호스트로 옮기면 이 파일만 지운다.

name: Keep warm

on:
  schedule:
    # UTC. KST = UTC+9 이므로 UTC 19·20시를 빼면 KST 04:00~05:59가 빈다.
    # 정각을 피해 2분 오프셋을 준다 — GitHub 예약 실행은 정시에 몰려 지연된다.
    #
    # UTC 21~23 = KST 06:00~08:59. 앱이 자는 창(KST 04:00~05:59) 바로 다음이고,
    # 09시 브리핑 전이다. 그 뒤로는 SelfPing이 맡으므로 여기서 더 칠 이유가 없다.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 21-23 * * *"
  workflow_dispatch:

# 앞선 실행이 재기동을 기다리는 중이면 겹치지 않게 한다
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: health 핑
        env:
          # 시크릿이 아니라 변수다. Settings → Secrets and variables → Actions → Variables
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          # 조용히 넘어가지 않는다. 예전에는 exit 0이라 변수를 안 넣은 채로도 초록이었고,
          # "잘 돌고 있는데 서버는 잔다"로 보였다. 빨간 X여야 눈에 띈다
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::SERVICE_URL 변수가 없습니다. Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

          # liveness를 친다 — /actuator/health는 Redis를 포함해 Redis가 끊기면 503이다
          # (실측: Redis 없이 띄우면 health 503, liveness 200). 깨우는 게 목적이라
          # 앱이 살아 있는지만 보면 된다. Boot 4는 이 그룹을 기본으로 열어 준다.
          #
          # 상태 코드와 소요 시간을 반드시 남긴다. 이게 없어서 "깨어 있었는지 자다 깬
          # 것인지"를 구분할 수 없었다 — 스핀다운을 진단할 유일한 단서다.
          #   200 0.3s → 깨어 있었다
          #   200 45s  → 자고 있었다. 앞선 핑이 밀렸다는 뜻이다
          #   404      → 주소나 probes 설정이 틀렸다
          result=$(curl -s -o /dev/null -m 90 -w "%{http_code} %{time_total}" \
            "$SERVICE_URL/actuator/health/liveness" || echo "무응답 -")
          echo "$result"
          echo "\`$result\` — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"

          # 깨우는 것이 목적이라 응답이 늦거나 실패해도 워크플로를 깨뜨리지 않는다.
          # 요청 자체가 Render에 닿았으면 유휴 타이머는 이미 리셋됐다
          case "$result" in
            200*) ;;
            *) echo "::warning::기대한 200이 아닙니다: $result" ;;
          esac
