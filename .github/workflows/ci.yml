# 푸시할 때마다 테스트를 돌리고, 통과했을 때만 이미지를 굽는다.
#
# CLAUDE.md의 "반드시 테스트를 넘겨야 다음거 진행 가능"을 파이프라인으로 옮긴 것이다 —
# 그래서 잡을 둘로 나누고 needs로 묶는다. 한 잡에 넣으면 테스트가 깨져도 이미지가 올라갈 수 있다.
#
# 시크릿을 쓰지 않는다. 외부 호출은 전부 WireMock으로 스텁하고 Redis는 Testcontainers라
# application.yml의 빈 기본값(${GEMINI_API_KEY:})만으로 테스트가 그대로 돈다.
# 넣어 두면 PR에서 유출될 경로만 생긴다.

name: CI

on:
  push:
    branches: [main]
    # 문서만 고쳤는데 이미지를 다시 굽고 GHCR에 올릴 이유가 없다
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소한다 — 무료 러너 시간을 아낀다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # DigestIntegrationTest가 Testcontainers로 진짜 Redis를 띄운다.
    # ubuntu-latest에는 Docker가 있어 그대로 돈다.
    steps:
      - uses: actions/checkout@v7

      # 래퍼 jar가 바뀌어 들어오는 공급망 공격을 막는다. 검증이 싸므로 항상 켠다
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # 가상 스레드. build.gradle 툴체인과 반드시 같아야 한다

      - uses: gradle/actions/setup-gradle@v6

      # --no-daemon을 쓰지 않는다. setup-gradle이 데몬을 통해 캐시를 저장하므로
      # 끄면 오히려 다음 실행이 느려진다(액션 문서가 명시한다).
      # --build-cache는 바뀌지 않은 태스크의 산출물을 러너 간에 재사용한다
      - name: 테스트
        working-directory: backend
        run: ./gradlew test --build-cache

      # 실패했을 때 어느 테스트가 왜 깨졌는지 로그만으로는 알기 어렵다
      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시에 필요하다. 기본 GITHUB_TOKEN으로 충분해 시크릿이 없다
    steps:
      - uses: actions/checkout@v7

      # arm64 레이어를 amd64 러너에서 굽기 위한 에뮬레이터.
      # Gradle 빌드는 Dockerfile의 --platform=$BUILDPLATFORM 덕에 네이티브로 도므로
      # 여기서 에뮬레이션되는 건 런타임 스테이지의 useradd 정도다 — 그래서 아직 QEMU로 둔다.
      # 이게 병목이 되면 ubuntu-24.04-arm 러너로 아키별 빌드를 나누고 manifest로 합치면 된다
      # (공개 저장소는 무료, 비공개는 유료라 저장소 공개 여부를 확인한 뒤 옮길 것).
      - uses: docker/setup-qemu-action@v4

      # 러너의 기본 buildx 드라이버는 'docker'이고 캐시 export를 지원하지 않는다
      # ("Cache export is not supported for the docker driver" — 첫 실행에서 실제로 터졌다).
      # 이 액션이 docker-container 드라이버를 만들어 아래 cache-to type=gha가 성립한다.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest만 달면 롤백할 대상이 없다. 커밋 SHA 태그가 되돌아갈 지점이 된다
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: backend
          # 단일 아키로 구우면 러너 아키(amd64)만 나온다 — 첫 성공 실행에서 실제로 그랬고
          # arm64 Mac에서 pull조차 안 됐다. CLAUDE.md의 Oracle Cloud Always Free는
          # Ampere(ARM)라 amd64만 있으면 배포처가 정해지는 순간 다시 구워야 한다.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 의존성 레이어를 러너 간에 재사용한다. 없으면 매번 Gradle 의존성을 처음부터 받는다
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 증명(provenance)·SBOM 첨부를 끈다. 기본값이 켜져 있어 매 푸시마다 추가
          # 매니페스트를 만들고 올리는데, 우리는 SHA 태그로 되돌아갈 지점을 이미 남긴다
          provenance: false
          sbom: false
