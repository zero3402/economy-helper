        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function startTest() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            const section = sections[question.section];

            // Update section info
            document.getElementById('section-icon').textContent = section.icon;
            document.getElementById('section-title').textContent = section.title;
            document.getElementById('section-desc').textContent = section.description;

            // Update question
            document.getElementById('question-number').textContent = `${currentQuestion + 1}/${questions.length}`;
            document.getElementById('question-text').textContent = question.text;

            // Create answer buttons
            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = question.options.map((option, index) => `
                <button onclick="selectAnswer(${index})" class="answer-btn w-full text-left p-4 rounded-xl border-2 transition-all ${answers[currentQuestion] === index ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50'}">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${answers[currentQuestion] === index ? 'border-blue-500 bg-blue-500' : 'border-slate-300'}">
                            ${answers[currentQuestion] === index ? '<svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>' : ''}
                        </div>
                        <span class="text-sm sm:text-base">${option}</span>
                    </div>
                </button>
            `).join('');

            // Update progress
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `${currentQuestion + 1}/50`;

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').disabled = answers[currentQuestion] === null;
            document.getElementById('next-btn').textContent = currentQuestion === questions.length - 1 ? '결과 보기' : '다음';
        }

        function selectAnswer(answerIndex) {
            answers[currentQuestion] = answerIndex;
            showQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        function nextQuestion() {
            if (answers[currentQuestion] !== null) {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    showQuestion();
                } else {
                    showResults();
                }
            }
        }

        function calculateResults() {
            const scores = {
                safeGuard: 0,
                aggressiveBull: 0,
                strategicPlanner: 0,
                valueSeeker: 0,
                trendFollower: 0
            };

            // Scoring logic based on question types and answers
            questions.forEach((q, index) => {
                const answerValue = answers[index];
                if (answerValue !== null) {
                    // Different weight based on answer position (0-3 maps to different personality scores)
                    switch(answerValue) {
                        case 0:
                            scores.safeGuard += q.type === 'safeGuard' ? 3 : 1;
                            scores.strategicPlanner += 1;
                            break;
                        case 1:
                            scores.valueSeeker += q.type === 'valueSeeker' ? 3 : 1;
                            scores.strategicPlanner += q.type === 'strategicPlanner' ? 2 : 1;
                            break;
                        case 2:
                            scores.aggressiveBull += q.type === 'aggressiveBull' ? 2 : 1;
                            scores.trendFollower += 1;
                            break;
                        case 3:
                            scores.aggressiveBull += q.type === 'aggressiveBull' ? 3 : 1;
                            scores.trendFollower += q.type === 'trendFollower' ? 3 : 1;
                            break;
                    }
                }
            });

            const topType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            return { scores, topType };
        }

        function showResults() {
            const { scores, topType } = calculateResults();
            const personality = personalityTypes[topType];

            document.getElementById('test-screen').classList.add('hidden');

            // Scroll to top
            window.scrollTo(0, 0);

            // Update result display

                    <p class="text-xs text-slate-600">${compat.good.reason}</p>
                </a>
                <a href="results/${resultPages[compat.challenging.type]}.html" class="bg-gradient-to-br from-orange-50 to-amber-50 rounded-xl p-4 border border-orange-200 hover:shadow-md hover:scale-[1.02] transition-all cursor-pointer block">

                        <span class="text-lg">🧡</span>
                        <span class="text-xs font-semibold text-orange-700 uppercase">도전적인 관계</span>
                    </div>
                    <h4 class="font-semibold text-slate-800 mb-1">${personalityTypes[compat.challenging.type].emoji} ${personalityTypes[compat.challenging.type].name}</h4>
                    <p class="text-xs text-slate-600">${compat.challenging.reason}</p>
                </a>
            `;
            document.getElementById('compatibility-list').innerHTML = compatibilityHTML;

            // Store current result for download/share
            window.currentResult = { topType, personality };
        }

        function restartTest() {
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        // Map topType to result page URL
        const resultPages = {
            safeGuard: 'safe-guard',
            aggressiveBull: 'aggressive-bull',
            strategicPlanner: 'strategic-planner',
            valueSeeker: 'value-seeker',
            trendFollower: 'trend-follower'
        };

        function getShareData() {
            const { topType, personality } = window.currentResult;
            const baseUrl = window.location.origin;
            const resultUrl = `${baseUrl}/results/${resultPages[topType]}.html`;
            const text = `금융 성향 테스트를 해봤어요! 저는 "${personality.name}"입니다! ${personality.slogan}`;
            return { topType, personality, resultUrl, text };
        }

        function shareResults() {
            const { personality, resultUrl, text } = getShareData();

            if (navigator.share) {
                navigator.share({
                    title: `저는 ${personality.name}!`,
                    text: text,
                    url: resultUrl
                });
            } else {
                document.getElementById('copy-link-text').textContent = '링크 복사';
                document.getElementById('share-modal').showModal();
            }
        }

        function shareToTwitter() {
            const { resultUrl, text } = getShareData();
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(resultUrl)}`;
            window.open(twitterUrl, '_blank', 'width=550,height=420');
        }

        function shareToFacebook() {
            const { resultUrl } = getShareData();
            const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(resultUrl)}`;
            window.open(facebookUrl, '_blank', 'width=550,height=420');
        }

        function copyShareLink() {
            const { resultUrl, text } = getShareData();
            const fullText = `${text}\n\n내 결과 보기: ${resultUrl}`;
            navigator.clipboard.writeText(fullText).then(() => {
                document.getElementById('copy-link-text').textContent = '복사됨!';
                setTimeout(() => {
                    document.getElementById('copy-link-text').textContent = '링크 복사';
                }, 2000);
            });
        }

        // Initialize Header & Footer
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initComponents === 'function') {
                initComponents('personality');
            }
        });
