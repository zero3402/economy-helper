            { text: "인내심을 시험하는 상황에서 어떻게 하시나요?", section: 2, type: "safeGuard", options: ["끝까지 기다린다", "대부분 참지만 한계가 있다", "빨리 포기하는 편이다", "즉시 다른 기회를 찾는다"] },
            
            // 섹션 4: 시장 태도 (10개)
            { text: "시장의 효율성에 대해 어떻게 생각하시나요?", section: 3, type: "valueSeeker", options: ["완전히 효율적이다", "대체로 효율적이다", "비효율적이다", "매우 비효율적이다"] },

            { text: "시장 예측에 대한 생각은?", section: 3, type: "aggressiveBull", options: ["불가능하다", "장기 트렌드만 가능하다", "어느 정도 가능하다", "충분히 가능하다"] },
            { text: "다른 사람의 투자 성공담을 들었을 때?", section: 3, type: "trendFollower", options: ["나만의 전략을 고수한다", "참고만 한다", "비슷하게 따라 해볼까 고려한다", "즉시 따라 한다"] },
            { text: "시장 붕괴 가능성에 대해 얼마나 걱정하시나요?", section: 3, type: "safeGuard", options: ["항상 대비하고 있다", "가끔 생각한다", "별로 걱정 안 한다", "전혀 걱정 안 한다"] },
            { text: "새로운 투자 트렌드(가상화폐, AI 등)에 대한 태도는?", section: 3, type: "trendFollower", options: ["회의적이다 - 검증된 것만 투자한다", "조심스럽게 관찰한다", "관심 있다 - 소액 투자 고려 중이다", "적극적으로 투자한다"] },
            { text: "시장이 비합리적으로 보일 때?", section: 3, type: "valueSeeker", options: ["기회로 본다", "조심스럽게 접근한다", "관망한다", "시장을 따라간다"] },
            { text: "금융 위기 시 당신의 전략은?", section: 3, type: "safeGuard", options: ["현금 비중을 높인다", "포트폴리오를 유지한다", "선별적으로 매수한다", "공격적으로 매수한다"] },
            
            // 섹션 5: 재무 목표 (10개)
            { text: "가장 중요한 재무 목표는 무엇인가요?", section: 4, type: "safeGuard", options: ["자산 보존", "안정적인 수입", "자산 증식", "빠른 부의 축적"] },
            { text: "은퇴 후 생활에 대한 계획은?", section: 4, type: "valueSeeker", options: ["매우 구체적인 계획이 있다", "대략적인 목표가 있다", "막연하게 생각만 한다", "아직 생각 안 해봤다"] },
            { text: "자녀 교육비 vs 은퇴 준비, 어느 것이 더 중요한가요?", section: 4, type: "safeGuard", options: ["둘 다 동등하게 중요하다", "은퇴 준비가 우선이다", "자녀 교육비가 우선이다", "상황에 따라 달라진다"] },
            { text: "재정적 자유에 대한 정의는?", section: 4, type: "valueSeeker", options: ["기본 생활이 보장되는 것", "현재 생활 수준 유지", "원하는 것을 할 수 있는 것", "완전한 경제적 독립"] },
            { text: "투자 목표 수익률은 얼마인가요?", section: 4, type: "aggressiveBull", options: ["연 3-5% - 안정성 중시", "연 5-10% - 균형 추구", "연 10-20% - 성장 추구", "연 20%+ - 공격적 성장"] },
            { text: "부채에 대한 당신의 철학은?", section: 4, type: "safeGuard", options: ["절대 빚지지 않는다", "필요할 때만 최소한으로", "좋은 빚은 활용한다", "레버리지로 적극 활용한다"] },
            { text: "비상 자금은 얼마나 준비하시나요?", section: 4, type: "safeGuard", options: ["생활비 6개월 이상", "생활비 3-6개월", "생활비 1-3개월", "거의 없다"] },
            { text: "수입이 늘었을 때, 무엇을 하시겠어요?", section: 4, type: "aggressiveBull", options: ["저축과 투자를 늘린다", "일부는 저축, 일부는 소비한다", "대부분 투자에 사용한다", "소비 수준을 높인다"] },
            { text: "재무 계획에서 가장 중요한 것은?", section: 4, type: "strategicPlanner", options: ["안전성과 확실성", "균형과 다양성", "성장과 기회", "유연성과 적응력"] },
            { text: "목표 달성을 위해 얼마나 희생할 수 있나요?", section: 4, type: "valueSeeker", options: ["현재 삶의 질을 크게 희생할 수 있다", "적당한 수준의 희생은 괜찮다", "큰 희생은 어렵다", "현재를 즐기는 게 더 중요하다"] }
        ];

        // Map topType to result page URL
        const resultPages = {
            safeGuard: 'safe-guard',
            aggressiveBull: 'aggressive-bull',
            strategicPlanner: 'strategic-planner',
            valueSeeker: 'value-seeker',
            trendFollower: 'trend-follower'
        };

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function startTest() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            const section = sections[question.section];

            // Update section info
            document.getElementById('section-icon').textContent = section.icon;
            document.getElementById('section-title').textContent = section.title;
            document.getElementById('section-desc').textContent = section.description;

            // Update question
            document.getElementById('question-number').textContent = `${currentQuestion + 1}/${questions.length}`;
            document.getElementById('question-text').textContent = question.text;

            // Create answer buttons
            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = question.options.map((option, index) => `
                <button onclick="selectAnswer(${index})" class="answer-btn w-full text-left p-4 rounded-xl border-2 transition-all ${answers[currentQuestion] === index ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50'}">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${answers[currentQuestion] === index ? 'border-blue-500 bg-blue-500' : 'border-slate-300'}">
                            ${answers[currentQuestion] === index ? '<svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>' : ''}
                        </div>
                        <span class="text-sm sm:text-base">${option}</span>
                    </div>
                </button>
            `).join('');

            // Update progress
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `${currentQuestion + 1}/50`;

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = currentQuestion === 0;
            document.getElementById('next-btn').disabled = answers[currentQuestion] === null;
            document.getElementById('next-btn').textContent = currentQuestion === questions.length - 1 ? '결과 보기' : '다음';
        }

        function selectAnswer(answerIndex) {
            answers[currentQuestion] = answerIndex;
            showQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                showQuestion();
            }
        }

        function nextQuestion() {
            if (answers[currentQuestion] !== null) {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    showQuestion();
                } else {
                    showResults();
                }
            }
        }

        function calculateResults() {
            const scores = {
                safeGuard: 0,
                aggressiveBull: 0,
                strategicPlanner: 0,
                valueSeeker: 0,
                trendFollower: 0
            };

            // Scoring logic based on question types and answers
            questions.forEach((q, index) => {
                const answerValue = answers[index];
                if (answerValue !== null) {
                    // Different weight based on answer position (0-3 maps to different personality scores)
                    switch(answerValue) {
                        case 0:
                            scores.safeGuard += q.type === 'safeGuard' ? 3 : 1;
                            scores.strategicPlanner += 1;
                            break;
                        case 1:
                            scores.valueSeeker += q.type === 'valueSeeker' ? 3 : 1;
                            scores.strategicPlanner += q.type === 'strategicPlanner' ? 2 : 1;
                            break;
                        case 2:
                            scores.aggressiveBull += q.type === 'aggressiveBull' ? 2 : 1;
                            scores.trendFollower += 1;
                            break;
                        case 3:
                            scores.aggressiveBull += q.type === 'aggressiveBull' ? 3 : 1;
                            scores.trendFollower += q.type === 'trendFollower' ? 3 : 1;
                            break;
                    }
                }
            });

            const topType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            return { scores, topType };
        }

        function showResults() {
            const { topType } = calculateResults();
            // Redirect to result page
            window.location.href = `results/${resultPages[topType]}.html`;
        }

        // Initialize Header & Footer
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initComponents === 'function') {
                initComponents('personality');
            }
        });
    </script>
