        // 한글 초성 추출 함수
        function getKoreanInitial(char) {
            const code = char.charCodeAt(0) - 44032;
            if (code > -1 && code < 11172) {
                return String.fromCharCode(Math.floor(code / 588) + 4352);
            }
            return char;
        }

        // 초성을 자모로 변환
        function initialToJamo(initial) {
            const initials = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
            const code = initial.charCodeAt(0) - 4352;
            return initials[code] || initial;

        const koreanTerms = Object.keys(termDefinitions).sort((a, b) => a.localeCompare(b, 'ko'));

        function searchDictionary(query) {
            const lowerQuery = query.toLowerCase();
            return koreanTerms
                .filter(term => term.toLowerCase().includes(lowerQuery))
                .map(term => ({
                    letter: getKoreanInitial(term[0]),
                    term: term
                }));
        }

        function filterByLetter(letter) {
            if (letter === 'ALL') {
                return koreanTerms.map(term => ({
                    letter: initialToJamo(getKoreanInitial(term[0])),
                    term: term
                }));
            }
            return koreanTerms
                .filter(term => {
                    const initial = initialToJamo(getKoreanInitial(term[0]));
                    return initial === letter;
                })
                .map(term => ({
                    letter: letter,
                    term: term
                }));
        }

        function showTermModal(term) {
            const modal = document.getElementById('term-modal');
            const modalTerm = document.getElementById('modal-term');
            const modalDefinition = document.getElementById('modal-definition');
            const modalExample = document.getElementById('modal-example');

            const termData = termDefinitions[term];

            modalTerm.textContent = term;

            if (termData) {
                modalDefinition.textContent = termData.definition;
                modalExample.textContent = termData.example;
            } else {
                modalDefinition.textContent = '정의가 곧 추가될 예정입니다.';
                modalExample.textContent = '예시가 곧 추가될 예정입니다.';
            }

            modal.showModal();
        }

        function displayResults(results, title, hideCount = false) {
            const resultsContainer = document.getElementById('search-results');
            const resultsTitle = document.getElementById('results-title');
            const resultsCount = document.getElementById('results-count');
            const resultsList = document.getElementById('results-list');

            resultsTitle.textContent = title;
            resultsCount.textContent = hideCount ? '' : `${results.length}개 용어 발견`;

            resultsList.innerHTML = results.map(({ letter, term }) => `
                <div class="term-card bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl p-3 sm:p-4 cursor-pointer flex items-center gap-3" onclick="showTermModal('${term.replace(/'/g, "\\'")}')">
                    <span class="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold text-sm flex items-center justify-center flex-shrink-0">${initialToJamo(letter)}</span>
                    <span class="text-slate-700 font-medium text-sm sm:text-base truncate">${term}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            `).join('');

            resultsContainer.classList.remove('hidden');
        }

        // 오늘의 용어
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function getTodaysTerms(count = 10) {
            const today = new Date();
            const dateSeed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();

            const selectedTerms = [];
            const usedIndices = new Set();

            for (let i = 0; i < count && i < koreanTerms.length; i++) {
                let index;
                let attempts = 0;
                do {
                    index = Math.floor(seededRandom(dateSeed + i + attempts * 100) * koreanTerms.length);
                    attempts++;
                } while (usedIndices.has(index) && attempts < 100);

                usedIndices.add(index);
                selectedTerms.push(koreanTerms[index]);
            }

            return selectedTerms;
        }

        function initTodaysTerms() {
            const terms = getTodaysTerms(10);
            const container = document.getElementById('todays-terms-list');

            container.innerHTML = terms.map(term => `
                <button onclick="showTermModal('${term.replace(/'/g, "\\'")}')" class="px-3 py-1.5 bg-white hover:bg-blue-100 border border-blue-200 hover:border-blue-400 rounded-lg text-sm font-medium text-slate-700 hover:text-blue-700 transition-all cursor-pointer">
                    ${term}
                </button>
            `).join('');
        }


        document.addEventListener('DOMContentLoaded', async () => {

            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const alphabetBtns = document.querySelectorAll('.alphabet-btn');

            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    const results = searchDictionary(query);
                    displayResults(results, `"${query}" 검색 결과`);
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        const results = searchDictionary(query);
                        displayResults(results, `"${query}" 검색 결과`);
                    }
                }
            });

            let debounceTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = searchInput.value.trim();
                    if (query.length >= 2) {
                        const results = searchDictionary(query);
                        displayResults(results, `"${query}" 검색 결과`);
                    } else if (query.length === 0) {
                        document.getElementById('search-results').classList.add('hidden');
                    }
                }, 300);
            });

            alphabetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all buttons
                    alphabetBtns.forEach(b => {
                        b.classList.remove('bg-blue-600', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    // Activate clicked button
                    btn.classList.remove('bg-slate-100', 'text-slate-600');
                    btn.classList.add('bg-blue-600', 'text-white');

                    const letter = btn.dataset.letter;
                    const results = filterByLetter(letter);
                    const title = letter === 'ALL' ? '전체 금융 용어' : `"${letter}"로 시작하는 용어`;
                    displayResults(results, title, true);

                    searchInput.value = '';
                });
            });

            // Initial state: Show ALL terms
            const allBtn = document.querySelector('.alphabet-btn[data-letter="ALL"]');
            allBtn.classList.remove('bg-slate-100', 'text-slate-600');
            allBtn.classList.add('bg-blue-600', 'text-white');
            displayResults(filterByLetter('ALL'), '전체 금융 용어', true);

            // Initialize 오늘의 용어
            initTodaysTerms();

            // Initialize Header & Footer
            initComponents('dictionary');
        });
    </script>
    <script src="../components.js"></script>

</body>

</html>
