<!DOCTYPE html>
<html lang="ko" data-theme="corporate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>경제 용어 퀴즈 - 경제 도우미</title>
    <meta name="description" content="경제 용어 퀴즈로 경제 지식을 테스트하고 향상시키세요.">
    <link rel="canonical" href="https://economyhelper.com/kr/economy-quiz.html">
    <link rel="alternate" hreflang="en" href="https://economyhelper.com/us/economy-quiz.html">
    <link rel="alternate" hreflang="ko" href="https://economyhelper.com/kr/economy-quiz.html">
    <link rel="alternate" hreflang="ja" href="https://economyhelper.com/jp/economy-quiz.html">
    <link rel="alternate" hreflang="es" href="https://economyhelper.com/es/economy-quiz.html">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="../images/favicon.png">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800 mb-2">경제 용어 퀴즈</h1>
                <p class="text-slate-500">정의를 보고 올바른 경제 용어를 맞춰보세요!</p>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container"
                class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 relative overflow-hidden">
                <!-- Progress & Score -->
                <div class="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                    <span id="question-count">문제 1</span>
                    <span id="score-display" class="text-blue-600">점수: 0</span>
                </div>

                <!-- Initial Loading / Error State -->
                <div id="loading" class="text-center py-10">
                    <span class="loading loading-spinner loading-lg text-blue-500"></span>
                    <p class="mt-4 text-slate-500">퀴즈를 준비 중입니다...</p>
                </div>

                <!-- Game Area -->
                <div id="game-area" class="hidden">
                    <!-- Question (Definition) -->
                    <div class="bg-blue-50 rounded-xl p-6 mb-8 text-center">
                        <p class="text-sm text-blue-600 font-semibold mb-2">다음 정의에 해당하는 용어는?</p>
                        <p id="question-text"
                            class="text-lg sm:text-xl text-slate-800 font-medium leading-relaxed break-keep"></p>
                    </div>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        <!-- Options will be injected here -->
                    </div>

                    <!-- Actions area (Hint & Next) -->
                    <div class="flex flex-col gap-3 mt-6">
                        <button id="hint-btn" onclick="toggleHint()"
                            class="btn btn-ghost btn-sm text-slate-500 hover:text-blue-600 gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            힌트 보기
                        </button>

                        <div id="hint-area"
                            class="hidden p-4 bg-yellow-50 rounded-lg border border-yellow-100 text-sm text-yellow-800">
                            <span class="font-bold">💡 힌트:</span> <span id="hint-text"></span>
                        </div>

                        <button id="next-btn" onclick="goToNextQuestion()"
                            class="hidden btn btn-primary w-full gap-2 mt-2 py-4 h-auto text-lg shadow-lg shadow-blue-100">
                            다음 문제
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Result Area (Level Finished) -->
                <div id="result-area" class="hidden text-center py-8">
                    <div class="mb-6">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">퀴즈 완료!</h2>
                        <p class="text-slate-600">당신의 경제 지식 점수는?</p>
                    </div>

                    <div class="text-4xl font-black text-blue-600 mb-8" id="final-score">0점</div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="location.reload()" class="btn btn-primary px-8">다시 도전하기</button>
                        <a href="index.html" class="btn btn-outline">사전으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="bg-white border-t border-slate-200 mt-12"></footer>

    <!-- Logic -->
    <script src="dictionary-data.js"></script>
    <script src="../components.js"></script>
    <script>
        // Quiz State
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        const TOTAL_QUESTIONS = 10;
        let isAnswered = false;

        document.addEventListener('DOMContentLoaded', () => {
            initComponents('quiz'); // Initialize header/footer

            // Wait slightly for dictionary data if needed, though script load order ensures availability
            setTimeout(initQuiz, 100);
        });

        function initQuiz() {
            const loading = document.getElementById('loading');
            const gameArea = document.getElementById('game-area');

            if (typeof termDefinitions === 'undefined') {
                loading.innerHTML = '<p class="text-red-500">데이터를 불러오는데 실패했습니다.<br>새로고침을 해주세요.</p>';
                return;
            }

            // Generate Questions
            const allTerms = Object.keys(termDefinitions);
            questions = [];

            // Randomly select 10 unique terms
            const selectedIndices = new Set();
            while (selectedIndices.size < TOTAL_QUESTIONS && selectedIndices.size < allTerms.length) {
                const idx = Math.floor(Math.random() * allTerms.length);
                selectedIndices.add(idx);
            }

            selectedIndices.forEach(idx => {
                const term = allTerms[idx];
                const data = termDefinitions[term];

                // Create 3 wrong options
                const wrongOptions = [];
                const wrongIndices = new Set([idx]); // Avoid the correct answer

                while (wrongOptions.length < 3) {
                    const wrongIdx = Math.floor(Math.random() * allTerms.length);
                    if (!wrongIndices.has(wrongIdx)) {
                        wrongIndices.add(wrongIdx);
                        wrongOptions.push(allTerms[wrongIdx]);
                    }
                }

                questions.push({
                    term: term,
                    definition: data.definition,
                    example: data.example,
                    options: [...wrongOptions, term].sort(() => Math.random() - 0.5) // Shuffle options
                });
            });

            // Start Game
            loading.classList.add('hidden');
            gameArea.classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            isAnswered = false;
            const q = questions[currentQuestionIndex];

            // Update UI
            document.getElementById('question-count').textContent = `문제 ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('question-text').textContent = q.definition;
            document.getElementById('hint-area').classList.add('hidden');
            document.getElementById('hint-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hint-text').textContent = q.example;

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            q.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "btn btn-outline h-auto py-3 min-h-[3.5rem] bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:border-blue-300 normal-case font-normal text-base leading-snug";
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn, q.term);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = document.querySelectorAll('#options-grid button');

            if (selected === correct) {
                // Correct
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-success', 'text-white', 'border-success');
                score += 10;
                document.getElementById('score-display').textContent = `점수: ${score}`;
            } else {
                // Wrong
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-error', 'text-white', 'border-error');

                // Highlight correct answer
                buttons.forEach(btn => {
                    if (btn.textContent === correct) {
                        btn.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                        btn.classList.add('btn-success', 'text-white', 'border-success');
                    }
                });

                // Show Example as Hint/Learning on wrong answer
                const hintArea = document.getElementById('hint-area');
                document.getElementById('hint-text').textContent = questions[currentQuestionIndex].example;
                hintArea.classList.remove('hidden');
            }

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');

            // Show hint automatically
            document.getElementById('hint-area').classList.remove('hidden');
        }

        function toggleHint() {
            const hintArea = document.getElementById('hint-area');
            const hintBtn = document.getElementById('hint-btn');
            if (hintArea.classList.contains('hidden')) {
                hintArea.classList.remove('hidden');
                hintBtn.classList.add('text-blue-600', 'bg-blue-50');
            } else {
                hintArea.classList.add('hidden');
                hintBtn.classList.remove('text-blue-600', 'bg-blue-50');
            }
        }

        function goToNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');

            const finalScoreEl = document.getElementById('final-score');
            finalScoreEl.textContent = `${score}점`;

            // Simple animation
            finalScoreEl.classList.add('scale-110');
            setTimeout(() => finalScoreEl.classList.remove('scale-110'), 300);
        }
    </script>
</body>

</html>
