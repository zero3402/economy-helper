            { section: '섹션 1: 소비 태도 및 가치관', text: '인생은 한 번뿐이므로, 오늘을 위해 돈을 쓰는 것이 가치 있다고 생각한다.', weights: [3, -2, -1, 1, -1] },

            { section: '섹션 1: 소비 태도 및 가치관', text: '스트레스를 받으면 보상 심리로 쇼핑을 하는 편이다.', weights: [2, -1, -1, 1, 0] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '환경이나 윤리적 가치를 담은 제품이라면 더 비싸도 구매할 의향이 있다.', weights: [-1, 0, 3, 0, 1] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '명품 브랜드 제품을 소유하는 것은 내 성공을 증명하는 방법 중 하나다.', weights: [-1, -1, -1, 3, 0] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '시간을 아낄 수 있다면 비용이 조금 더 들어도 상관없다.', weights: [1, -1, 0, 1, 1] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '물건보다 여행이나 맛집 등 경험을 위해 돈을 쓰는 것이 더 좋다.', weights: [3, -1, 1, 0, -1] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '은행 잔고를 거의 매일 확인하며 지출을 통제한다.', weights: [-1, 3, 1, -1, 2] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '한정판 제품이나 지금 아니면 못 사는 물건에 쉽게 현혹된다.', weights: [2, -1, -2, 2, 0] },
            { section: '섹션 1: 소비 태도 및 가치관', text: '돈은 쌓아두기 위해서가 아니라 쓰기 위해 존재한다고 믿는다.', weights: [3, -3, 0, 1, -1] },
            // 섹션 2: 정보 수집 및 구매 결정 (10문항)

            { section: '섹션 2: 정보 수집 및 구매 결정', text: '최저가를 찾기 위해 여러 사이트를 비교하는 것이 즐겁다.', weights: [-1, 2, 1, -2, 3] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: 'SNS 광고에 나오는 제품을 보고 충동적으로 구매한 적이 많다.', weights: [2, -1, -1, 1, 0] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '전문가가 추천하거나 공신력 있는 기관의 인증을 받은 제품을 신뢰한다.', weights: [0, 1, 2, 0, 2] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '주변 사람들이나 친구들이 많이 사는 유행템은 꼭 사야 직성이 풀린다.', weights: [1, -1, -2, 2, 0] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '가성비(가격 대비 성능)보다는 가심비(가격 대비 심리적 만족)가 더 중요하다.', weights: [2, -2, 1, 2, -1] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '비싸더라도 한 번 살 때 제대로 된(오래 쓸 수 있는) 물건을 사는 편이다.', weights: [-1, 0, 3, 1, 1] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '포인트 적립이나 할인 쿠폰 이벤트를 찾아다니는 것이 생활화되어 있다.', weights: [-1, 2, 1, -1, 3] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '브랜드 가치가 내 이미지와 어울리는지 가장 먼저 고려한다.', weights: [0, -1, 0, 3, 0] },
            { section: '섹션 2: 정보 수집 및 구매 결정', text: '충동구매를 방지하기 위해 장바구니에 담아두고 3일 이상 고민한다.', weights: [-2, 3, 2, -1, 1] },

            { section: '섹션 5: 사회적 소비 및 철학', text: '돈을 쓸 때 "이것이 진짜 나에게 필요한가?"를 세 번 이상 자문한다.', weights: [-2, 3, 2, -1, 2] }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function startTest(resumeFromSaved = false) {
            const savedState = loadTestState();
            if (savedState && !resumeFromSaved) {
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0 && confirm('이전에 진행하던 테스트가 있습니다 (' + answeredCount + '/' + questions.length + '문항 완료). 이어서 하시겠습니까?\n\n"취소"를 누르면 처음부터 시작합니다.')) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                } else {
                    clearTestState();
                }
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            document.getElementById('total-q').textContent = questions.length;
            showQuestion(currentQuestion);
        }

        function showQuestion(index) {
            currentQuestion = index;
            const q = questions[index];
            saveTestState(currentQuestion, answers);

            document.getElementById('current-q').textContent = index + 1;
            document.getElementById('progress-percent').textContent = Math.round(((index + 1) / questions.length) * 100) + '%';
            document.getElementById('progress-bar').style.width = (((index + 1) / questions.length) * 100) + '%';
            document.getElementById('section-badge').textContent = q.section;
            document.getElementById('question-text').textContent = q.text;

            document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
            if (answers[index] !== null) {
                const selectedBtn = document.querySelector(`.answer-btn[data-value="${answers[index]}"]`);
                if (selectedBtn) selectedBtn.classList.add('selected');
            }

            document.getElementById('prev-btn').disabled = index === 0;
            updateNextButton();

            const card = document.getElementById('question-card');
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');
        }

        function selectAnswer(value) {
            answers[currentQuestion] = value;
            document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`.answer-btn[data-value="${value}"]`).classList.add('selected');
            updateNextButton();
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) nextQuestion();
            }, 300);
        }

        function updateNextButton() {
            const nextBtn = document.getElementById('next-btn');
            const isLastQuestion = currentQuestion === questions.length - 1;
            const hasAnswer = answers[currentQuestion] !== null;
            nextBtn.disabled = !hasAnswer;
            nextBtn.innerHTML = isLastQuestion
                ? '결과 보기 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>'
                : '다음 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>';
        }

        function prevQuestion() {
            if (currentQuestion > 0) showQuestion(currentQuestion - 1);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                showQuestion(currentQuestion + 1);
            } else {
                showResults();
            }
        }

        function calculateScores() {
            const currentTypes = ['yoloer', 'ultraSaver', 'valueConsumer', 'flexMaster', 'smartSpender'];
            const scores = {};
            currentTypes.forEach(type => scores[type] = 0);

            questions.forEach((q, i) => {
                const answer = answers[i];
                const normalizedAnswer = (answer - 4) / 3;
                currentTypes.forEach((type, j) => {
                    scores[type] += normalizedAnswer * q.weights[j];
                });
            });

            const maxPossible = questions.length * 3;
            currentTypes.forEach(type => {
                scores[type] = Math.round(((scores[type] + maxPossible) / (maxPossible * 2)) * 100);
                scores[type] = Math.max(0, Math.min(100, scores[type]));
            });
            return scores;
        }

        function showResults() {
            const scores = calculateScores();
            const sortedTypes = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sortedTypes[0][0];
            clearTestState();
            window.location.href = `results/spending/${resultPages[topType]}.html`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initComponents === 'function') {
                initComponents('personality-spending');
            }

            const savedState = loadTestState();
            if (savedState) {
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.remove('hidden');
                    document.getElementById('total-q').textContent = questions.length;
                    showQuestion(currentQuestion);
                }
            }
        });
    </script>
