<!DOCTYPE html>
<html lang="ko" data-theme="corporate" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>목돈 마련 계산기</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
    <script src="../components.js"></script>
    <script>initHead('savingsGoal');</script>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Header -->
    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-6 sm:py-10">
        <div class="max-w-4xl mx-auto">
            <!-- Title -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">저축 목표 계산기</h1>
                <p class="text-slate-500">재정 목표 달성을 위해 얼마나 저축해야 하는지 알아보세요</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Calculator Form -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-6">목표 설정</h2>

                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">목표 금액 (원)</label>
                            <input type="text" id="goalAmount" value="100,000,000" class="input input-bordered w-full" placeholder="목표 금액을 입력하세요">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">현재 저축액 (원)</label>
                            <input type="text" id="currentSavings" value="5,000,000" class="input input-bordered w-full" placeholder="현재 저축액을 입력하세요">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">목표 기간 (년)</label>
                            <input type="number" id="years" value="10" min="1" max="50" step="1" class="input input-bordered w-full" placeholder="기간을 입력하세요">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">예상 연 수익률 (%)</label>
                            <input type="number" id="rate" value="6" min="0" max="30" step="0.5" class="input input-bordered w-full" placeholder="수익률을 입력하세요">
                        </div>

                        <button onclick="calculate()" class="btn btn-primary w-full rounded-xl">
                            계산하기
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Results -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-6">저축 계획</h2>

                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-4 border border-blue-200">
                            <div class="text-sm text-blue-600 font-medium mb-1">필요 월 저축액</div>
                            <div id="monthlySavings" class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-bold text-blue-700 break-all">0원</div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-slate-50 rounded-xl p-4">
                                <div class="text-sm text-slate-500 mb-1">총 저축 필요액</div>
                                <div id="totalToSave" class="text-base sm:text-lg md:text-xl font-semibold text-slate-700 break-all">0원</div>
                            </div>
                            <div class="bg-green-50 rounded-xl p-4">
                                <div class="text-sm text-green-500 mb-1">예상 이자 수익</div>
                                <div id="interestEarned" class="text-base sm:text-lg md:text-xl font-semibold text-green-700 break-all">0원</div>
                            </div>
                        </div>

                        <div class="bg-purple-50 rounded-xl p-4">
                            <div class="text-sm text-purple-500 mb-1">목표</div>
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1">
                                <div id="goalDisplay" class="text-base sm:text-lg md:text-xl font-semibold text-purple-700 break-all">1억원</div>
                                <div id="yearsDisplay" class="text-sm text-purple-600">10년 후</div>
                            </div>
                        </div>

                        <!-- Progress visualization -->
                        <div class="bg-slate-50 rounded-xl p-4">
                            <div class="text-sm text-slate-500 mb-2">저축 vs 이자 비율</div>
                            <div class="flex h-6 rounded-full overflow-hidden">
                                <div id="savingsBar" class="bg-blue-500 transition-all duration-500" style="width: 70%"></div>
                                <div id="interestBar" class="bg-green-500 transition-all duration-500" style="width: 30%"></div>
                            </div>
                            <div class="flex justify-between mt-2 text-xs">
                                <span class="text-blue-600">저축: <span id="savingsPercent">70%</span></span>
                                <span class="text-green-600">이자: <span id="interestPercent">30%</span></span>
                            </div>
                        </div>
                    </div>

                    <!-- Milestones -->
                    <div class="mt-6">
                        <h3 class="text-md font-semibold text-slate-800 mb-3">마일스톤</h3>
                        <div id="milestones" class="space-y-2">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comparison Section -->
            <div class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">대안 시나리오</h2>
                <div id="scenarios" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Tips Section -->
            <div class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">목표 달성 팁</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-blue-50 rounded-xl">
                        <div class="font-medium text-blue-800 mb-2">자동 저축 설정</div>
                        <p class="text-sm text-blue-600">월급일에 자동으로 저축 계좌로 이체되도록 설정하세요.</p>
                    </div>
                    <div class="p-4 bg-green-50 rounded-xl">
                        <div class="font-medium text-green-800 mb-2">불필요한 지출 줄이기</div>
                        <p class="text-sm text-green-600">구독 서비스를 검토하고 재량 지출을 줄이세요.</p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-xl">
                        <div class="font-medium text-purple-800 mb-2">수입 늘리기</div>
                        <p class="text-sm text-purple-600">부업을 고려하거나 연봉 협상으로 저축률을 높이세요.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer" class="bg-white border-t border-slate-200 mt-auto"></footer>

    <script>
        // Decimal.js 설정: 높은 정밀도
        Decimal.set({ precision: 50, rounding: Decimal.ROUND_HALF_UP });

        function formatCurrency(num) {
            const value = num instanceof Decimal ? num.toFixed(0) : Math.round(num);
            return Number(value).toLocaleString('ko-KR') + '원';
        }

        function formatInputNumber(num) {
            return num.toLocaleString('ko-KR');
        }

        function parseInputNumber(str) {
            const cleaned = str.replace(/,/g, '');
            return cleaned === '' ? new Decimal(0) : new Decimal(cleaned);
        }

        function handleCurrencyInput(e) {
            const input = e.target;
            const cursorPos = input.selectionStart;
            const oldLength = input.value.length;

            let value = input.value.replace(/[^0-9]/g, '');
            if (value === '') {
                input.value = '';
                return;
            }

            const num = parseInt(value);
            if (!isNaN(num)) {
                input.value = formatInputNumber(num);
            }

            const newLength = input.value.length;
            const diff = newLength - oldLength;
            input.setSelectionRange(cursorPos + diff, cursorPos + diff);
        }

        function calculateMonthly(goal, current, years, ratePercent) {
            const rate = new Decimal(ratePercent).div(100);
            const monthlyRate = rate.div(12);
            const months = years * 12;

            // Future value of current savings
            const fvCurrent = current.mul(Decimal.pow(new Decimal(1).plus(monthlyRate), months));

            // Amount needed from monthly contributions
            const remainingGoal = goal.minus(fvCurrent);

            if (remainingGoal.lte(0)) {
                return new Decimal(0);
            }

            if (monthlyRate.eq(0)) {
                return remainingGoal.div(months);
            }

            // PMT formula for future value of annuity
            const growthFactor = Decimal.pow(new Decimal(1).plus(monthlyRate), months).minus(1);
            const monthly = remainingGoal.mul(monthlyRate).div(growthFactor);
            return Decimal.max(new Decimal(0), monthly);
        }

        function calculate() {
            const goalAmount = parseInputNumber(document.getElementById('goalAmount').value);
            const currentSavings = parseInputNumber(document.getElementById('currentSavings').value);
            const years = parseInt(document.getElementById('years').value) || 0;
            const ratePercent = parseFloat(document.getElementById('rate').value) || 0;

            const monthlySavings = calculateMonthly(goalAmount, currentSavings, years, ratePercent);
            const totalSaved = currentSavings.plus(monthlySavings.mul(12 * years));
            const interestEarned = goalAmount.minus(totalSaved);

            const savingsPercent = totalSaved.gt(0) ? totalSaved.div(goalAmount).mul(100).toNumber() : 0;
            const interestPercent = Math.max(0, 100 - savingsPercent);

            // Update display
            document.getElementById('monthlySavings').textContent = formatCurrency(monthlySavings);
            document.getElementById('totalToSave').textContent = formatCurrency(totalSaved.minus(currentSavings));
            document.getElementById('interestEarned').textContent = formatCurrency(Decimal.max(new Decimal(0), interestEarned));
            document.getElementById('goalDisplay').textContent = formatCurrency(goalAmount);
            document.getElementById('yearsDisplay').textContent = `${years}년 후`;

            document.getElementById('savingsBar').style.width = savingsPercent + '%';
            document.getElementById('interestBar').style.width = interestPercent + '%';
            document.getElementById('savingsPercent').textContent = savingsPercent.toFixed(0) + '%';
            document.getElementById('interestPercent').textContent = interestPercent.toFixed(0) + '%';

            // Milestones
            let milestones = '';
            const rate = new Decimal(ratePercent).div(100);
            const monthlyRate = rate.div(12);
            let balance = currentSavings;
            const milestoneTargets = [0.25, 0.5, 0.75, 1];

            for (let month = 1; month <= Math.min(years * 12, 1200); month++) {
                balance = balance.mul(new Decimal(1).plus(monthlyRate)).plus(monthlySavings);

                for (let i = 0; i < milestoneTargets.length; i++) {
                    if (milestoneTargets[i] === null) continue;
                    const target = goalAmount.mul(milestoneTargets[i]);
                    if (balance.gte(target)) {
                        const yearNum = Math.floor(month / 12);
                        const monthNum = month % 12;
                        milestones += `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 bg-slate-50 rounded-lg text-sm gap-1">
                                <span class="font-medium text-slate-700 break-all">${(milestoneTargets[i] * 100).toFixed(0)}% - ${formatCurrency(target)}</span>
                                <span class="text-blue-600">${yearNum > 0 ? yearNum + '년 ' : ''}${monthNum}개월</span>
                            </div>
                        `;
                        milestoneTargets[i] = null;
                    }
                }
            }
            document.getElementById('milestones').innerHTML = milestones || '<div class="text-slate-500 text-sm">목표를 설정하면 마일스톤이 표시됩니다</div>';

            // Alternative scenarios
            const scenarios = [
                { label: '적극적', years: Math.max(1, years - 3), rate: ratePercent },
                { label: '보수적', years: years + 5, rate: ratePercent },
                { label: '고수익', years: years, rate: ratePercent + 2 }
            ];

            let scenarioHtml = '';
            scenarios.forEach(scenario => {
                const monthly = calculateMonthly(goalAmount, currentSavings, scenario.years, scenario.rate);
                scenarioHtml += `
                    <div class="p-4 bg-slate-50 rounded-xl">
                        <div class="font-medium text-slate-800 mb-2">${scenario.label}</div>
                        <div class="text-lg sm:text-xl md:text-2xl font-bold text-blue-600 mb-1 break-all">${formatCurrency(monthly)}/월</div>
                        <div class="text-sm text-slate-500">${scenario.years}년 @ ${scenario.rate}%</div>
                    </div>
                `;
            });
            document.getElementById('scenarios').innerHTML = scenarioHtml;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initComponents === 'function') {
                initComponents('savingsGoal');
            }

            // Currency formatting for money inputs
            ['goalAmount', 'currentSavings'].forEach(id => {
                document.getElementById(id).addEventListener('input', handleCurrencyInput);
            });
        });
    </script>
</body>
</html>
