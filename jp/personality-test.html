        // Positive weight = Agree increases score, Negative weight = Disagree increases score

            // Section 1: Investment Attitude & Risk (10 questions)

            { section: 'Section 1: Investment Attitude & Risk', text: 'I feel at peace only when more than 50% of my assets are in cash.', weights: [3, -2, -1, 1, -1] },

            // Section 2: Spending Habits & Value Seeking (10 questions)
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I compare prices on at least three different websites before making a purchase.', weights: [1, -1, 1, 3, 0] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: '"Brand image" is more important to me than "value for money."', weights: [0, 1, -1, -3, 1] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I maximize credit card benefits like airline miles or cash-back rewards.', weights: [0, 0, 2, 3, 1] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I track my spending down to the last penny using a household ledger or app.', weights: [1, 0, 2, 3, 0] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'My friends have called me "frugal" or "stingy" before.', weights: [2, -1, 0, 3, -1] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I regularly review and cancel subscription services I no longer use.', weights: [1, 0, 2, 3, 0] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I don\'t hold back when spending on "luxury gifts" for myself.', weights: [-1, 1, -1, -3, 1] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'I make a conscious effort to save on utility bills like electricity and water.', weights: [1, -1, 1, 3, 0] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'To avoid impulse buying, I leave items in the cart for a few days before paying.', weights: [2, -1, 2, 3, 0] },
            { section: 'Section 2: Spending Habits & Value Seeking', text: 'The joy of seeing my bank balance grow is greater than the joy of spending.', weights: [2, 0, 1, 3, 0] },

            // Section 3: Information & Technology Trends (10 questions)
            { section: 'Section 3: Information & Technology Trends', text: 'I install new financial apps (Neo-banks, Fintech) as soon as they are released.', weights: [-1, 1, 0, 0, 3] },

            { section: 'Section 3: Information & Technology Trends', text: 'I recognize the value of digital assets like NFTs or Metaverse land.', weights: [-1, 1, 0, 0, 3] },
            { section: 'Section 3: Information & Technology Trends', text: 'I am usually the first to tell my friends about new ways to make money.', weights: [-1, 2, 0, 0, 3] },
            { section: 'Section 3: Information & Technology Trends', text: 'I don\'t mind reading through complex terms and conditions or public disclosures.', weights: [1, 0, 3, 1, 0] },
            { section: 'Section 3: Information & Technology Trends', text: 'I want to utilize tools like ChatGPT for professional investment analysis.', weights: [0, 1, 2, 0, 3] },
            { section: 'Section 3: Information & Technology Trends', text: 'I am obsessed with finding "hidden gems" or information others don\'t know yet.', weights: [-1, 2, 0, 0, 3] },
            { section: 'Section 3: Information & Technology Trends', text: 'I always connect news about interest rates or exchange rates to my own life.', weights: [1, 1, 3, 1, 1] },
            { section: 'Section 3: Information & Technology Trends', text: 'I believe innovative companies are worth investing in even if they are currently in debt.', weights: [-1, 2, 0, -1, 3] },
            { section: 'Section 3: Information & Technology Trends', text: 'I believe the faster the world changes, the more opportunities there are to make money.', weights: [-1, 2, 0, 0, 3] },

            // Section 4: Planning & Asset Management (10 questions)
            { section: 'Section 4: Planning & Asset Management', text: 'I have a specific target amount of assets I want to reach in 10 or 20 years.', weights: [1, 0, 3, 1, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I save/invest first when I get paid, then spend what is left.', weights: [2, 0, 3, 2, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I maintain a set ratio between stocks, real estate, and cash (Portfolio).', weights: [0, -1, 3, 0, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I always keep an emergency fund separate for unexpected expenses.', weights: [3, -1, 2, 1, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I know my exact "Net Worth" (Assets minus Liabilities) in numbers today.', weights: [1, 0, 3, 2, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I view taking out a loan as a strategic tool rather than something "bad."', weights: [-1, 3, 1, -1, 1] },
            { section: 'Section 4: Planning & Asset Management', text: 'I believe retirement planning should start as early as possible, and I\'ve already started.', weights: [2, 0, 3, 1, 0] },
            { section: 'Section 4: Planning & Asset Management', text: 'I live by a budget that categorizes my monthly spending.', weights: [1, -1, 3, 3, 0] },

            { section: 'Section 4: Planning & Asset Management', text: 'I believe "patience" is the most important virtue to become wealthy.', weights: [2, -1, 3, 1, 0] },

            // Section 5: Lifestyle & Philosophy (10 questions)
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I feel happier during the process of saving money than spending it.', weights: [2, -1, 1, 3, 0] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I am willing to sacrifice my time and health to a certain extent to make money.', weights: [0, 2, 0, 0, 1] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'Achieving "Financial Freedom" is the ultimate goal of my life.', weights: [1, 1, 2, 2, 1] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'Being "actually wealthy" is more important to me than "looking wealthy" to others.', weights: [2, 0, 2, 3, 0] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I am prouder of owning good stocks than driving an expensive car.', weights: [1, 1, 2, 2, 1] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I want to build wealth through skill rather than relying on luck like the lottery.', weights: [1, 1, 3, 1, 0] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'Minimalism (owning less) fits well with my economic worldview.', weights: [1, -1, 1, 2, 0] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I think I could give up love or friendship for a massive amount of money.', weights: [-1, 2, 0, 0, 0] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I enjoy reading biographies of people who have achieved great economic success.', weights: [0, 2, 2, 0, 1] },
            { section: 'Section 5: Lifestyle & Philosophy', text: 'I believe spending money for current happiness (YOLO) is also valuable.', weights: [-2, 1, -1, -2, 1] }
        ];

        // State
        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        // Functions
        function startTest(resumeFromSaved = false) {
            const savedState = loadTestState();

            if (savedState && !resumeFromSaved) {
                // Check if there's a saved state and ask to resume
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0 && confirm('You have a test in progress (' + answeredCount + '/' + questions.length + ' questions completed). Would you like to continue?\n\nClick "Cancel" to start over.')) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                } else {
                    clearTestState();
                }
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            document.getElementById('total-q').textContent = questions.length;
            showQuestion(currentQuestion);
        }

        function showQuestion(index) {
            currentQuestion = index;
            const q = questions[index];

            // Save current state to localStorage
            saveTestState(currentQuestion, answers);

            document.getElementById('current-q').textContent = index + 1;
            document.getElementById('progress-percent').textContent = Math.round(((index + 1) / questions.length) * 100) + '%';
            document.getElementById('progress-bar').style.width = (((index + 1) / questions.length) * 100) + '%';
            document.getElementById('section-badge').textContent = q.section;
            document.getElementById('question-text').textContent = q.text;

            // Reset answer buttons
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            // Highlight previously selected answer
            if (answers[index] !== null) {
                document.querySelector(`.answer-btn[data-value="${answers[index]}"]`).classList.add('selected');
            }

            // Update navigation buttons
            document.getElementById('prev-btn').disabled = index === 0;
            updateNextButton();

            // Animation
            const card = document.getElementById('question-card');
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');
        }

        function selectAnswer(value) {
            answers[currentQuestion] = value;

            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            document.querySelector(`.answer-btn[data-value="${value}"]`).classList.add('selected');

            updateNextButton();

            // Auto advance after short delay
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    nextQuestion();
                }
            }, 300);
        }

        function updateNextButton() {
            const nextBtn = document.getElementById('next-btn');
            const isLastQuestion = currentQuestion === questions.length - 1;
            const hasAnswer = answers[currentQuestion] !== null;

            nextBtn.disabled = !hasAnswer;
            nextBtn.innerHTML = isLastQuestion
                ? 'See Results <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>'
                : 'Next <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>';
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                showQuestion(currentQuestion - 1);
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                showQuestion(currentQuestion + 1);
            } else {
                showResults();
            }
        }

        function calculateScores() {
            const scores = {
                safeGuard: 0,
                aggressiveBull: 0,
                strategicPlanner: 0,
                valueSeeker: 0,
                trendFollower: 0
            };

            const typeKeys = Object.keys(scores);

            questions.forEach((q, i) => {
                const answer = answers[i]; // 1-7
                const normalizedAnswer = (answer - 4) / 3; // -1 to 1

                typeKeys.forEach((type, j) => {
                    const weight = q.weights[j];
                    scores[type] += normalizedAnswer * weight;
                });
            });

            // Normalize scores to 0-100
            const maxPossible = questions.length * 3; // Max weight * max normalized answer
            typeKeys.forEach(type => {
                scores[type] = Math.round(((scores[type] + maxPossible) / (maxPossible * 2)) * 100);
                scores[type] = Math.max(0, Math.min(100, scores[type]));
            });

            return scores;
        }

        function showResults() {
            const scores = calculateScores();
            const sortedTypes = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sortedTypes[0][0];
            // Clear saved state on test completion
            clearTestState();
            // Redirect to result page
            window.location.href = `results/${resultPages[topType]}.html`;
        }

        // Initialize Header & Footer
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initComponents === 'function') {
                initComponents('personality');
            }

            // Auto-resume if there's a saved state
            const savedState = loadTestState();
            if (savedState) {
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.remove('hidden');
                    document.getElementById('total-q').textContent = questions.length;
                    showQuestion(currentQuestion);
                }
            }
        });
    </script>

</body>
</html>
