<!DOCTYPE html>
<html lang="ja" data-theme="corporate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>経済クイズ</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <script src="../components.js"></script>
    <script>initHead('quiz');</script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">経済クイズ</h1>
                <p class="text-slate-500">定義を読んで、正しい経済用語を当ててください！</p>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container"
                class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 relative overflow-hidden">
                <!-- Progress & Score -->
                <div class="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                    <span id="question-count">第1問</span>
                    <span id="score-display" class="text-blue-600">スコア: 0</span>
                </div>

                <!-- Initial Loading / Error State -->
                <div id="loading" class="text-center py-10">
                    <span class="loading loading-spinner loading-lg text-blue-500"></span>
                    <p class="mt-4 text-slate-500">クイズを読み込み中...</p>
                </div>

                <!-- Game Area -->
                <div id="game-area" class="hidden">
                    <!-- Question (Definition) -->
                    <div class="bg-blue-50 rounded-xl p-6 mb-8 text-center">
                        <p class="text-sm text-blue-600 font-bold mb-2">この用語は何でしょう？</p>
                        <p id="question-text" class="text-lg sm:text-xl text-slate-800 font-medium leading-relaxed"></p>
                    </div>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        <!-- Options will be injected here -->
                    </div>

                    <!-- Actions area (Hint & Next) -->
                    <div class="flex flex-col gap-3 mt-6">
                        <button id="hint-btn" onclick="toggleHint()"
                            class="btn btn-ghost btn-sm text-slate-500 hover:text-blue-600 gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            ヒントを見る
                        </button>

                        <div id="hint-area"
                            class="hidden p-4 bg-yellow-50 rounded-lg border border-yellow-100 text-sm text-yellow-800">
                            <span class="font-bold">💡 ヒント:</span> <span id="hint-text"></span>
                        </div>

                        <button id="next-btn" onclick="nextQuestion()"
                            class="hidden btn btn-primary w-full gap-2 mt-2 py-4 h-auto text-lg shadow-lg shadow-blue-100">
                            次の問題へ
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Result Area (Level Finished) -->
                <div id="result-area" class="hidden text-center py-8">
                    <div class="mb-6">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">クイズ終了！</h2>
                        <p class="text-slate-600">あなたの経済知識スコアは：</p>
                    </div>

                    <div class="text-4xl font-black text-blue-600 mb-8" id="final-score">0点</div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="location.reload()" class="btn btn-primary px-8">もう一度挑戦</button>
                        <a href="index.html" class="btn btn-outline">辞典に戻る</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="bg-white border-t border-slate-200 mt-12"></footer>

    <!-- Logic -->
    <script src="dictionary-data.js"></script>
    <script>
        // ==================== 定数定義 ====================
        const CONSTANTS = {
            TOTAL_QUESTIONS: 10,
            WRONG_OPTIONS_COUNT: 3,
            POINTS_PER_QUESTION: 10,
            INIT_DELAY_MS: 100,
            ANIMATION_DELAY_MS: 300
        };

        const CSS_CLASSES = {
            HIDDEN: 'hidden',
            BTN_BASE: 'btn btn-outline h-auto py-3 min-h-[3.5rem] bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:border-blue-300 normal-case font-normal text-base leading-snug',
            BTN_DISABLED: ['cursor-not-allowed', 'opacity-60'],
            BTN_REMOVE: ['btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200', 'opacity-60'],
            BTN_CORRECT: ['!bg-green-500', '!text-white', '!border-green-500', 'opacity-100'],
            BTN_WRONG: ['!bg-red-500', '!text-white', '!border-red-500', 'opacity-100'],
            HINT_ACTIVE: ['text-blue-600', 'bg-blue-50']
        };

        // ==================== グローバル状態 ====================
        let gameState = {
            currentQuestionIndex: 0,
            score: 0,
            questions: [],
            isAnswered: false
        };

        // ==================== DOM要素キャッシング ====================
        const DOM = {};

        function cacheDOMElements() {
            DOM.loading = document.getElementById('loading');
            DOM.gameArea = document.getElementById('game-area');
            DOM.resultArea = document.getElementById('result-area');
            DOM.questionCount = document.getElementById('question-count');
            DOM.questionText = document.getElementById('question-text');
            DOM.scoreDisplay = document.getElementById('score-display');
            DOM.hintArea = document.getElementById('hint-area');
            DOM.hintBtn = document.getElementById('hint-btn');
            DOM.hintText = document.getElementById('hint-text');
            DOM.nextBtn = document.getElementById('next-btn');
            DOM.optionsGrid = document.getElementById('options-grid');
            DOM.finalScore = document.getElementById('final-score');
        }

        // ==================== 初期化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            cacheDOMElements();
            initComponents('quiz');
            setTimeout(initQuiz, CONSTANTS.INIT_DELAY_MS);
        });

        function initQuiz() {
            if (!validateData()) {
                showError('データの読み込みに失敗しました。<br>ページを更新してください。');
                return;
            }

            gameState.questions = generateQuestions();
            startGame();
        }

        function validateData() {
            return typeof termDefinitions !== 'undefined' && Object.keys(termDefinitions).length > 0;
        }

        function showError(message) {
            DOM.loading.innerHTML = `<p class="text-red-500">${message}</p>`;
        }

        // ==================== 問題生成 ====================
        function generateQuestions() {
            const allTerms = Object.keys(termDefinitions);
            const selectedIndices = getRandomIndices(allTerms.length, CONSTANTS.TOTAL_QUESTIONS);

            return Array.from(selectedIndices).map(idx => {
                const term = allTerms[idx];
                const data = termDefinitions[term];
                const wrongOptions = getWrongOptions(allTerms, idx);

                return {
                    term,
                    definition: data.definition,
                    example: data.example,
                    options: shuffleArray([...wrongOptions, term])
                };
            });
        }

        function getRandomIndices(maxLength, count) {
            const indices = new Set();
            while (indices.size < count && indices.size < maxLength) {
                indices.add(Math.floor(Math.random() * maxLength));
            }
            return indices;
        }

        function getWrongOptions(allTerms, correctIdx) {
            const wrongOptions = [];
            const usedIndices = new Set([correctIdx]);

            while (wrongOptions.length < CONSTANTS.WRONG_OPTIONS_COUNT) {
                const wrongIdx = Math.floor(Math.random() * allTerms.length);
                if (!usedIndices.has(wrongIdx)) {
                    usedIndices.add(wrongIdx);
                    wrongOptions.push(allTerms[wrongIdx]);
                }
            }

            return wrongOptions;
        }

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // ==================== ゲーム進行 ====================
        function startGame() {
            DOM.loading.classList.add(CSS_CLASSES.HIDDEN);
            DOM.gameArea.classList.remove(CSS_CLASSES.HIDDEN);
            showQuestion();
        }

        function showQuestion() {
            gameState.isAnswered = false;
            const question = gameState.questions[gameState.currentQuestionIndex];

            updateQuestionUI(question);
            renderOptions(question);
        }

        function updateQuestionUI(question) {
            DOM.questionCount.textContent = `第 ${gameState.currentQuestionIndex + 1} 問 / ${CONSTANTS.TOTAL_QUESTIONS} 問`;
            DOM.questionText.textContent = question.definition;
            DOM.hintText.textContent = question.example;

            DOM.hintArea.classList.add(CSS_CLASSES.HIDDEN);
            DOM.hintBtn.classList.remove(CSS_CLASSES.HIDDEN);
            DOM.nextBtn.classList.add(CSS_CLASSES.HIDDEN);
        }

        function renderOptions(question) {
            DOM.optionsGrid.innerHTML = '';

            question.options.forEach(option => {
                const btn = createOptionButton(option, question.term);
                DOM.optionsGrid.appendChild(btn);
            });
        }

        function createOptionButton(optionText, correctAnswer) {
            const btn = document.createElement('button');
            btn.className = CSS_CLASSES.BTN_BASE;
            btn.textContent = optionText;
            btn.onclick = () => checkAnswer(optionText, btn, correctAnswer);
            return btn;
        }

        // ==================== 答えチェック ====================
        function checkAnswer(selected, btnElement, correct) {
            if (gameState.isAnswered) return;
            gameState.isAnswered = true;

            const buttons = document.querySelectorAll('#options-grid button');
            disableAllButtons(buttons);

            const isCorrect = selected === correct;
            updateButtonStyles(btnElement, buttons, correct, isCorrect);

            if (isCorrect) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }

            showNextButton();
        }

        function disableAllButtons(buttons) {
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add(...CSS_CLASSES.BTN_DISABLED);
            });
        }

        function updateButtonStyles(selectedBtn, allButtons, correctAnswer, isCorrect) {
            selectedBtn.classList.remove(...CSS_CLASSES.BTN_REMOVE);
            selectedBtn.classList.add(...(isCorrect ? CSS_CLASSES.BTN_CORRECT : CSS_CLASSES.BTN_WRONG));

            if (!isCorrect) {
                highlightCorrectAnswer(allButtons, correctAnswer);
            }
        }

        function highlightCorrectAnswer(buttons, correctAnswer) {
            buttons.forEach(btn => {
                if (btn.textContent === correctAnswer) {
                    btn.classList.remove(...CSS_CLASSES.BTN_REMOVE);
                    btn.classList.add(...CSS_CLASSES.BTN_CORRECT);
                }
            });
        }

        function handleCorrectAnswer() {
            gameState.score += CONSTANTS.POINTS_PER_QUESTION;
            DOM.scoreDisplay.textContent = `スコア: ${gameState.score}`;
        }

        function handleWrongAnswer() {
            DOM.hintArea.classList.remove(CSS_CLASSES.HIDDEN);
        }

        function showNextButton() {
            DOM.nextBtn.classList.remove(CSS_CLASSES.HIDDEN);
            DOM.hintBtn.classList.add(CSS_CLASSES.HIDDEN);
            DOM.hintArea.classList.remove(CSS_CLASSES.HIDDEN);
        }

        // ==================== ヒントトグル ====================
        function toggleHint() {
            const isHidden = DOM.hintArea.classList.contains(CSS_CLASSES.HIDDEN);

            if (isHidden) {
                DOM.hintArea.classList.remove(CSS_CLASSES.HIDDEN);
                DOM.hintBtn.classList.add(...CSS_CLASSES.HINT_ACTIVE);
            } else {
                DOM.hintArea.classList.add(CSS_CLASSES.HIDDEN);
                DOM.hintBtn.classList.remove(...CSS_CLASSES.HINT_ACTIVE);
            }
        }

        // ==================== 次の問題へ ====================
        function nextQuestion() {
            gameState.currentQuestionIndex++;

            if (gameState.currentQuestionIndex < gameState.questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        // ==================== 結果表示 ====================
        function showResult() {
            DOM.gameArea.classList.add(CSS_CLASSES.HIDDEN);
            DOM.resultArea.classList.remove(CSS_CLASSES.HIDDEN);
            DOM.finalScore.textContent = `${gameState.score} 点`;

            animateFinalScore();
        }

        function animateFinalScore() {
            DOM.finalScore.classList.add('scale-110');
            setTimeout(() => DOM.finalScore.classList.remove('scale-110'), CONSTANTS.ANIMATION_DELAY_MS);
        }
    </script>
</body>

</html>
