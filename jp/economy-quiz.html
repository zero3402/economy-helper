<head>
    <meta charset="UTF-8">

    <meta name="description" content="経済用語クイズであなたの知識をテストしましょう。">
    <link rel="canonical" href="https://economyhelper.com/jp/economy-quiz.html">

    <link rel="alternate" hreflang="es" href="https://economyhelper.com/es/economy-quiz.html">

    <meta property="og:url" content="https://economyhelper.com/jp/economy-quiz.html">
    <meta property="og:title" content="経済クイズ - Economy Helper">
    <meta property="og:description" content="経済用語クイズであなたの知識をテストしましょう。今すぐ実力をチェック！">
    <meta property="og:image" content="https://economyhelper.com/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:title" content="経済クイズ - Economy Helper">
    <meta name="twitter:description" content="経済用語クイズで知識をテストしましょう！">
    <meta name="twitter:image" content="https://economyhelper.com/images/og.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />

</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">経済クイズ</h1>
                <p class="text-slate-500">定義を読んで、正しい経済用語を当ててください！</p>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container"
                class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 relative overflow-hidden">
                <!-- Progress & Score -->
                <div class="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                    <span id="question-count">第1問</span>
                    <span id="score-display" class="text-blue-600">スコア: 0</span>
                </div>

                <!-- Initial Loading / Error State -->
                <div id="loading" class="text-center py-10">
                    <span class="loading loading-spinner loading-lg text-blue-500"></span>
                    <p class="mt-4 text-slate-500">クイズを読み込み中...</p>
                </div>

                <!-- Game Area -->
                <div id="game-area" class="hidden">
                    <!-- Question (Definition) -->
                    <div class="bg-blue-50 rounded-xl p-6 mb-8 text-center">
                        <p class="text-sm text-blue-600 font-bold mb-2">この用語は何でしょう？</p>
                        <p id="question-text" class="text-lg sm:text-xl text-slate-800 font-medium leading-relaxed"></p>
                    </div>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        <!-- Options will be injected here -->
                    </div>

                    <!-- Actions area (Hint & Next) -->
                    <div class="flex flex-col gap-3 mt-6">
                        <button id="hint-btn" onclick="toggleHint()"
                            class="btn btn-ghost btn-sm text-slate-500 hover:text-blue-600 gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            ヒントを見る
                        </button>

                        <div id="hint-area"
                            class="hidden p-4 bg-yellow-50 rounded-lg border border-yellow-100 text-sm text-yellow-800">
                            <span class="font-bold">💡 ヒント:</span> <span id="hint-text"></span>
                        </div>

                        <button id="next-btn" onclick="nextQuestion()"
                            class="hidden btn btn-primary w-full gap-2 mt-2 py-4 h-auto text-lg shadow-lg shadow-blue-100">
                            次の問題へ
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Result Area (Level Finished) -->
                <div id="result-area" class="hidden text-center py-8">
                    <div class="mb-6">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">クイズ終了！</h2>
                        <p class="text-slate-600">あなたの経済知識スコアは：</p>
                    </div>

                    <div class="text-4xl font-black text-blue-600 mb-8" id="final-score">0点</div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="location.reload()" class="btn btn-primary px-8">もう一度挑戦</button>
                        <a href="index.html" class="btn btn-outline">辞典に戻る</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="bg-white border-t border-slate-200 mt-12"></footer>

    <!-- Logic -->
    <script src="dictionary-data.js"></script>
    <script src="../components.js"></script>
    <script>
        // Quiz State
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        const TOTAL_QUESTIONS = 10;
        let isAnswered = false;

        document.addEventListener('DOMContentLoaded', () => {
            initComponents('quiz');
            setTimeout(initQuiz, 100);
        });

        function initQuiz() {
            const loading = document.getElementById('loading');
            const gameArea = document.getElementById('game-area');

            if (typeof termDefinitions === 'undefined') {
                loading.innerHTML = '<p class="text-red-500">データの読み込みに失敗しました。<br>ページを更新してください。</p>';
                return;
            }

            // Generate questions list
            const allTerms = Object.keys(termDefinitions);

            // If we have fewer terms than TOTAL_QUESTIONS, just use what we have
            const questionCount = Math.min(TOTAL_QUESTIONS, allTerms.length);

            // Shuffle
            questions = [];
            const selectedIndices = new Set();
            while (selectedIndices.size < questionCount) {
                const idx = Math.floor(Math.random() * allTerms.length);
                selectedIndices.add(idx);
            }

            // Get distractors from economyDictionary (all terms list) if available, otherwise use keys
            // To ensure we have enough distractors, let's collect ALL terms available in the dictionary
            let allPossibleDistractors = [];
            if (typeof economyDictionary !== 'undefined') {
                Object.values(economyDictionary).forEach(list => allPossibleDistractors.push(...list));
            } else {
                allPossibleDistractors = allTerms;
            }

            selectedIndices.forEach(idx => {
                const term = allTerms[idx];
                const data = termDefinitions[term];

                // Generare distractors
                const distractors = [];
                while (distractors.length < 3) {
                    const randomDistractor = allPossibleDistractors[Math.floor(Math.random() * allPossibleDistractors.length)];
                    if (randomDistractor !== term && !distractors.includes(randomDistractor) && randomDistractor.length < 20) { // Limit length for UI
                        distractors.push(randomDistractor);
                    }
                }

                questions.push({
                    term: term,
                    definition: data.definition,
                    example: data.example,
                    options: [...distractors, term].sort(() => 0.5 - Math.random())
                });
            });

            loading.classList.add('hidden');
            gameArea.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            isAnswered = false;
            const questionData = questions[currentQuestionIndex];

            // Update UI
            document.getElementById('question-count').textContent = `第 ${currentQuestionIndex + 1} 問 / ${questions.length} 問`;
            document.getElementById('question-text').textContent = questionData.definition;
            document.getElementById('hint-area').classList.add('hidden');
            document.getElementById('hint-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hint-text').textContent = questionData.example || "";

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            questionData.options.forEach(term => {
                const btn = document.createElement('button');
                btn.className = "btn btn-outline h-auto py-3 min-h-[3.5rem] bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:border-blue-300 normal-case font-normal text-base leading-snug";
                btn.textContent = term;
                btn.onclick = () => checkAnswer(term, questionData.term, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedTerm, correctTerm, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = document.querySelectorAll('#options-grid button');
            const hintArea = document.getElementById('hint-area');
            const hintText = document.getElementById('hint-text');

            if (selectedTerm === correctTerm) {
                // Correct
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-success', 'text-white', 'border-success');
                score += 10;
                document.getElementById('score-display').textContent = `スコア: ${score}`;

            } else {
                // Incorrect
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-error', 'text-white', 'border-error');

                // Highlight correct answer
                buttons.forEach(b => {
                    if (b.textContent === correctTerm) {
                        b.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                        b.classList.add('btn-success', 'text-white', 'border-success');
                    }
                });

                // Show Hint
                const qData = questions[currentQuestionIndex];
                if (qData.example) {
                    hintText.textContent = qData.example;
                }
            }

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');

            // Show hint
            document.getElementById('hint-area').classList.remove('hidden');
        }

        function toggleHint() {
            const hintArea = document.getElementById('hint-area');
            const hintBtn = document.getElementById('hint-btn');
            if (hintArea.classList.contains('hidden')) {
                hintArea.classList.remove('hidden');
                hintBtn.classList.add('text-blue-600', 'bg-blue-50');
            } else {
                hintArea.classList.add('hidden');
                hintBtn.classList.remove('text-blue-600', 'bg-blue-50');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion(); // Boundary check is inside showQuestion
        }

        function showResult() {
            document.getElementById('game-area').classList.add('hidden');
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');

            const finalScoreEl = document.getElementById('final-score');
            finalScoreEl.textContent = `${score} 点`;

            // Simple animation
            finalScoreEl.classList.add('scale-110');
            setTimeout(() => finalScoreEl.classList.remove('scale-110'), 300);
        }
    </script>
</body>

</html>
