                    </div>
                    <div class="p-4 bg-green-50 rounded-xl">

                        <p class="text-sm text-green-600">サブスクリプションを見直し、裁量支出を減らしましょう。</p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-xl">
                        <div class="font-medium text-purple-800 mb-2">収入の増加</div>
                        <p class="text-sm text-purple-600">副業を検討したり、昇給を交渉して貯蓄率を向上させましょう。</p>

    <!-- Footer -->

    <script>
        // Decimal.js configuration: high precision
        Decimal.set({ precision: 50, rounding: Decimal.ROUND_HALF_UP });

        function formatCurrency(num) {
            const value = num instanceof Decimal ? num.toFixed(0) : num.toFixed(0);
            return '¥' + Number(value).toLocaleString('ja-JP');
        }

        function formatInputNumber(num) {
            return num.toLocaleString('ja-JP');
        }

        function parseInputNumber(str) {
            const cleaned = str.replace(/,/g, '');
            return cleaned === '' ? new Decimal(0) : new Decimal(cleaned);
        }

        function handleCurrencyInput(e) {
            const input = e.target;
            const cursorPos = input.selectionStart;
            const oldLength = input.value.length;

            let value = input.value.replace(/[^0-9.]/g, '');
            if (value === '') {
                input.value = '';
                return;
            }

            const num = parseFloat(value);
            if (!isNaN(num)) {
                input.value = formatInputNumber(num);
            }

            const newLength = input.value.length;
            const diff = newLength - oldLength;
            input.setSelectionRange(cursorPos + diff, cursorPos + diff);
        }

        function calculateMonthly(goal, current, years, ratePercent) {
            const rate = new Decimal(ratePercent).div(100);
            const monthlyRate = rate.div(12);
            const months = years * 12;

            // Future value of current savings
            const fvCurrent = current.mul(Decimal.pow(new Decimal(1).plus(monthlyRate), months));

            // Amount needed from monthly contributions
            const remainingGoal = goal.minus(fvCurrent);

            if (remainingGoal.lte(0)) {
                return new Decimal(0);
            }

            if (monthlyRate.eq(0)) {
                return remainingGoal.div(months);
            }

            // PMT formula for future value of annuity
            const growthFactor = Decimal.pow(new Decimal(1).plus(monthlyRate), months).minus(1);
            const monthly = remainingGoal.mul(monthlyRate).div(growthFactor);
            return Decimal.max(new Decimal(0), monthly);
        }

        function calculate() {
            const goalAmount = parseInputNumber(document.getElementById('goalAmount').value);
            const currentSavings = parseInputNumber(document.getElementById('currentSavings').value);
            const years = parseInt(document.getElementById('years').value) || 0;
            const ratePercent = parseFloat(document.getElementById('rate').value) || 0;

            const monthlySavings = calculateMonthly(goalAmount, currentSavings, years, ratePercent);
            const totalSaved = currentSavings.plus(monthlySavings.mul(12 * years));
            const interestEarned = goalAmount.minus(totalSaved);

            const savingsPercent = totalSaved.gt(0) ? totalSaved.div(goalAmount).mul(100).toNumber() : 0;
            const interestPercent = Math.max(0, 100 - savingsPercent);

            // Update display
            document.getElementById('monthlySavings').textContent = formatCurrency(monthlySavings);
            document.getElementById('totalToSave').textContent = formatCurrency(totalSaved.minus(currentSavings));
            document.getElementById('interestEarned').textContent = formatCurrency(Decimal.max(new Decimal(0), interestEarned));
            document.getElementById('goalDisplay').textContent = formatCurrency(goalAmount);
            document.getElementById('yearsDisplay').textContent = `${years}年以内`;

            document.getElementById('savingsBar').style.width = savingsPercent + '%';
            document.getElementById('interestBar').style.width = interestPercent + '%';
            document.getElementById('savingsPercent').textContent = savingsPercent.toFixed(0) + '%';
            document.getElementById('interestPercent').textContent = interestPercent.toFixed(0) + '%';

            // Milestones
            let milestones = '';
            const rate = new Decimal(ratePercent).div(100);
            const monthlyRate = rate.div(12);
            let balance = currentSavings;
            const milestoneTargets = [0.25, 0.5, 0.75, 1];

            for (let month = 1; month <= Math.min(years * 12, 1200); month++) {
                balance = balance.mul(new Decimal(1).plus(monthlyRate)).plus(monthlySavings);

                for (let i = 0; i < milestoneTargets.length; i++) {
                    if (milestoneTargets[i] === null) continue;
                    const target = goalAmount.mul(milestoneTargets[i]);
                    if (balance.gte(target)) {
                        const yearNum = Math.floor(month / 12);
                        const monthNum = month % 12;
                        milestones += `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 bg-slate-50 rounded-lg text-sm gap-1">
                                <span class="font-medium text-slate-700 break-all">${(milestoneTargets[i] * 100).toFixed(0)}% - ${formatCurrency(target)}</span>
                                <span class="text-blue-600">${yearNum > 0 ? yearNum + '年 ' : ''}${monthNum}ヶ月</span>
                            </div>
                        `;
                        milestoneTargets[i] = null;
                    }
                }
            }
            document.getElementById('milestones').innerHTML = milestones || '<div class="text-slate-500 text-sm">目標を設定してマイルストーンを確認しましょう</div>';

            // Alternative scenarios
            const scenarios = [
                { label: 'アグレッシブ', years: Math.max(1, years - 3), rate: ratePercent },
                { label: '保守的', years: years + 5, rate: ratePercent },
                { label: '高利回り', years: years, rate: ratePercent + 2 }
            ];

            let scenarioHtml = '';
            scenarios.forEach(scenario => {
                const monthly = calculateMonthly(goalAmount, currentSavings, scenario.years, scenario.rate);
                scenarioHtml += `
                    <div class="p-4 bg-slate-50 rounded-xl">
                        <div class="font-medium text-slate-800 mb-2">${scenario.label}</div>
                        <div class="text-lg sm:text-xl md:text-2xl font-bold text-blue-600 mb-1 break-all">${formatCurrency(monthly)}/月</div>
                        <div class="text-sm text-slate-500">${scenario.years}年 @ ${scenario.rate}%</div>
                    </div>
                `;
            });
            document.getElementById('scenarios').innerHTML = scenarioHtml;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initComponents === 'function') {
                initComponents('savingsGoal');
            }

            // Currency formatting for money inputs
            ['goalAmount', 'currentSavings'].forEach(id => {
                document.getElementById(id).addEventListener('input', handleCurrencyInput);
            });
        });
    </script>
