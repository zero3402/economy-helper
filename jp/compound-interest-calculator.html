<!DOCTYPE html>
<html lang="ja" data-theme="corporate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>複利計算機</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
    <script src="../components.js"></script>
    <script>initHead('compoundInterest');</script>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Header -->
    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-6 sm:py-10">
        <div class="max-w-4xl mx-auto">
            <!-- Title -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-green-500 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">複利計算機</h1>
                <p class="text-slate-500">複利の力でお金がどのように増えるかをご覧ください</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Calculator Form -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-6">詳細を入力</h2>

                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">初期投資額 (¥)</label>
                            <input type="text" id="principal" value="10,000" class="input input-bordered w-full" placeholder="金額を入力">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">月次積立額 (¥)</label>
                            <input type="text" id="monthly" value="500" class="input input-bordered w-full" placeholder="金額を入力">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">年利率 (%)</label>
                            <input type="number" id="rate" value="7" min="0" max="100" step="0.1" class="input input-bordered w-full" placeholder="利率を入力">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">投資期間 (年)</label>
                            <input type="number" id="years" value="20" min="1" max="100" step="1" class="input input-bordered w-full" placeholder="年数を入力">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">複利頻度</label>
                            <select id="frequency" class="select select-bordered w-full">
                                <option value="1">年次</option>
                                <option value="4">四半期</option>
                                <option value="12" selected>毎月</option>
                                <option value="365">毎日</option>
                            </select>
                        </div>

                        <button onclick="calculate()" class="btn btn-primary w-full rounded-xl">
                            計算する
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Results -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-6">結果</h2>

                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-green-50 to-emerald-50 rounded-xl p-4 border border-green-200">
                            <div class="text-sm text-green-600 font-medium mb-1">将来価値</div>
                            <div id="futureValue" class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-bold text-green-700 break-all">¥0</div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-slate-50 rounded-xl p-4">
                                <div class="text-sm text-slate-500 mb-1">総拠出額</div>
                                <div id="totalContributions" class="text-base sm:text-lg md:text-xl font-semibold text-slate-700 break-all">¥0</div>
                            </div>
                            <div class="bg-blue-50 rounded-xl p-4">
                                <div class="text-sm text-blue-500 mb-1">総利息</div>
                                <div id="totalInterest" class="text-base sm:text-lg md:text-xl font-semibold text-blue-700 break-all">¥0</div>
                            </div>
                        </div>

                        <div class="bg-slate-50 rounded-xl p-4">
                            <div class="text-sm text-slate-500 mb-1">総額に占める利息の割合</div>
                            <div class="flex items-center gap-3">
                                <progress id="interestProgress" class="progress progress-primary w-full" value="0" max="100"></progress>
                                <span id="interestPercent" class="text-sm font-medium text-slate-700 w-12">0%</span>
                            </div>
                        </div>
                    </div>

                    <!-- Yearly Breakdown -->
                    <div class="mt-6">
                        <h3 class="text-md font-semibold text-slate-800 mb-3">年次内訳</h3>
                        <div id="yearlyBreakdown" class="max-h-64 overflow-y-auto space-y-2">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Info Section -->
            <div class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">複利の理解</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-blue-50 rounded-xl">
                        <div class="font-medium text-blue-800 mb-2">計算式</div>
                        <p class="text-sm text-blue-600">A = P(1 + r/n)^(nt) ここでPは元本、rは利率、nは複利頻度、tは期間です。</p>
                    </div>
                    <div class="p-4 bg-green-50 rounded-xl">
                        <div class="font-medium text-green-800 mb-2">重要性</div>
                        <p class="text-sm text-green-600">複利は利息に利息がつき、時間の経過とともに資産が指数関数的に増加します。</p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-xl">
                        <div class="font-medium text-purple-800 mb-2">プロのヒント</div>
                        <p class="text-sm text-purple-600">早く始めましょう！時間は複利成長の最も強力な要因です。少額でも積み重なります。</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="footer" class="bg-white border-t border-slate-200 mt-auto"></footer>

    <script>
        // Decimal.js configuration: high precision
        Decimal.set({ precision: 50, rounding: Decimal.ROUND_HALF_UP });

        function formatCurrency(num) {
            const value = num instanceof Decimal ? num.toFixed(0) : num.toFixed(0);
            return '¥' + Number(value).toLocaleString('ja-JP');
        }

        function formatInputNumber(num) {
            return num.toLocaleString('ja-JP');
        }

        function parseInputNumber(str) {
            const cleaned = str.replace(/,/g, '');
            return cleaned === '' ? new Decimal(0) : new Decimal(cleaned);
        }

        function handleCurrencyInput(e) {
            const input = e.target;
            const cursorPos = input.selectionStart;
            const oldLength = input.value.length;

            let value = input.value.replace(/[^0-9.]/g, '');
            if (value === '') {
                input.value = '';
                return;
            }

            const num = parseFloat(value);
            if (!isNaN(num)) {
                input.value = formatInputNumber(num);
            }

            const newLength = input.value.length;
            const diff = newLength - oldLength;
            input.setSelectionRange(cursorPos + diff, cursorPos + diff);
        }

        function calculate() {
            const principal = parseInputNumber(document.getElementById('principal').value);
            const monthly = parseInputNumber(document.getElementById('monthly').value);
            const rateInput = parseFloat(document.getElementById('rate').value) || 0;
            const years = parseInt(document.getElementById('years').value) || 0;
            const frequency = parseInt(document.getElementById('frequency').value) || 12;

            const rate = new Decimal(rateInput).div(100);
            const r = rate.div(frequency);
            const n = frequency * years;

            // Future value of principal: P * (1 + r)^n
            let fvPrincipal = principal.mul(Decimal.pow(new Decimal(1).plus(r), n));

            // Future value of monthly contributions (annuity)
            let fvContributions = new Decimal(0);
            if (rate.gt(0)) {
                const monthlyRate = rate.div(12);
                const totalMonths = years * 12;
                const growthFactor = Decimal.pow(new Decimal(1).plus(monthlyRate), totalMonths).minus(1);
                fvContributions = monthly.mul(growthFactor.div(monthlyRate));
            } else {
                fvContributions = monthly.mul(years * 12);
            }

            const futureValue = fvPrincipal.plus(fvContributions);
            const totalContributions = principal.plus(monthly.mul(12 * years));
            const totalInterest = futureValue.minus(totalContributions);
            const interestPercent = totalContributions.gt(0)
                ? totalInterest.div(futureValue).mul(100).toNumber()
                : 0;

            // Update display
            document.getElementById('futureValue').textContent = formatCurrency(futureValue);
            document.getElementById('totalContributions').textContent = formatCurrency(totalContributions);
            document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
            document.getElementById('interestProgress').value = interestPercent;
            document.getElementById('interestPercent').textContent = interestPercent.toFixed(1) + '%';

            // Yearly breakdown
            let breakdown = '';
            let balance = principal;
            const monthlyRate = rate.div(12);

            for (let year = 1; year <= Math.min(years, 100); year++) {
                for (let month = 0; month < 12; month++) {
                    balance = balance.mul(new Decimal(1).plus(monthlyRate)).plus(monthly);
                }
                const yearContributions = principal.plus(monthly.mul(12 * year));

                breakdown += `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3 bg-slate-50 rounded-lg text-sm gap-1 sm:gap-4">
                        <span class="font-medium text-slate-700">${year}年目</span>
                        <div class="flex flex-col sm:flex-row gap-1 sm:gap-4 text-right w-full sm:w-auto">
                            <span class="text-slate-500 text-xs sm:text-sm">${formatCurrency(yearContributions)} 投資済</span>
                            <span class="text-green-600 font-medium">${formatCurrency(balance)}</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('yearlyBreakdown').innerHTML = breakdown;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initComponents === 'function') {
                initComponents('compoundInterest');
            }

            // Currency formatting for money inputs
            ['principal', 'monthly'].forEach(id => {
                document.getElementById(id).addEventListener('input', handleCurrencyInput);
            });
        });
    </script>
</body>
</html>
