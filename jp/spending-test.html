        const questions = [
            // セクション1: 支出の態度と哲学 (10問)
            { section: 'セクション1: 支出の態度と哲学', text: '人生は一度きりなので、今この瞬間の幸せのためにお金を使う。(YOLO)', weights: [3, -2, -1, 1, -1] },
            { section: 'セクション1: 支出の態度と哲学', text: '毎月の貯金目標が達成できないと不安を感じる。', weights: [-1, 3, 1, -1, 1] },
            { section: 'セクション1: 支出의 態度と哲学', text: 'ストレスを感じると、気分を晴らすために買い物をしてしまう。', weights: [2, -1, -1, 1, 0] },
            { section: 'セクション1: 支出の態度と哲学', text: '価値（環境配慮など）があるものなら、高くても購入する。', weights: [-1, 0, 3, 0, 1] },
            { section: 'セクション1: 支出の態度と哲学', text: '高級ブランドを持つことは、自分の社会的成功の象徴だと思う。', weights: [-1, -1, -1, 3, 0] },
            { section: 'セクション1: 支出の態度と哲学', text: '時間を節約できるなら、多少高くても構わない。', weights: [1, -1, 0, 1, 1] },
            { section: 'セクション1: 支出の態度と哲学', text: '形に残るものより、経験（旅行、食事）にお金を使いたい。', weights: [3, -1, 1, 0, -1] },
            { section: 'セクション1: 支出の態度と哲学', text: '支出を管理するために、ほぼ毎日銀行の残高をチェックする。', weights: [-1, 3, 1, -1, 2] },
            { section: 'セクション1: 支出の態度と哲学', text: '予定になくても「限定版」と言われるとつい買ってしまう。', weights: [2, -1, -2, 2, 0] },
            { section: 'セクション1: 支出の態度と哲学', text: 'お金は貯めるものではなく、使うためにあるものだ。', weights: [3, -3, 0, 1, -1] },

            { section: 'セクション2: 情報収集と購入の意思決定', text: '小さな買い物でも、少なくとも10件以上のレビューを読み込む。', weights: [-1, 1, 1, -1, 3] },
            { section: 'セクション2: 情報収集と購入의 意思決定', text: '最安値を見つけるために、複数のサイトを比較するのが好きだ。', weights: [-1, 2, 1, -2, 3] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: 'SNSの広告を見て、衝動的に買ってしまうことがよくある。', weights: [2, -1, -1, 1, 0] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '専門家や公的機関が推奨する製品を信頼する。', weights: [0, 1, 2, 0, 2] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '周囲の多くの人が持っているトレンドアイテムは手に入れないと気が済まない。', weights: [1, -1, -2, 2, 0] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '「コスパ」よりも「エモさ（情緒的満足）」を重視する。', weights: [2, -2, 1, 2, -1] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '安いものをたくさん買うより、高くても一生モノを一つ買いたい。', weights: [-1, 0, 3, 1, 1] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '常に割引クーポンやポイント還元をチェックしている。', weights: [-1, 2, 1, -1, 3] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: 'ブランドのイメージが自分に合っているかをまず考える。', weights: [0, -1, 0, 3, 0] },
            { section: 'セクション2: 情報収集と購入の意思決定', text: '衝動買いを避けるため、カートに入れてから3日以上考える。', weights: [-2, 3, 2, -1, 1] },
            // セクション3: 日常の支出習慣 (10問)
            { section: 'セクション3: 日常の支出習慣', text: 'コーヒーや間食など、小さなお金を頻繁に使ってしまう。', weights: [2, -2, -1, 1, 0] },
            { section: 'セクション3: 日常の支出習慣', text: '3つ以上のサブスク（Netflix, YouTube等）を利用している。', weights: [1, -1, 0, 1, 0] },
            { section: 'セクション3: 日常の支出習慣', text: '利便性のためなら、タクシー代などの支出を惜しまない。', weights: [2, -2, -1, 1, 0] },
            { section: 'セクション3: 日常の支出習慣', text: '週に4回以上、外食やデリバリーを利用する。', weights: [2, -2, -1, 1, 0] },
            { section: 'セクション3: 日常の支出習慣', text: '電気代や水道代を節約するために意識的に努力している。', weights: [-1, 3, 2, -1, 1] },
            { section: 'セクション3: 日常の支出習慣', text: '不要になったものはフリマアプリで頻繁に売却する。', weights: [-1, 2, 3, -1, 2] },
            { section: 'セクション3: 日常の支出習慣', text: 'セールでないときに定価で買うのは損だと感じる。', weights: [-1, 1, 0, -2, 3] },
            { section: 'セクション3: 日常の支出習慣', text: '友人への食事代やコーヒー代などは出し惜しみしない。', weights: [1, -2, 1, 2, 0] },

            { section: 'セクション4: 大きな支出と計画性', text: '交際費（結婚式、お祝い等）には予算の多くを割いている。', weights: [0, -1, 2, 1, 0] },
            { section: 'セクション4: 大きな支出と計画性', text: '自己啓発（セミナー、書籍等）のための支出は惜しまない。', weights: [-1, 0, 3, 1, 1] },
            { section: 'セクション4: 大きな支出と計画性', text: 'まとまったお金が入ったら、まず欲しかったものを買う。', weights: [2, -3, -1, 2, -1] },
            { section: 'セクション4: 大きな支出と計画性', text: '最低でも3ヶ月分の生活費を非常用資金として常に確保している。', weights: [-2, 3, 2, -1, 1] },
            { section: 'セクション4: 大きな支出と計画性', text: 'ポイントや会員特典が最も貯まる場所で主に消費する。', weights: [-1, 1, 1, -1, 3] },
            { section: 'セクション4: 大きな支出と計画性', text: '外見への投資（美容、運動等）を積極的に行っている。', weights: [1, -1, -1, 3, 0] },
            { section: 'セクション4: 大きな支出と計画性', text: '今使うお金より、将来のためのお金（保険、年金等）の方が重要だ。', weights: [-2, 3, 2, -1, 1] },
            { section: 'セクション4: 大きな支出と計画性', text: 'セールの通知が来ると、特に必要なくてもチェックしてしまう。', weights: [2, -1, -2, 1, 1] },
            // セクション5: 社会的支出と哲学 (10問)
            { section: 'セクション5: 社会적 支出と哲学', text: '毎月一定額を継続的に寄付している。', weights: [-1, 0, 3, 0, 0] },
            { section: 'セクション5: 社会的支出と哲学', text: '自分が消費するブランドは、自分の政治的・社会的信念を表していると思う。', weights: [-1, -1, 3, 1, 0] },
            { section: 'セクション5: 社会的支出と哲学', text: 'リッチに見えるなら、多少の借金（ローン）をしても構わない。', weights: [0, -2, -2, 3, -1] },
            { section: 'セクション5: 社会的支出と哲学', text: '所有するよりも、共有（シェアリングエコノミー、レンタル）の方が経済的だと思う。', weights: [-1, 2, 2, -1, 2] },
            { section: 'セクション5: 社会的支出と哲学', text: '自分だけが知っているカフェやブランドで消費することに特別感を感じる。', weights: [1, -1, 1, 2, 0] },
            { section: 'セクション5: 社会的支出と哲学', text: '特別な日（記念日等）には、普段の5倍以上の支出をしても後悔しない。', weights: [2, -2, 1, 2, 0] },
            { section: 'セクション5: 社会的支出と哲学', text: '貯めるよりも「稼いで使う」ライフスタイルを追求したい。', weights: [2, -3, -1, 2, -1] },
            { section: 'セクション5: 社会的支出と哲学', text: '子供や家族のための支出は、常に最優先事項だ。', weights: [-1, -1, 2, 1, 0] },
            { section: 'セクション5: 社会的支出と哲学', text: 'ミニマルな生活（持ち物を減らすこと）を実践している、または実践したい。', weights: [-1, 2, 3, -1, 1] },
            { section: 'セクション5: 社会的支出と哲学', text: 'お金を使う前に「本当に必要か？」を自分に少なくとも3回は問いかける。', weights: [-2, 3, 2, -1, 2] }
        ];

        let currentQuestion = 0;
        let answers = new Array(questions.length).fill(null);

        function startTest(resumeFromSaved = false) {
            const savedState = loadTestState();
            if (savedState && !resumeFromSaved) {
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0 && confirm('進行中のテストがあります (' + answeredCount + '/' + questions.length + ' 問完了)。続けますか？\n\n「キャンセル」をクリックして最初からやり直します。')) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                } else {
                    clearTestState();
                }
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            document.getElementById('total-q').textContent = questions.length;
            showQuestion(currentQuestion);
        }

        function showQuestion(index) {
            currentQuestion = index;
            const q = questions[index];
            saveTestState(currentQuestion, answers);

            document.getElementById('current-q').textContent = index + 1;
            document.getElementById('progress-percent').textContent = Math.round(((index + 1) / questions.length) * 100) + '%';
            document.getElementById('progress-bar').style.width = (((index + 1) / questions.length) * 100) + '%';
            document.getElementById('section-badge').textContent = q.section;
            document.getElementById('question-text').textContent = q.text;

            document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
            if (answers[index] !== null) {
                const selectedBtn = document.querySelector(`.answer-btn[data-value="${answers[index]}"]`);
                if (selectedBtn) selectedBtn.classList.add('selected');
            }

            document.getElementById('prev-btn').disabled = index === 0;
            updateNextButton();

            const card = document.getElementById('question-card');
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');
        }

        function selectAnswer(value) {
            answers[currentQuestion] = value;
            document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`.answer-btn[data-value="${value}"]`).classList.add('selected');
            updateNextButton();
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) nextQuestion();
            }, 300);
        }

        function updateNextButton() {
            const nextBtn = document.getElementById('next-btn');
            const isLastQuestion = currentQuestion === questions.length - 1;
            const hasAnswer = answers[currentQuestion] !== null;
            nextBtn.disabled = !hasAnswer;
            nextBtn.innerHTML = isLastQuestion
                ? '結果を見る <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>'
                : '次へ <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>';
        }

        function prevQuestion() {
            if (currentQuestion > 0) showQuestion(currentQuestion - 1);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                showQuestion(currentQuestion + 1);
            } else {
                showResults();
            }
        }

        function calculateScores() {
            const currentTypes = ['yoloer', 'ultraSaver', 'valueConsumer', 'flexMaster', 'smartSpender'];
            const scores = {};
            currentTypes.forEach(type => scores[type] = 0);

            questions.forEach((q, i) => {
                const answer = answers[i];
                const normalizedAnswer = (answer - 4) / 3;
                currentTypes.forEach((type, j) => {
                    scores[type] += normalizedAnswer * q.weights[j];
                });
            });

            const maxPossible = questions.length * 3;
            currentTypes.forEach(type => {
                scores[type] = Math.round(((scores[type] + maxPossible) / (maxPossible * 2)) * 100);
                scores[type] = Math.max(0, Math.min(100, scores[type]));
            });
            return scores;
        }

        function showResults() {
            const scores = calculateScores();
            const sortedTypes = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            const topType = sortedTypes[0][0];
            clearTestState();
            window.location.href = `results/spending/${resultPages[topType]}.html`;
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (typeof initComponents === 'function') {
                initComponents('personality-spending');
            }

            const savedState = loadTestState();
            if (savedState) {
                const answeredCount = savedState.answers.filter(a => a !== null).length;
                if (answeredCount > 0) {
                    answers = savedState.answers;
                    currentQuestion = savedState.currentQuestion;
                    document.getElementById('start-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.remove('hidden');
                    document.getElementById('total-q').textContent = questions.length;
                    showQuestion(currentQuestion);
                }
            }
        });
    </script>
</body>
