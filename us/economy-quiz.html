<!DOCTYPE html>
<html lang="en" data-theme="corporate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Economy Quiz - Economy Helper</title>
    <meta name="description" content="Test your economic knowledge with our interactive quiz.">
    <link rel="canonical" href="https://economyhelper.com/us/economy-quiz.html">
    <link rel="alternate" hreflang="en" href="https://economyhelper.com/us/economy-quiz.html">
    <link rel="alternate" hreflang="ko" href="https://economyhelper.com/kr/economy-quiz.html">
    <link rel="alternate" hreflang="ja" href="https://economyhelper.com/jp/economy-quiz.html">
    <link rel="alternate" hreflang="es" href="https://economyhelper.com/es/economy-quiz.html">
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://economyhelper.com/us/economy-quiz.html">
    <meta property="og:title" content="Economy Quiz - Economy Helper">
    <meta property="og:description"
        content="Test your economic knowledge with our interactive quiz. Check your level now!">
    <meta property="og:image" content="https://economyhelper.com/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Economy Helper">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://economyhelper.com/us/economy-quiz.html">
    <meta name="twitter:title" content="Economy Quiz - Economy Helper">
    <meta name="twitter:description" content="Test your knowledge with our economy quiz!">
    <meta name="twitter:image" content="https://economyhelper.com/images/og.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />

</head>

<body class="bg-slate-50 min-h-screen flex flex-col">

    <header id="header" class="bg-white border-b border-slate-200 sticky top-0 z-50"></header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Economy Quiz</h1>
                <p class="text-slate-500">Read the definition and guess the correct term!</p>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container"
                class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8 relative overflow-hidden">
                <!-- Progress & Score -->
                <div class="flex justify-between items-center mb-6 text-sm font-medium text-slate-500">
                    <span id="question-count">Question 1</span>
                    <span id="score-display" class="text-blue-600">Score: 0</span>
                </div>

                <!-- Initial Loading / Error State -->
                <div id="loading" class="text-center py-10">
                    <span class="loading loading-spinner loading-lg text-blue-500"></span>
                    <p class="mt-4 text-slate-500">Loading quiz...</p>
                </div>

                <!-- Game Area -->
                <div id="game-area" class="hidden">
                    <!-- Question (Definition) -->
                    <div class="bg-blue-50 rounded-xl p-6 mb-8 text-center">
                        <p class="text-sm text-blue-600 font-bold mb-2">What is this term?</p>
                        <p id="question-text" class="text-lg sm:text-xl text-slate-800 font-medium leading-relaxed"></p>
                    </div>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        <!-- Options will be injected here -->
                    </div>

                    <!-- Actions area (Hint & Next) -->
                    <div class="flex flex-col gap-3 mt-6">
                        <button id="hint-btn" onclick="toggleHint()"
                            class="btn btn-ghost btn-sm text-slate-500 hover:text-blue-600 gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            View Hint
                        </button>

                        <div id="hint-area"
                            class="hidden p-4 bg-yellow-50 rounded-lg border border-yellow-100 text-sm text-yellow-800">
                            <span class="font-bold">💡 Hint:</span> <span id="hint-text"></span>
                        </div>

                        <button id="next-btn" onclick="nextQuestion()"
                            class="hidden btn btn-primary w-full gap-2 mt-2 py-4 h-auto text-lg shadow-lg shadow-blue-100">
                            Next Question
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Result Area (Level Finished) -->
                <div id="result-area" class="hidden text-center py-8">
                    <div class="mb-6">
                        <div class="text-6xl mb-4">🎉</div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Quiz Completed!</h2>
                        <p class="text-slate-600">Your specific knowledge score is:</p>
                    </div>

                    <div class="text-4xl font-black text-blue-600 mb-8" id="final-score">0</div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="location.reload()" class="btn btn-primary px-8">Try Again</button>
                        <a href="index.html" class="btn btn-outline">Back to Dictionary</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer" class="bg-white border-t border-slate-200 mt-12"></footer>

    <!-- Logic -->
    <script src="dictionary-data.js"></script>
    <script src="../components.js"></script>
    <script>
        // Quiz State
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        const TOTAL_QUESTIONS = 10;
        let isAnswered = false;

        document.addEventListener('DOMContentLoaded', () => {
            initComponents('quiz');
            setTimeout(initQuiz, 100);
        });

        function initQuiz() {
            const loading = document.getElementById('loading');
            const gameArea = document.getElementById('game-area');

            if (typeof termDefinitions === 'undefined') {
                loading.innerHTML = '<p class="text-red-500">Failed to load data.<br>Please refresh the page.</p>';
                return;
            }

            // Generate questions list
            // Convert definitions object to array of {term, def, ex}
            const allTerms = Object.entries(termDefinitions).map(([term, data]) => ({
                term: term,
                definition: data.definition,
                example: data.example
            }));

            if (allTerms.length < 4) {
                loading.innerHTML = '<p class="text-red-500">Not enough data for the quiz.</p>';
                return;
            }

            // Shuffle and pick TOTAL_QUESTIONS
            questions = allTerms.sort(() => 0.5 - Math.random()).slice(0, TOTAL_QUESTIONS);

            loading.classList.add('hidden');
            gameArea.classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            isAnswered = false;
            const questionData = questions[currentQuestionIndex];

            // Update UI
            document.getElementById('question-count').textContent = `Question ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('question-text').textContent = questionData.definition;
            document.getElementById('hint-area').classList.add('hidden');
            document.getElementById('hint-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('hint-text').textContent = questionData.example || "";

            // Generate options
            // 1 Correct + 3 Distractors
            const correctTerm = questionData.term;

            // Get distractors from FULL list (termDefinitions)
            const allTermsKeys = Object.keys(termDefinitions);
            const distractors = [];
            while (distractors.length < 3) {
                const randomTerm = allTermsKeys[Math.floor(Math.random() * allTermsKeys.length)];
                if (randomTerm !== correctTerm && !distractors.includes(randomTerm)) {
                    distractors.push(randomTerm);
                }
            }

            const options = [correctTerm, ...distractors].sort(() => 0.5 - Math.random());

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            options.forEach(term => {
                const btn = document.createElement('button');
                btn.className = "btn btn-outline h-auto py-3 min-h-[3.5rem] bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:border-blue-300 normal-case font-normal text-base leading-snug";
                btn.textContent = term;
                btn.onclick = () => checkAnswer(term, correctTerm, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedTerm, correctTerm, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = document.querySelectorAll('#options-grid button');
            const hintArea = document.getElementById('hint-area');
            const hintText = document.getElementById('hint-text');

            if (selectedTerm === correctTerm) {
                // Correct
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-success', 'text-white', 'border-success');
                score += 10;
                document.getElementById('score-display').textContent = `Score: ${score}`;
            } else {
                // Incorrect
                btnElement.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                btnElement.classList.add('btn-error', 'text-white', 'border-error');

                // Highlight correct answer
                buttons.forEach(b => {
                    if (b.textContent === correctTerm) {
                        b.classList.remove('btn-outline', 'bg-white', 'text-slate-700', 'border-slate-200');
                        b.classList.add('btn-success', 'text-white', 'border-success');
                    }
                });
            }

            // Show Next Button
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('hint-btn').classList.add('hidden');

            // Show hint
            document.getElementById('hint-area').classList.remove('hidden');
        }

        function toggleHint() {
            const hintArea = document.getElementById('hint-area');
            const hintBtn = document.getElementById('hint-btn');
            if (hintArea.classList.contains('hidden')) {
                hintArea.classList.remove('hidden');
                hintBtn.classList.add('text-blue-600', 'bg-blue-50');
            } else {
                hintArea.classList.add('hidden');
                hintBtn.classList.remove('text-blue-600', 'bg-blue-50');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-area').classList.add('hidden');
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');

            const finalScoreEl = document.getElementById('final-score');
            finalScoreEl.textContent = `${score} pts`;

            // Simple animation
            finalScoreEl.classList.add('scale-110');
            setTimeout(() => finalScoreEl.classList.remove('scale-110'), 300);
        }
    </script>
</body>

</html>
