<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy Helper - Financial Literacy for Everyone | 경제 용어 사전 | 経済用語辞典</title>
    <meta name="description"
        content="Master investing, trading, and personal finance knowledge. Available in English, Korean (한국어), and Japanese (日本語). Free financial calculators and investment personality test.">
    <meta name="keywords"
        content="economic terms, finance glossary, investment terms, trading vocabulary, 경제 용어, 금융 사전, 経済用語, 金融辞典, financial literacy, compound interest calculator, savings goal">
    <meta name="author" content="Economy Helper">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://economyhelper.com/">
    <link rel="alternate" hreflang="x-default" href="https://economyhelper.com/">
    <link rel="alternate" hreflang="en" href="https://economyhelper.com/us/">
    <link rel="alternate" hreflang="ko" href="https://economyhelper.com/kr/">
    <link rel="alternate" hreflang="ja" href="https://economyhelper.com/jp/">
    <link rel="alternate" hreflang="es" href="https://economyhelper.com/es/">
    <link rel="icon" type="image/png" href="./images/favicon.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Economy Helper",
      "url": "https://economyhelper.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://economyhelper.com/us/index.html?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "description": "Master investing, trading, and personal finance knowledge. Available in English, Korean, and Japanese.",
      "publisher": {
        "@type": "Organization",
        "name": "Economy Helper",
        "logo": {
          "@type": "ImageObject",
          "url": "https://economyhelper.com/images/logo.png"
        }
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />

    <style>
        .hero-pattern {
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%233b82f6' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .root-fade-in {
            animation: rootFadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes rootFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .language-card {
            transition: all 0.3s ease;
        }

        .language-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="hero-pattern min-h-screen flex flex-col">
    <!-- Header injected by components.js -->
    <header id="header" class="bg-white/80 backdrop-blur-sm border-b border-slate-200 sticky top-0 z-50"></header>

    <!-- Main Content -->
    <main id="main-content" class="container mx-auto px-4 py-12 sm:py-20 flex-grow">
        <!-- Dynamic content will be injected here -->
        <div id="loading" class="flex justify-center items-center py-20">
            <span class="loading loading-spinner loading-lg text-blue-500"></span>
        </div>
    </main>

    <!-- Footer injected by components.js -->
    <footer id="footer" class="bg-white border-t border-slate-200"></footer>

    <script src="components.js"></script>
    <script>
        const ROOT_I18N = {
            kr: {
                TITLE: '경제 도우미에 오신 것을 환영합니다',
                SUBTITLE: '금융 이해력과 경제적 이해를 위한 관문',
                DESC: '무료 경제 사전, 금융 계산기 및 투자 성향 도구',
                FEATURES_TITLE: '주요 서비스',
                DICT_NAME: '경제 사전',
                QUIZ_NAME: '경제 퀴즈',
                CALC_NAME: '금융 계산기',
                LANG_NAME: '다국어 지원'
            },
            us: {
                TITLE: 'Welcome to Economy Helper',
                SUBTITLE: 'Your gateway to financial literacy and economic understanding',
                DESC: 'Free economic dictionaries, financial calculators, and investment tools',
                FEATURES_TITLE: 'What We Offer',
                DICT_NAME: 'Economic Dictionary',
                QUIZ_NAME: 'Economy Quiz',
                CALC_NAME: 'Financial Calculators',
                LANG_NAME: 'Multi-language'
            },
            jp: {
                TITLE: 'Economy Helperへようこそ',
                SUBTITLE: '金融リテラシーと経済理解への入り口',
                DESC: '無料の経済辞典、金融計算機、投資ツール',
                FEATURES_TITLE: '提供サービス',
                DICT_NAME: '経済辞典',
                QUIZ_NAME: '経済クイズ',
                CALC_NAME: '金融計算機',
                LANG_NAME: '多言語対応'
            },
            es: {
                TITLE: 'Bienvenido a Economy Helper',
                SUBTITLE: 'Tu puerta de entrada a la educación financiera y la comprensión económica',
                DESC: 'Diccionarios económicos gratuitos, calculadoras financieras y herramientas de inversión',
                FEATURES_TITLE: 'Lo Que Ofrecemos',
                DICT_NAME: 'Diccionario Económico',
                QUIZ_NAME: 'Quiz de Economía',
                CALC_NAME: 'Calculadoras Financieras',
                LANG_NAME: 'Multilingüe'
            }
        };

        function initRootPage() {
            // components.js에서 전역으로 노출한 변수 사용
            const lang = window.CURRENT_LANG || 'us';
            const langPath = window.LANG_PATH || './us/';

            const content = ROOT_I18N[lang] || ROOT_I18N.us;
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="root-fade-in max-w-5xl mx-auto">
                    <!-- Hero Section -->
                    <div class="text-center mb-16">
                        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-800 mb-6 leading-tight">
                            ${content.TITLE}
                        </h1>
                        <p class="text-xl sm:text-2xl text-slate-600 mb-8 max-w-2xl mx-auto font-medium">
                            ${content.SUBTITLE}
                        </p>
                        <p class="text-lg text-slate-500 mb-10">
                            ${content.DESC}
                        </p>
                    </div>

                    <!-- Visual Section -->
                    <div class="relative bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden mb-24 aspect-[16/9] sm:aspect-[21/9]">
                        <div class="absolute inset-0 bg-gradient-to-tr from-blue-600 to-purple-600 opacity-90 flex items-center justify-center">
                            <div class="text-center text-white p-8">
                                <div class="text-7xl mb-4">🌍</div>
                                <h3 class="text-3xl font-bold mb-2">Making finance accessible to everyone.</h3>
                                <p class="text-blue-100">Across 4 languages and global markets.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Features Section -->
                    <div class="mb-24">
                        <h2 class="text-3xl font-bold text-center text-slate-800 mb-12">${content.FEATURES_TITLE}</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            <a href="${langPath}index.html" class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm text-center hover:shadow-md transition-shadow">
                                <div class="text-4xl mb-4">📖</div>
                                <h3 class="font-bold text-slate-800">${content.DICT_NAME}</h3>
                            </a>
                            <a href="${langPath}economy-quiz.html" class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm text-center hover:shadow-md transition-shadow">
                                <div class="text-4xl mb-4">🎯</div>
                                <h3 class="font-bold text-slate-800">${content.QUIZ_NAME}</h3>
                            </a>
                            <a href="${langPath}compound-interest-calculator.html" class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm text-center hover:shadow-md transition-shadow">
                                <div class="text-4xl mb-4">🧮</div>
                                <h3 class="font-bold text-slate-800">${content.CALC_NAME}</h3>
                            </a>
                            <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm text-center">
                                <div class="text-4xl mb-4">🌐</div>
                                <h3 class="font-bold text-slate-800">${content.LANG_NAME}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // components.js가 먼저 실행되어 변수들을 설정함
            if (typeof initComponents === 'function') {
                initComponents('home');
            }
            if (typeof initRootPage === 'function') {
                initRootPage();
            }
        });

        // 만약 DOMContentLoaded가 이미 발생했을 경우를 대비
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (typeof initRootPage === 'function' && !document.querySelector('.root-fade-in')) {
                initRootPage();
            }
        }
    </script>
</body>

</html>
