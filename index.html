    <style>

            background-color: #f8fafc;

        }

        .root-fade-in {
            animation: rootFadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes rootFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>

    <!-- Stylesheets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

</head>

<body class="hero-pattern min-h-screen flex flex-col">

    <!-- Main Content -->
    <main id="main-content" class="container mx-auto px-4 py-12 sm:py-20 flex-grow">
        <!-- Dynamic content will be injected here -->
        <div id="loading" class="flex justify-center items-center py-20">
            <span class="loading loading-spinner loading-lg text-blue-500"></span>
        </div>
    </main>

    <!-- Footer injected by components.js -->
    <footer id="footer" class="bg-white border-t border-slate-200"></footer>

    <script src="components.js"></script>
    <script>
        const ROOT_I18N = {

                META_KEYWORDS: 'economic terms, finance glossary, investment terms, trading vocabulary, personal finance, compound interest calculator, savings goal',

            },

                META_DESC: '投資、トレード、個人財務の知識をマスターしましょう。日本語サービスを提供しています。',
                META_KEYWORDS: '経済用語, 金融用語集, 投資用語, 取引用語, 個人金融, 複利計算機, 貯蓄目標',
                OG_LOCALE: 'ja_JP',

                LD_JSON_NAME: 'Economy Helper',

                DESC: '無料の経済辞典、金融計算機、投資ツール',
                VISUAL_TITLE: 'すべての人に、経済をよりシンプルに。'
            },
            es: {
                HTML_LANG: 'es',
                PAGE_TITLE: 'Economy Helper - Haciendo la economía simple para todos',
                META_DESC: 'Domina el conocimiento sobre inversión, trading y finanzas personales. Disponible en español.',
                META_KEYWORDS: 'términos económicos, glosario financiero, términos de inversión, finanzas personales, calculadora interés compuesto, meta ahorro',

                LD_JSON_DESC: 'Domina el conocimiento sobre inversión, trading y finanzas personales.',
                LD_JSON_NAME: 'Economy Helper',

                DESC: 'Diccionarios económicos gratuitos, calculadoras financieras y herramientas de inversión',

            pt: {

                OG_LOCALE: 'pt_BR',
                LD_JSON_DESC: 'Domine o conhecimento sobre investimento, trading e finanças pessoais.',
                LD_JSON_NAME: 'Economy Helper',
                TITLE: 'Bem-vindo ao Economy Helper',
                SUBTITLE: 'Seu portal para educação financeira e compreensão econômica',
                DESC: 'Dicionários econômicos gratuitos, calculadoras financeiras e ferramentas de investimento',
                VISUAL_TITLE: 'Tornando a economia simples para todos.'

        };

        function initRootPage() {
            // components.js에서 전역으로 노출한 변수 사용
            const lang = window.CURRENT_LANG || 'us';
            const langPath = window.LANG_PATH || './us/';

            const content = ROOT_I18N[lang] || ROOT_I18N.us;

            // 동적으로 html lang 변경
            document.documentElement.lang = content.HTML_LANG;

            // 동적으로 title 변경
            document.title = content.PAGE_TITLE;
            const metaTitle = document.querySelector('meta[name="title"]');
            if (metaTitle) metaTitle.content = content.PAGE_TITLE;

            // 동적으로 meta description 변경
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.content = content.META_DESC;

            // 동적으로 meta keywords 변경
            const metaKeywords = document.querySelector('meta[name="keywords"]');
            if (metaKeywords) metaKeywords.content = content.META_KEYWORDS;

            // 동적으로 og:title, og:description, og:locale 변경
            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.content = content.PAGE_TITLE;
            const ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.content = content.META_DESC;
            const ogLocale = document.querySelector('meta[property="og:locale"]');
            if (ogLocale) ogLocale.content = content.OG_LOCALE;

            // 동적으로 twitter:title, twitter:description 변경
            const twitterTitle = document.querySelector('meta[name="twitter:title"]');
            if (twitterTitle) twitterTitle.content = content.PAGE_TITLE;
            const twitterDesc = document.querySelector('meta[name="twitter:description"]');
            if (twitterDesc) twitterDesc.content = content.META_DESC;

            // 동적으로 ld+json 변경
            const ldJsonScripts = document.querySelectorAll('script[type="application/ld+json"]');
            if (ldJsonScripts.length >= 2) {
                // Organization 스키마 업데이트
                const orgJson = {
                    "@context": "https://schema.org",
                    "@type": "Organization",
                    "name": "Economy Helper",
                    "url": "https://economyhelper.com/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://economyhelper.com/images/logo.png",
                        "width": 512,
                        "height": 512
                    },
                    "sameAs": []
                };
                ldJsonScripts[0].textContent = JSON.stringify(orgJson);

                // WebSite 스키마 업데이트
                const websiteJson = {
                    "@context": "https://schema.org",
                    "@type": "WebSite",
                    "name": content.LD_JSON_NAME,
                    "url": "https://economyhelper.com/",
                    "potentialAction": {
                        "@type": "SearchAction",
                        "target": `https://economyhelper.com/${lang}/index.html?q={search_term_string}`,
                        "query-input": "required name=search_term_string"
                    },
                    "description": content.LD_JSON_DESC,
                    "inLanguage": content.HTML_LANG
                };
                ldJsonScripts[1].textContent = JSON.stringify(websiteJson);
            }
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <div class="root-fade-in max-w-5xl mx-auto">
                    <!-- Hero Section -->
                    <div class="text-center mb-16">
                        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-800 mb-6 leading-tight">
                            ${content.TITLE}
                        </h1>
                        <p class="text-xl sm:text-2xl text-slate-600 mb-8 max-w-2xl mx-auto font-medium">
                            ${content.SUBTITLE}
                        </p>
                        <p class="text-lg text-slate-500 mb-10">
                            ${content.DESC}
                        </p>
                    </div>

                    <!-- Visual Section -->
                    <div class="relative bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden mb-24 aspect-[16/9] sm:aspect-[21/9]">
                        <div class="absolute inset-0 bg-gradient-to-tr from-blue-600 to-purple-600 opacity-90 flex items-center justify-center">
                            <div class="text-center text-white p-8">
                                <div class="text-7xl mb-4">🌍</div>
                                <h3 class="text-3xl font-bold mb-2">${content.VISUAL_TITLE}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // components.js가 먼저 실행되어 변수들을 설정함
            if (typeof initComponents === 'function') {
                initComponents('home');
            }
            if (typeof initRootPage === 'function') {
                initRootPage();
            }
        });

        // 만약 DOMContentLoaded가 이미 발생했을 경우를 대비
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (typeof initRootPage === 'function' && !document.querySelector('.root-fade-in')) {
                initRootPage();
            }
        }
    </script>
</body>

</html>
