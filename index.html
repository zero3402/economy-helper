            'Inflation': { definition: 'The rate at which prices for goods and services increase over time.', example: 'With 5% inflation, something costing $100 last year now costs $105.' },

            'Mortgage': { definition: 'A loan used to purchase property, with the property as collateral.', example: 'You get a 30-year mortgage at 6.5% to buy your first home.' },

            'Minimum Wage': { definition: 'The lowest hourly wage employers are legally required to pay.', example: 'The federal minimum wage is $7.25, but many states require higher.' },

            'Opportunity Cost': { definition: 'The value of what you give up when making a choice.', example: 'The opportunity cost of buying a car is the vacation you could have taken instead.' },

            // P
            'Portfolio': { definition: 'A collection of investments owned by a person or organization.', example: 'Your portfolio includes stocks, bonds, and real estate investments.' },

            'Retirement': { definition: 'The period of life after you stop working, funded by savings and pensions.', example: 'Planning for retirement means saving enough to live comfortably without working.' },

            'Risk Management': { definition: 'Identifying and addressing potential financial risks.', example: 'Buying insurance is a form of risk management.' },

            'Savings': { definition: 'Money set aside for future use rather than spent immediately.', example: 'You put 20% of each paycheck into savings.' },

            // U
            'Unemployment': { definition: 'The state of being without a job while actively seeking work.', example: 'The unemployment rate of 4% means 4 of every 100 workers are jobless.' },

            // Y
            'Yield': { definition: 'The income return on an investment, usually expressed as a percentage.', example: 'A bond with 4% yield pays $40 annually on a $1,000 investment.' },
            'Yield Curve': { definition: 'A graph showing interest rates across different loan lengths.', example: 'An inverted yield curve often predicts an upcoming recession.' },

            // Z
            'Zero-sum Game': { definition: 'A situation where one person\'s gain equals another\'s loss.', example: 'Poker is a zero-sum game - winners take money from losers.' },
            'Zombie Company': { definition: 'A company that earns just enough to pay interest on debt but cannot grow.', example: 'Zombie companies survive on low interest rates but fail when rates rise.' }
        };

        function searchDictionary(query) {
            const results = [];
            const lowerQuery = query.toLowerCase();

            for (const [letter, terms] of Object.entries(economyDictionary)) {
                for (const term of terms) {
                    if (term.toLowerCase().includes(lowerQuery)) {
                        results.push({ letter, term });
                    }
                }
            }
            return results;
        }

        function filterByLetter(letter) {
            if (letter === 'ALL') {
                const results = [];
                for (const [l, terms] of Object.entries(economyDictionary)) {
                    for (const term of terms) {
                        results.push({ letter: l, term });
                    }
                }
                return results;
            }
            return economyDictionary[letter]?.map(term => ({ letter, term })) || [];
        }

        function showTermModal(term) {
            const modal = document.getElementById('term-modal');
            const modalTerm = document.getElementById('modal-term');
            const modalDefinition = document.getElementById('modal-definition');
            const modalExample = document.getElementById('modal-example');

            const termData = termDefinitions[term];

            modalTerm.textContent = term;

            if (termData) {
                modalDefinition.textContent = termData.definition;
                modalExample.textContent = termData.example;
            } else {
                modalDefinition.textContent = 'Definition coming soon. This term refers to a concept in economics or finance.';
                modalExample.textContent = 'Real-life example coming soon.';
            }

            modal.showModal();
        }

        function displayResults(results, title) {
            const resultsContainer = document.getElementById('search-results');
            const resultsTitle = document.getElementById('results-title');
            const resultsCount = document.getElementById('results-count');
            const resultsList = document.getElementById('results-list');

            resultsTitle.textContent = title;
            resultsCount.textContent = `${results.length} terms found`;

            resultsList.innerHTML = results.map(({ letter, term }) => `
                <div class="term-card bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl p-3 sm:p-4 cursor-pointer flex items-center gap-3" onclick="showTermModal('${term.replace(/'/g, "\\'")}')">
                    <span class="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold text-sm flex items-center justify-center flex-shrink-0">${letter}</span>
                    <span class="text-slate-700 font-medium text-sm sm:text-base truncate">${term}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
            `).join('');

            resultsContainer.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const alphabetBtns = document.querySelectorAll('.alphabet-btn');

            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    const results = searchDictionary(query);
                    displayResults(results, `"${query}" Results`);
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        const results = searchDictionary(query);
                        displayResults(results, `"${query}" Results`);
                    }
                }
            });

            let debounceTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = searchInput.value.trim();
                    if (query.length >= 2) {
                        const results = searchDictionary(query);
                        displayResults(results, `"${query}" Results`);
                    } else if (query.length === 0) {
                        document.getElementById('search-results').classList.add('hidden');
                    }
                }, 300);
            });

            alphabetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all buttons
                    alphabetBtns.forEach(b => {
                        b.classList.remove('bg-blue-600', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    // Activate clicked button
                    btn.classList.remove('bg-slate-100', 'text-slate-600');
                    btn.classList.add('bg-blue-600', 'text-white');

                    const letter = btn.dataset.letter;
                    const results = filterByLetter(letter);
                    const title = letter === 'ALL' ? 'All Financial Terms' : `Terms starting with "${letter}"`;
                    displayResults(results, title);

                    searchInput.value = '';
                });
            });

            // Initial state: Show ALL terms
            const allBtn = document.querySelector('.alphabet-btn[data-letter="ALL"]');
            allBtn.classList.remove('bg-slate-100', 'text-slate-600');
            allBtn.classList.add('bg-blue-600', 'text-white');
            displayResults(filterByLetter('ALL'), 'All Financial Terms');
        });
    </script>
