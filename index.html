<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy Helper</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1927828313220344"
        crossorigin="anonymous"></script>
    <script>
        (function () {
            // 저장된 언어 설정 확인
            var savedLang = localStorage.getItem('preferredLanguage');

            if (savedLang) {
                window.location.replace(savedLang + '/index.html');
                return;
            }

            // 브라우저 언어 감지
            var userLang = navigator.language || navigator.userLanguage;
            var lang = userLang.toLowerCase();

            // 한국어면 kr, 그 외에는 us로 리다이렉트
            if (lang.startsWith('ko')) {
                window.location.replace('kr/index.html');
            } else {
                window.location.replace('us/index.html');
            }
        })();
    </script>
</head>
<body>
    <amp-auto-ads type="adsense" data-ad-client="ca-pub-1927828313220344"></amp-auto-ads>
    <noscript>
        <meta http-equiv="refresh" content="0; url=us/index.html">
        <p>Redirecting... <a href="us/index.html">Click here if not redirected</a></p>
    </noscript>
</body>

</html>
