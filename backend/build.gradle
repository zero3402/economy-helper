plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.saiden'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// 21이어야 하는 이유는 가상 스레드다. 외부 호출(피드 5 + HN + Gemini 10)이 전부
		// 순차라 브리핑 한 번이 1분을 넘었는데, 이 호출들은 계산이 아니라 기다림이라
		// 스레드를 늘리는 것만으로 줄어든다. 플랫폼 스레드 풀을 손으로 관리하는 대신
		// Executors.newVirtualThreadPerTaskExecutor()를 쓴다.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	shedlockVersion = '7.7.0'
	resilience4jVersion = '2.4.0'
	romeVersion = '2.1.0'
	wiremockVersion = '3.13.1'
}

dependencies {
	// Spring Boot 4.1은 스타터 이름이 Boot 3과 다르다: web -> webmvc
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// Boot 4는 Jackson 3(tools.jackson)을 쓴다. webmvc가 전이로 끌어오지만
	// 컴파일 클래스패스에는 오르지 않아 명시한다.
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	// Boot 4는 HTTP 클라이언트 자동 설정을 서버 스타터에서 분리했다.
	// 이게 없으면 RestClient.Builder 빈이 없다 — HN·Gemini·텔레그램 모두 필요하다.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// Boot 4에는 spring-boot-starter-aop가 없다(제거됨). resilience4j 애노테이션이
	// 프록시 기반이라 AspectJ가 필요하므로 직접 건다.
	implementation 'org.aspectj:aspectjweaver'

	// RSS/Atom 파싱 — 매체마다 형식 변형이 있어 관대한 파서가 필요하다
	implementation "com.rometools:rome:${romeVersion}"

	// 피드 소스별 / 번역 / 텔레그램 각각에 서킷브레이커를 건다
	implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"

	// replicas 2에서 09/21시 정기 발송이 두 번 나가는 것을 막는다
	implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-provider-redis-spring:${shedlockVersion}"

	// Boot 4.1은 스타터마다 짝이 되는 테스트 아티팩트를 따로 붙인다
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Testcontainers 2.x에서 모듈명이 junit-jupiter -> testcontainers-junit-jupiter로 바뀌었다
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	// 외부 피드 / Gemini / 텔레그램을 스텁해 네트워크 없이 테스트한다
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 대부분이 외부 호출 없는 단위 테스트라 서로 기다릴 이유가 없다(개수는 적지 않는다 —
	// ARCHITECTURE.md 6절이 그 이유를 적어 뒀다. 여기 적힌 숫자가 이미 한 번 낡았다).
	// 절반만 쓰는 이유는 WireMock·Testcontainers가 포트와 도커를 잡기 때문이다 —
	// 코어를 다 쓰면 그쪽이 먼저 흔들린다.
	maxParallelForks = Math.max(1, (int) (Runtime.runtime.availableProcessors() / 2))
}
