spring:
  application:
    name: economy-helper
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      # 관리형 Redis(Upstash·ElastiCache·Redis Cloud)는 전부 인증과 TLS를 요구한다.
      # 여기가 비어 있으면 배포처가 정해지는 순간 코드를 고쳐야 하므로 미리 환경변수로 열어 둔다.
      # 빈 값은 Spring이 "인증 없음"으로 처리해서 로컬 동작은 그대로다.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  cache:
    type: redis
  # 웹 요청 처리를 가상 스레드로 돌린다. 이 서비스의 스레드는 거의 전부 외부 API를 기다리는
  # 중이라(피드·Gemini·업비트·텔레그램), 톰캣 기본 200 스레드가 상한이 되는 구조였다.
  # 수집 쪽 병렬화는 Concurrently가 따로 가상 스레드를 띄운다 — 이건 요청 처리 쪽이다.
  threads:
    virtual:
      enabled: true
  # 외부 호출(피드 여덟·HN·Gemini·텔레그램)에 타임아웃을 건다. 없으면 응답 없는 상대를 만났을 때
  # 정기 발송이 무한히 멈추고 그 사이 ShedLock을 lockAtMostFor(20분)까지 쥐고 있는다.
  # Boot 4.0부터 단수 spring.http.client.*는 deprecated다 — clients(복수)를 쓴다.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s

server:
  # PORT를 읽는다 — PaaS는 대개 포트를 주입하고 거기로만 트래픽을 보낸다(Render 기본값 10000).
  # 없으면 8080이라 로컬·compose 동작은 그대로다. 특정 벤더 이름이 설정에 들어가지 않는다.
  port: ${PORT:8080}

management:
  # 액추에이터를 애플리케이션 포트에서 분리한다. /actuator/digest는 텔레그램 전체 발송을
  # 즉시 일으키므로 8080에 함께 노출하면 외부 누구나 방송을 트리거할 수 있다.
  #
  # 포트를 하나만 노출하는 호스트(Render 등)에서는 MANAGEMENT_PORT를 PORT와 같게 줘
  # 한 포트로 합친다. 그때는 digest를 exposure에서 빼는 것이 방어다 — DEPLOY.md 참조.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        # caches는 Boot가 주는 것이다(이름 목록 + 캐시 통째로 비우기), evict는 우리 것이고
        # 키 하나만 지목해 버린다 — 그쪽이 못 하는 것이 그것뿐이라 그것만 만들었다.
        # ⚠️ 둘 다 쓰기 연산이다. 비우면 다음 조회가 무료 티어 쿼터를 다시 태운다
        #    (FMP 250/일·AccuWeather 50/일·수출입은행 1,000/일이 전부 캐시를 실질 방어로 삼는다).
        #    digest와 같은 이유로 관리 포트에 격리돼 있어야 하고, 포트를 하나로 합치는
        #    배포처에서는 digest와 함께 빼는 것이 방어다.
        include: health,info,metrics,digest,weather,caches,evict
  endpoint:
    health:
      show-details: when-authorized

economy-helper:
  # 출처마다 타임아웃을 따로 준다. 전역 하나(spring.http.clients, 위)로는 스물셋을 못 맞춘다 —
  # 실측 p50이 업비트 37ms에서 FMP 1.7초까지 벌어지고, Gemini는 조회가 아니라 생성이다.
  #
  # ⚠️ **키가 호스트다.** 출처 이름이 아니다. Boot 4에는 손으로 만든 RestClient용 이름별
  #    타임아웃이 없다(spring.http.clients는 평평한 전역 블록 하나이고, 키별 형태인
  #    spring.http.serviceclient.*는 @ImportHttpServices 인터페이스 클라이언트 전용이다).
  #    호스트가 그 키로 맞는 이유는 경계가 이미 그렇게 그려져 있어서다 — Open-Meteo 셋이
  #    호스트 셋이고 브레이커도 셋, AccuWeather 둘이 호스트 하나이고 브레이커도 하나,
  #    KIS 셋이 호스트 하나이고 앱키도 간격 문도 하나다. 새 개념을 만들지 않는다.
  # ⚠️ Map이 아니라 목록이다 — 호스트에 점이 들어가는데 relaxed binding이 Map 키의 점을
  #    걸러낸다(us-indices·us-symbols·알람 지역이 같은 이유로 목록이다).
  # ⚠️ 포트는 적지 않는다 — URI.getHost()가 포트를 떼고 온다.
  # ⚠️ **여기 없는 호스트는 조용히 전역 기본값이 된다.** 오타가 오류를 내지 않으므로
  #    HttpTimeoutsTest가 이 목록의 호스트가 실재하는 base-url인지 본다.
  http-timeouts:
    # 시세 — 실측 37~142ms(2026-08-20)라 3초는 20~80배 여유다. 여기가 3초를 넘겨 기다리는
    # 것은 crypto-price 캐시(10초) 수명의 3분의 1을 태우는 일이고, /crypto는 사용자가 화면을
    # 보며 기다리는 경로다.
    - host: api.upbit.com                    # ticker 37ms · market/all 74ms(63KB)
      connect: 2s
      read: 3s
    - host: api.binance.com                  # 86ms
      connect: 2s
      read: 3s
    # 바이낸스 2순위(지역 차단 우회). 1순위와 같은 값이어야 한다 — 우회로가 더 느긋할 이유가 없다
    - host: data-api.binance.vision          # 86ms (실측 2026-08-20)
      connect: 2s
      read: 3s
    # 유럽중앙은행을 같은 칸에 넣은 이유는 **뒤에 하루 1,000회짜리가 서 있어서다** —
    # 여기서 오래 기다리는 것이 곧 수출입은행 한도를 태우는 일이다.
    - host: api.frankfurter.dev              # 142ms
      connect: 2s
      read: 3s
    # 날씨(무인증) — 실측 0.9~1.1초(TLS 포함). 6초는 5배 여유이고, 재시도 3회 × 6초 = 18초가
    # 최악의 천장으로 눈에 보인다. 지오코딩은 /weather의 첫 단계라 여기가 늘어지면 사용자
    # 체감이 통째로 늘어난다.
    - host: geocoding-api.open-meteo.com     # 1,109ms
      connect: 3s
      read: 6s
    - host: api.open-meteo.com               # 912ms
      connect: 3s
      read: 6s
    - host: archive-api.open-meteo.com       # 970ms
      connect: 3s
      read: 6s
    # 키·한도 있는 조회 — read만 15초에서 좁혔다. 효과가 가장 큰 칸이다: 브리핑의 KIS 9회가
    # 최악 135초 → 90초, 환율 3단 완전 장애가 45초 → 23초(10+3+10).
    # ⚠️ 이 아래로는 못 내린다. KIS가 **잘못된 키를 거절하는 데** 2.2~3.5초를 쓴다
    #    (실측 2026-08-20, 웜 커넥션 3회: 3.55s · 2.26s · 2.45s).
    - host: openapivts.koreainvestment.com   # 모의
      connect: 5s
      read: 10s
    # ⚠️ 실전 도메인을 함께 적는다. 호스트로 키를 잡았으므로, 실전으로 옮기는 날
    #    (openapi.koreainvestment.com:9443 — 아래 market.kis 주석 참조) KIS가 조용히 전역
    #    기본값 15초로 떨어진다. 값이 같아도 두 줄이어야 하는 이유가 그것이다.
    - host: openapi.koreainvestment.com      # 실전
      connect: 5s
      read: 10s
    - host: dataservice.accuweather.com      # 525ms
      connect: 5s
      read: 10s
    - host: financialmodelingprep.com        # 1,678ms(콜드)
      connect: 5s
      read: 10s
    - host: oapi.koreaexim.go.kr             # 82ms
      connect: 5s
      read: 10s
    - host: apis.data.go.kr                  # 54ms
      connect: 5s
      read: 10s
    # 발송이 끝까지 가는 것이 이 앱의 목적이라 넉넉히 둔다. 재시도 3회 × 10초가 상한이다.
    - host: api.telegram.org                 # 764ms(TLS 콜드)
      connect: 5s
      read: 10s
    # ⚠️ 여기만 **늘린다.** 생성은 조회가 아니다 — 기사 여덟 건 관련도 채점과 요약을 한 번에
    #    만든다. 15초가 유일하게 너무 짧을 수 있는 자리이고, 잘리면 번역이 원문으로 조용히
    #    강등된다(감사에서 실제로 본 모습이다). 리미터 timeoutDuration(20초)과 합쳐 최악
    #    50초인데, 브리핑은 백그라운드이고 발송 창이 두 시간이다.
    - host: generativelanguage.googleapis.com
      connect: 5s
      read: 30s
    # 여기 없는 것 — HN(117KB·콜드 1.6초)·RSS 여덟 피드(121KB·콜드 DNS 1.3초)·자체 핑.
    # **일부러 안 건드린다.** 실패해도 그 매체만 빠지고, 노브를 줄이는 것 자체가 값이다.
  feeds:
    # 전부 전문 무료다. 페이월 매체(Bloomberg·Reuters·FT·Economist)는 뺐다 —
    # 링크를 눌러도 못 읽는 기사는 좋은 답이 아니다. 새 매체를 더할 때도 같은 기준이다.
    # 경제 다섯은 글로벌 점유율 순이고(2026-08-14 실측 전부 200), 코인 둘은 코인 전문
    # 매체다(2026-08-27 실측 둘 다 200). 매체 일곱 · 항목 여덟이다.
    #
    # 섹션을 좁혀 잡는다. 홈 피드를 쓰면 일반 뉴스가 섞이는데, 하류에서 걸러내는 것보다
    # 상류에서 소스를 좁히는 편이 근본적이다.
    yahoo-finance:
      url: https://finance.yahoo.com/news/rssindex   # 44건
      type: rss
    investing:
      url: https://www.investing.com/rss/news_25.rss  # 10건
      type: rss
    investing-crypto:
      # 같은 매체의 암호화폐 섹션. 매체를 늘린 게 아니라 섹션을 하나 더 연 것이다.
      # 코인 기사는 금융 일반 피드에 거의 안 실린다 — 2026-08-15 실측으로 Yahoo만 49건 중 3건이었고
      # CNBC Markets·BBC Business·Investing 본 피드는 오늘자 0건이었다.
      url: https://www.investing.com/rss/news_301.rss  # 10건, 오늘자 비트코인 기사 3건
      type: rss
    # ⚠️ 코인 전문 매체 둘 — 위 암호화폐 섹션 하나로는 브리핑의 코인 다섯 건을 못 채운다.
    #    실측(2026-08-27): news_301.rss가 10건 중 **24시간 안이 6건**이었고(나머지는 08-25·08-24)
    #    그중 일부는 보도자료성이라 관련도 문턱(0.4)에 걸린다. 둘을 더해 코인 풀이 60건대가 된다.
    #    같은 실측에서 앱 UA(economy-helper/1.0)로 둘 다 200이고, 전문 무료·로그인 벽 없음이다.
    coindesk:
      # ⚠️ 끝에 슬래시를 붙이면 안 된다. `.../rss/`는 308로 `.../rss`를 가리키는데
      #    우리 RestClient는 리다이렉트를 따라가지 않는다 — 15바이트짜리 `Redirecting...`
      #    본문을 받아 SAXParseException으로 끝나고 이 매체가 통째로 빠진다.
      #    로그에는 뜨지만(`[COINDESK] 피드 수집 실패`) 발송은 멀쩡해 보이므로 안 보고는 모른다.
      #    curl로 잴 때 -L을 붙이면 200으로 보여서 더 안 보인다 — 실측 감사가 잡은 자리다.
      url: https://www.coindesk.com/arc/outboundfeeds/rss   # 25건, 요약문이 평문 87~166자
      type: rss
    cointelegraph:
      # 요약문이 <p><img> 마크업으로 시작하지만 RssFeedClient.clean()이 태그를 걷어낸다.
      # 링크에 ?utm_source=rss_feed 꼬리가 붙는데 호스트는 자기 것이라 owns()를 통과한다.
      url: https://cointelegraph.com/rss   # 30건, 걷어낸 뒤 평문 152~165자
      type: rss
    cnbc:
      # id=10000664는 Markets 섹션이다. 홈 피드는 일반 뉴스가 섞인다
      url: https://www.cnbc.com/id/10000664/device/rss/rss.html   # 30건
      type: rss
    bbc:
      url: https://feeds.bbci.co.uk/news/business/rss.xml   # 52건
      type: rss
    ap:
      # 통신사 자리를 Reuters에서 넘겨받았다 — 둘 다 통신사고 AP는 전문이 무료다.
      # 공식 RSS가 없어 Google News 검색 피드를 프록시로 쓴다(Reuters가 쓰던 방식 그대로).
      # 이 피드는 description이 링크 마크업뿐이라 제목만 신뢰한다.
      url: "https://news.google.com/rss/search?q=when:24h+site:apnews.com+business+OR+markets+OR+economy&hl=en-US&gl=US&ceid=US:en"   # 100건
      type: google-news

  ranking:
    # 어느 매체도 조회수/댓글 수를 공개하지 않아 공개 신호로 인기도를 근사한다.
    # 합이 1일 필요는 없다 — PopularityScorer가 합으로 나눠 정규화하므로 비율만 맞으면 된다.
    weights:
      feed-rank: 0.35      # RSS 노출 순서 = 편집자가 매긴 우선순위
      recency: 0.25
      # 네 항 중 유일하게 "주제"를 아는 항이다. 정기 발송에서는 LLM이 매긴 재테크 관련도,
      # /news 검색에서는 검색어와의 매칭도가 여기 들어간다.
      keyword-match: 0.25
      buzz: 0.15           # Hacker News 실측 (points + num_comments)
    recency-half-life: 6h
    # 이보다 오래된 기사는 수집 단계에서 버린다. 신선도 가중치는 랭킹 네 항 중 하나일 뿐이라
    # 피드 앞자리에 놓인 옛 기사를 못 막는다 — Yahoo는 50건 중 12건이 2024~2025년 기사였다.
    # 재테크 뉴스에서 사흘이 넘은 것은 답이 아니다.
    max-age: 3d
    hacker-news:
      # 매체가 조회수·댓글을 공개하지 않고 Most Read 페이지도 전부 403/404라,
      # HN이 무료로 얻을 수 있는 유일한 실측 반응이다.
      # 커버리지는 매체당 하루 ~4건이다(피드는 10~100건).
      base-url: https://hn.algolia.com
      window: 7d
      hits-per-page: 100

  cache-ttl:
    # 값을 주지 않으면 Redis 캐시는 만료 없이 저장한다. 특히 feed가 영구 캐시되면
    # 발송 창(09~10시) 안에서 같은 기사가 되풀이되고 다음 날까지 남는다 — 반드시 명시할 것.
    #
    # 여기에 이름을 적는 것만으로는 부족하다. CacheConfig에도 같은 이름을 등록해야 하고,
    # 빠뜨리면 Redis 기본값(JDK 직렬화·무기한)으로 떨어져 레코드를 담는 순간 예외가 난다.
    # CacheConfigTest.configuresEveryDeclaredCache가 그 누락을 잡는다.
    #
    # 수명은 값의 성질을 따른다: 현재가 10s~1m · 전일 종가 1h · 목록 6h · LLM 해석 7d 이상.
    feed: 10m
    translation: 7d        # 같은 기사를 두 번 번역하지 않는다 (무료 티어 절약)
    buzz: 1h               # HN 반응은 천천히 쌓인다. 매 랭킹마다 조회할 이유가 없다
    query: 30d             # '비트코인'→bitcoin 대응은 낡지 않는다. 토큰 단위라 적중률도 높다
    relevance: 7d          # 기사는 바뀌지 않는다. 배치 단위로 캐시해 재트리거 때 Gemini를 또 부르지 않는다
    upbit-markets: 6h      # 신규 상장·상장폐지는 드물다. 이게 없으면 /crypto 한 번에 조회가 두 번 나간다
    crypto-price: 10s      # 시세다. 길게 잡으면 거짓말이 된다. 연타와 초당 10회 제한을 막는 정도만
    binance-price: 10s     # 업비트와 같은 급. 두 거래소 값의 시각이 어긋나면 비교가 무의미해진다
    stock-resolve: 7d      # LLM 해석 결과. 같은 검색어에 Gemini를 두 번 태우지 않는다
    crypto-resolve: 7d     # 코인도 같다. 업비트 이름 매칭이 놓친 것만 여기로 오므로 호출 자체가 드물다
    stock-price: 1h        # 전일 종가라 자주 바뀌지 않는다. 일 1만회 한도도 이걸로 지킨다
    us-quote: 1m           # 미국은 현재가다. 이보다 길게 잡으면 '현재가'가 아니게 된다 —
                           # 대신 하루 250회 한도는 캐시가 아니라 FmpQuotaGuard가 지킨다
    kis-quote: 1m          # 국내·미국 모두 실시간이다. fx-kis와 같은 이유로 1분이 상한 —
                           # 화면에 '읽은 시각'을 찍으므로 더 길면 그 시각이 실제보다 신선해 보인다
    stock-series: 12h      # 장이 끝나면 그날 칸이 굳는다. KIS는 호출 사이 1초를 지키므로
                           # 이 길이가 브리핑 지연의 실질 방어다
    crypto-series: 1h      # 코인은 주말도 장이 열려 오늘 칸이 계속 자란다 — 환율보다 짧게
                           # 잡는다. 세 도메인 중 여기만 진짜 새 호출이라 캐시가 값을 한다
    fx-series: 6h          # 일봉은 하루에 한 번 바뀐다. 시세(fx: 1m)와 따로 두는 이유가
                           # 그 수명이다 — 한 이름에 담으면 하루치 값을 1분마다 다시 받는다
    us-outlook: 12h        # 국내와 같은 성질이다. 다만 이쪽은 심볼당 FMP 호출이 **둘**이라
                           # 하루 250회 한도가 걸린다 — 이 길이가 그 한도의 실질 방어다
    kis-outlook: 12h       # 목표주가·투자의견은 증권사가 분기에 몇 번 낼 뿐이라 낡지 않는다.
                           # 길게 잡는 것이 이 기능의 실질 방어다 — 브리핑이 종목마다 조회를
                           # 하나 더 하는데 KIS는 호출 사이 1초를 지킨다
    weather: 10m           # 시세와 같은 급이다. 길게 잡으면 '오늘 날씨'가 어제 예보가 된다
    geocode: 30d           # 지명의 좌표는 낡지 않는다. 검색 한 번에 조회가 두 번 나가는 걸 막는다
    accu-location: 30d     # 좌표→AccuWeather 지점 키. 낡지 않는다 — 이게 실질 쿼터 방어다.
                           # 없으면 조회 한 번에 호출이 두 번이라 하루 50회를 금세 쓴다
    precipitation-hours: 10m   # 강수 시각. 예보와 같은 급이다 — 길게 잡으면 지난 시각을 말한다
    weather-resolve: 7d    # LLM 해석. '내일'은 offsetDays로 받으므로 캐시해도 내일이 고정되지 않는다
    fx: 1m                 # ⚠️ 유럽중앙은행은 영업일 16시 CET에 하루 한 번 고시한다 — 1분은
                           #    토스를 쓰던 시절의 값이 남은 것이다. 무인증·무한도라 해가
                           #    없어 그대로 두지만, 성질로는 fx-kexim(1h)과 같은 급이 맞다
    fx-kexim: 1h           # 수출입은행 하루 1,000회 한도를 지키는 실질 방어다 (1h면 하루 최대 24회)
    fx-kis: 1m             # 하루 중에도 움직이는 값이라 1분이 상한이다. 화면에 '읽은 시각'을
                           # 찍으므로 이보다 길게 잡으면 그 시각이 실제보다 신선해 보인다

  # 무활동으로 잠드는 호스트에서 깨어 있기 위한 자체 핑. 비우면 이 기능은 없는 것과 같다 —
  # 항상 켜져 있는 곳으로 옮기면 이 값만 비우고 코드는 그대로 둔다.
  #
  # 벤더 변수(RENDER_EXTERNAL_URL 등)를 코드가 읽지 않는다. 그 연결은 배포처 대시보드에서
  # SELF_PING_URL로 이어 준다 — 벤더 이름이 저장소에 들어오지 않는다.
  # ⚠️ 반드시 공개 주소여야 한다. localhost로 치면 호스트 라우터를 안 거쳐 유휴 타이머가
  #    리셋되지 않는다.
  keep-warm:
    url: ${SELF_PING_URL:}
    # 24시간이다. 쉬는 시간대를 두지 않는 이유는 밖에 의존하지 않기 위해서다 —
    # ⚠️ 시간대를 비우면 그 사이 스핀다운되고, 잠든 앱은 스스로 못 깨어난다.
    #    크론이 다시 돌 시각이 와도 실행할 프로세스가 없다. 09시 브리핑까지 잠들어 있게 되므로
    #    창을 두려면 밖에서 깨우는 수단(외부 모니터 등)이 반드시 함께 있어야 한다.
    #
    # 대가는 월 가동시간이다: 744시간(31일) / 한도 750시간 — 여유가 6시간뿐이다.
    # 무료 웹 서비스가 이것 하나뿐이어야 하고, 배포가 잦으면 구·신 인스턴스가 겹쳐
    # 시간이 더 붙는다. DEPLOY.md의 산수를 참조할 것.
    cron: "0 0/10 * * * *"

  digest:
    zone: Asia/Seoul
    # CLAUDE.md 1-1: 오전 9시. 09:00~10:50에 10분마다 돌고, 슬롯(날짜)이 하루 한 번을 보장한다.
    # 첫 틱이 보내고 나머지는 건너뛴다 — 09시에 인스턴스가 자고 있었다면 깨어난 뒤 첫 틱이 보낸다.
    # 창을 두 시간으로 닫는 것이 비영속 저장소(Render Key Value)에 대한 방어다:
    # 창이 없으면 저장소가 오후에 비었을 때 "오늘 안 보냄"으로 보여 브리핑을 다시 쏜다.
    cron: "0 0/10 9-10 * * *"
    # 지수는 종목코드가 없어 이름으로 쓴다. 값(List 원소)이라 한글이어도 안전하다 —
    # relaxed binding이 한글을 걸러내는 건 Map "키"일 때뿐이다(6단계에서 별칭 표가 그렇게 사라졌다).
    # 출처마다 조회 키가 다르다 — 공공데이터포털은 이름으로만 찾고 한국투자증권은 이름을
    # 못 받는다(업종코드를 요구한다). 그래서 둘을 함께 든다.
    # ⚠️ 이 목록은 /stock 검색의 KIS 대응표도 겸한다. 여기 없는 지수는 검색에서 2순위로 간다.
    indices:
      - name: "코스피"
        code: "0001"
      - name: "코스닥"
        code: "1001"
    # 종목코드로 박는다. 이름 매칭 경로를 태우면 설정 오타가 런타임에야 드러난다.
    # 아침 9시는 국내장 개장 전이라 전일 종가가 정확한 값이다.
    #
    # 시가총액 상위를 매일 조회해 자동으로 뽑는 안을 검토했다. beginMrktTotAmt 필터로
    # 2,870건을 37건까지 좁힐 수 있어 가능은 했지만 답이 바뀌지 않는다 —
    # 2위 SK하이닉스 1,041조와 3위 SK스퀘어 125조가 8배 차이다.
    stocks: ["005930", "000660"]
    # 테더는 스테이블코인이라 사실상 업비트의 원/달러 값이고 김치프리미엄 지표로 읽힌다.
    # 코인은 순위로 뽑을 수 없다 — 업비트가 유통량을 주지 않아 시가총액을 만들 수 없고,
    # 24시간 거래대금으로 정렬하면 상위가 테더·댑오에스·캡이 된다(비트코인 5위, 이더리움은 8위 밖).
    cryptos: ["KRW-BTC", "KRW-ETH", "KRW-USDT"]
    # 미국 지수와 종목. FMP는 둘을 같은 엔드포인트로 주므로 한 목록이다.
    # 시총 1·2위(NVDA·AAPL)를 고정한 이유는 순위 조회(company-screener)가 유료라서다.
    # 국내를 삼성전자·SK하이닉스로 고정한 것과 같은 판단이다.
    # 이름을 함께 박는다 — FMP는 'Apple Inc.' 같은 영문명을 주는데 국내 종목·코인은 한글이라
    # 한 화면에서 표기가 갈린다. /stock 검색은 LLM이 한국어 이름을 주지만 여기는 LLM을 타지 않는다.
    # ⚠️ 여기는 브리핑에 넣을 목록일 뿐이다. KIS 조회 키는 담지 않는다 —
    #    이 목록이 표를 겸하던 때가 있었는데, 표에 없는 심볼을 KIS가 통째로 거절해
    #    /stock 유아이패스·오라클이 빈손이 됐다(2순위 FMP가 그 심볼들을 402로 막는다).
    #    지수 표는 market.kis.us-indices, 종목 거래소는 탐색+캐시가 맡는다.
    us-symbols:
      - symbol: "^IXIC"
        name: "나스닥"
      - symbol: "^GSPC"
        name: "S&P 500"
      - symbol: "NVDA"
        name: "엔비디아"
      - symbol: "AAPL"
        name: "애플"
    # 뉴스 신선도 창 — 알람과 검색이 같은 값을 쓴다.
    # 날짜(KST 달력)가 아니라 경과 시간이다. 우리가 읽는 건 전부 외국 기사인데 KST 자정 경계는
    # 그 매체의 하루를 둘로 쪼갠다(미국 동부 취재일 09:00~17:00 EDT = KST 22:00~다음날 06:00).
    # 09시 브리핑 시점의 "오늘 KST"는 UTC 전날 15:00부터의 9시간뿐이기도 하다.
    # 실측 2026-08-15: /news 이더리움이 빈손이었는데 가장 최근 기사가 23시간 18분 전 것이라
    # 하루도 안 지났는데 'KST 어제'라는 이유로 잘려 나간 것이었다.
    window: 24h
    # 매체별로 LLM에 넘길 후보 수. 전부 넣으면 무료 티어를 태우고, 너무 좁히면 진짜 기사가 빠진다
    # /news 검색이 보여줄 건수. 1 → 3 → 5로 늘렸다 — 1위가 늘 원하던 기사는 아닌데
    # 몇 건뿐이면 사용자가 할 수 있는 일이 검색어를 바꿔 다시 치는 것밖에 없었다.
    # 텔레그램은 메시지당 미리보기를 하나만 붙이므로 기사마다 통을 쪼갠다.
    search-results: 5
    # 브리핑 뉴스의 무리별 건수 — 코인과 경제를 따로 채운다(NewsCategory).
    # 통틀어 상위 N건이던 때는 코인 기사가 금융 일반 피드에 거의 안 실려 코인 뉴스가
    # 하루도 안 나가는 날이 있었다. 모자란 무리는 다른 무리로 메우지 않는다 —
    # 코인이 3건뿐인 날은 8건이 나간다.
    crypto-results: 5
    economy-results: 5
    llm-candidates: 8
    # 이 미만이면 재테크 뉴스가 아닌 것으로 보고 그 매체를 이번 발송에서 뺀다
    relevance-threshold: 0.4
    sent-history-ttl: 3d   # 발송 완료 표시 보관 기간 (중복 발송 방지)

  weather:
    zone: Asia/Seoul
    # 오전 6시. 06:00~07:50에 10분마다 돌고 슬롯(날짜)이 하루 한 번을 보장한다 —
    # 브리핑(09시)과 같은 구조다. 잠들어 있었으면 깨어난 뒤 첫 틱이 보낸다.
    cron: "0 0/10 6-7 * * *"
    # ⚠️ 지오코딩은 역 이름을 못 찾는다 — '서현'을 물으면 김포시 서현(37.646, 126.605)이
    #    1순위로 나온다. 그래서 알람 지역은 좌표를 직접 박는다. 덤으로 이 경로는
    #    지오코딩을 아예 타지 않아, 지명 검색이 죽어도 아침 알람은 나간다.
    #    좌표는 위키백과 확인값이다.
    locations:
      - name: "미금역"
        latitude: 37.35000
        longitude: 127.10889
      - name: "서현역"
        latitude: 37.3851167
        longitude: 127.1232944
      - name: "잠실역"
        latitude: 37.513250
        longitude: 127.100111
      - name: "삼성중앙역"
        latitude: 37.512806
        longitude: 127.052612

    # 국내 1순위. 기상청 동네예보 5km 격자이고, **일별과 시간별을 한 출처가 함께 준다** —
    # 그래서 국내에서 「한 블록의 강수 값은 한 예보에서 나온다」가 완전해진다.
    # ⚠️ 키는 주식 2순위(공공데이터포털)가 쓰는 그 DATA_API_KEY다. data.go.kr 일반 인증키가
    #    계정당 하나라 새로 받을 것이 없다 — 실측 2026-08-26에 resultCode=00.
    # ⚠️ **단기예보만 쓴다**(오늘~사흘). 중기예보는 붙였다가 물렸다 — 좌표가 아니라 지역코드를
    #    받아 대표지점 최근접으로 권역을 골라야 했고, 그 기하가 행정경계를 못 재현했다
    #    (실측: 완도가 제주 권역으로 갔다). 그 날들은 Open-Meteo가 1km 격자에 시각까지 준다.
    # ⚠️ 그 키를 **다시 인코딩하면 안 된다**(% 포함, 길이 96). 한 번 더 인코딩하면
    #    SERVICE_KEY_IS_NOT_REGISTERED_ERROR가 오는데 그게 「활용신청이 안 됐다」로 읽힌다.
    #    KmaRequest가 URI를 문자열로 조립하는 이유다(DataGoRequest와 같은 함정).
    # ⚠️ 국내 전용이다. 예보 격자가 한반도뿐이고 「세계기상」은 예보가 아니라 GTS 관측,
    #    전지구모델은 GRIB2 파일이다. 국외는 아래 둘이 그대로 맡는다.
    kma:
      base-url: https://apis.data.go.kr
      api-key: ${DATA_API_KEY:}

    # 국외 1순위이자 국내 2순위. 지점 예보가 동 단위까지 짚어 준다(실측 2026-08-18: 미금역 → 구미1동).
    # ⚠️ 무료 등급은 하루 50회이고, 좌표로 바로 못 부른다 — 지점 키를 먼저 받아야 해서
    #    조회 한 번이 호출 두 번이다. cache-ttl.accu-location(30d)이 그 절반을 없앤다.
    # ⚠️ 무료는 5일까지다. 그보다 긴 기간은 supports()에서 빠져 Open-Meteo가 맡는다.
    accu-weather:
      base-url: https://dataservice.accuweather.com
      api-key: ${ACCU_API_KEY:}

    # 2순위와 과거. API 키가 없어 한도에 안 걸린다 — 받쳐 주는 쪽이 제약이 적어야
    # 이중화가 성립한다. Frankfurter를 고른 것과 같은 이유다.
    open-meteo:
      # 예보. 2026-08-17 실측으로 16일치가 강수확률까지 빠짐없이 왔다.
      # 5일을 넘는 기간을 줄 수 있는 유일한 곳이다.
      base-url: https://api.open-meteo.com
      # 지나간 날(ERA5 재분석). 호스트가 다르고 격자도 다르다(~11km) — 예보(~1km)와
      # 정밀도가 달라 출처 이름도 따로 적는다. 이중화 상대가 없다.
      archive-base-url: https://archive-api.open-meteo.com
      # 지명 검색. AccuWeather 지점 검색은 지명이 아니라 좌표를 받아, 이쪽도 이중화 상대가 없다.
      geocoding-base-url: https://geocoding-api.open-meteo.com

  # 시크릿은 환경변수로만 주입한다. 로컬은 backend/.env(gitignore), Phase 3는 k8s Secret.
  # 저장소에 값을 넣으면 지운 뒤에도 git 이력에 영원히 남는다.
  translation:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # 버전을 고정하지 않고 별칭을 쓴다. gemini-2.5-flash-lite로 고정했다가
      # "no longer available to new users" 404를 맞았다(8단계에서 실제로 겪음) —
      # 무료 티어 모델은 조용히 은퇴한다. 별칭은 품질이 조금 바뀔 수 있지만 죽지는 않고,
      # 바뀌어도 폴백(원문 그대로)이 받쳐 준다.
      model: gemini-flash-lite-latest
      base-url: https://generativelanguage.googleapis.com

  market:
    upbit:
      # 인증이 없다. 초당 10회/IP 제한만 지키면 된다 (resilience4j ratelimiter 'upbit')
      base-url: https://api.upbit.com

    binance:
      # 글로벌 시세(USDT 마켓). 인증이 없고 한도가 분당 1200 weight/IP라 넉넉하다 —
      # 실측한 응답 헤더가 x-mbx-used-weight-1m: 8이었다.
      # ⚠️ 미국 IP는 451로 차단된다. 이 서비스가 Singapore 리전이라 쓸 수 있는 것이고,
      #    리전을 옮기면 가장 먼저 깨질 연동이다.
      base-url: https://api.binance.com
      # 2순위 — 공개 데이터 미러. **451 전용 우회다.**
      # ⚠️ 418(IP 밴)·429에는 부르지 않는다 — 실측으로 두 호스트가 **한 IP 예산을 공유한다**
      #    (api↔data-api를 번갈아 물으니 x-mbx-used-weight-1m이 2·4·6·8로 이어졌다).
      #    밴은 같이 받고, 밴 중의 호출은 밴을 연장한다. 451은 IP 예산이 아니라 지역 규칙이라
      #    호스트에 따라 갈릴 수 있어 그때만 의미가 있다. 같은 /api/v3 스키마를
      # 주므로 파싱이 갈리지 않는다(실측 2026-08-20: api·data-api·api1·api-gcp 네 호스트가
      # 모두 같은 본문). 1순위가 살아 있으면 영영 안 불린다 — 비워 두면 우회 자체가 없다.
      fallback-base-url: https://data-api.binance.vision

    data-go:
      # 공공데이터포털 — 금융위원회 주식시세정보. 국내(KOSPI·KOSDAQ·KONEX)만 다룬다.
      # ⚠️ 발급된 키는 이미 URL 인코딩된 형태다. 다시 인코딩하면 403 "등록되지 않은 서비스키"가 난다
      #    (StockPriceApi가 URI를 직접 조립하는 이유다).
      base-url: https://apis.data.go.kr
      api-key: ${DATA_API_KEY:}

    fmp:
      # Financial Modeling Prep — 미국 주식·지수 현재가.
      # ⚠️ /api/v3는 legacy로 죽었다(403). /stable만 쓴다.
      # 무료는 미국 거래소 전용이라 한국 심볼·환율·스크리너는 402다 — 국내는 공공데이터포털 그대로.
      base-url: https://financialmodelingprep.com
      api-key: ${FMP_API_KEY:}
      # 무료 한도가 하루 250회인데 응답에 레이트리밋 헤더가 없어 우리가 센다.
      # 여유를 두고 240에서 멈춘다.
      daily-limit: 240

    frankfurter:
      # 유럽중앙은행 고시 환율을 그대로 주는 무인증 공개 서비스.
      # 인증도 IP 제한도 없어 배포 환경에서 그대로 돈다 — 토스를 떠난 이유가 그 IP 허용목록이었다.
      base-url: https://api.frankfurter.dev

    # 환율·국내 주식의 1순위. 셋 중 유일하게 하루 중에도 움직이는 출처다.
    # ⚠️ 지금 키는 모의투자용이다. 실전은 도메인과 앱키가 둘 다 다르다:
    #    실전 https://openapi.koreainvestment.com:9443 / 모의 https://openapivts...:29443
    #    시세 TR ID(FH...)는 실전·모의가 같지만 실전 전용 엔드포인트가 있다 —
    #    분봉 환율·inquire-index-price(지수)·search-stock-info(종목명)는 모의에서 안 된다.
    #    그래서 모의에서도 도는 경로만 골라 쓴다(KisStockApi·KisFxClient javadoc 참조).
    #    ✅ invest-opinion(종목투자의견)은 **모의에서도 된다**(실측 2026-08-20, 200) —
    #       "실전 전용"으로 넘겨짚고 안 붙일 뻔한 자리다. 막힌 것과 안 해 본 것은 다르다.
    # ⚠️ 토큰 발급 본문에 앱시크릿을 넣을 때 **끝의 줄바꿈을 떼야 한다.** 안 떼면
    #    403 EGW00105("유효하지 않은 AppSecret")가 오는데, 이건 키가 틀렸다는 뜻이 아니라
    #    우리가 값을 잘못 실었다는 뜻이다 — 실측 중에 이걸 "모의/실전 도메인이 안 맞는다"로
    #    오진해 설정을 실전으로 바꿨다가 되돌렸다.
    # ⚠️ 토큰은 1분에 한 번만 발급되고 발급마다 계정주에게 알림톡이 간다 — KisTokenStore가
    #    Redis에 캐시하는 것이 필수다. 그리고 무효 토큰에는 401이 아니라 HTTP 500이 온다
    #    (msg_cd=EGW00121) — 상대 서버 장애로 읽히므로 KisHeaders.reasonOf가 이유를 꺼낸다.
    kis:
      base-url: https://openapivts.koreainvestment.com:29443
      app-key: ${KIS_API_KEY:}
      app-secret: ${KIS_API_SECRET:}
      # 호출 사이 최소 간격. 모의 계정이 초당 1건이다(실전은 20건 — 도메인·앱키와 함께 바꾼다).
      # ⚠️ 이 자리가 resilience4j 리미터가 아닌 이유는 제약이 "1초에 몇 건"이 아니라
      #    "호출 사이 얼마"이기 때문이다. 고정 윈도로는 경계에서 두 호출이 120ms 간격으로
      #    나가고(실측) KIS가 그걸 거절한다. 근거는 KisThrottle javadoc의 실측 표에 있다.
      # ⚠️ 간격을 깎아도 EGW00201("초당 거래건수를 초과하였습니다")은 산발적으로 난다 —
      #    실측 2026-08-20(커넥션을 매번 새로 여는 curl로 13연속): 150ms 13/13 · 200ms 12/13 ·
      #    300ms 11/13으로 간격과 성공률이 **단조롭지 않다.** 남는 실패는 간격이 아니라
      #    상대 쪽 요동이므로, 실전으로 옮기더라도 간격만 깎아서는 얻을 것이 없다.
      min-interval: 1s
      # 줄 서는 것까지 이 시간을 넘기면 기다리지 않고 던진다(옛 리미터의 timeoutDuration).
      # 브리핑이 KIS를 9번 연달아 부르므로 마지막 호출이 ~8초를 기다린다 — 넉넉해야 한다.
      max-wait: 20s
      # 미국 지수의 KIS 심볼. ^IXIC → COMP 같은 규칙이 없어 이 표가 유일한 길이다.
      # ⚠️ 종목과 달리 지수는 탐색할 수 없다. 표에 없으면 2순위(FMP)가 맡는다 —
      #    FMP 무료 티어는 지수 셋(^IXIC·^GSPC·^DJI)을 다 주므로 그 폴백은 실제로 성립한다.
      # ⚠️ 틀린 심볼은 에러가 아니라 값 0.00으로 온다(실측 DJI·DJIA). 그래서 더 위험하다 —
      #    KisStockApi가 양수인지 검사해 폴백시킨다.
      us-indices:
        - symbol: "^IXIC"
          kis-symbol: "COMP"
        - symbol: "^GSPC"
          kis-symbol: "SPX"
        - symbol: "^DJI"
          kis-symbol: ".DJI"

    kexim:
      # oapi 도메인을 쓴다. 구 www.koreaexim.go.kr은 2026-04-30에 지원이 끝나 연결되지 않는다.
      # 이 API는 authkey를 쿼리 파라미터로만 받으므로 URL이 로그에 남지 않게 주의해야 한다.
      base-url: https://oapi.koreaexim.go.kr
      api-key: ${KEXIM_API_KEY:}

  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # 정기 발송 대상이자 명령을 받아 줄 유일한 채팅방이다 — 다른 곳에서 온 명령은 무시한다.
    # 포럼(토픽) 슈퍼그룹이면 -100으로 시작한다
    chat-id: ${TELEGRAM_CHAT_ID:}
    # 포럼 토픽을 쓸 때만 채운다. 비우면 토픽을 지정하지 않는다(General 토픽 / 모든 토픽 허용).
    # 잘못된 번호를 넣어 봇이 통째로 막히면 이 값을 비우는 것만으로 되살릴 수 있다.
    notice-topic-id: ${TELEGRAM_NOTICE_TOPIC_ID:}   # 브리핑을 보낼 토픽
    search-topic-id: ${TELEGRAM_SEARCH_TOPIC_ID:}   # 명령을 받을 토픽
    # setWebhook에 준 것과 같은 값. 텔레그램이 X-Telegram-Bot-Api-Secret-Token 헤더로 되돌려준다.
    # 비어 있으면 검증하지 않는다 — 로컬·테스트용이고, 배포 환경에서는 반드시 채운다
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    base-url: https://api.telegram.org

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        # 리미터가 우리 호출을 거절한 것은 상대 장애가 아니라 우리가 스스로 건 스로틀이다.
        # 실패로 세면 우리 트래픽이 몰릴 때 브레이커가 열려 멀쩡한 상대를 끊는다 —
        # 실측에서 /news 한 번에 gemini 리미터(12/60s)가 소진되자 translation 브레이커가
        # 열려 브리핑이 통째로 번역 없이 나갔다.
        # ⚠️⚠️ **이 목록은 인스턴스가 ignoreExceptions를 적는 순간 통째로 사라진다** —
        #      이어 붙지 않고 **덮어쓴다**. 그래서 아래 인스턴스 중 제 목록을 가진 것들은
        #      RequestNotPermitted를 다시 적어야 한다. 안 적으면 우리 스로틀이 거절한 것이
        #      상대 장애로 세어져, 트래픽이 몰릴 때마다 멀쩡한 상대에 브레이커가 열린다.
        #      실제로 binance가 그 상태였고 목록에 없어서 아무도 몰랐다.
        #      ResilienceConfigTest.rateLimiterRejectionDoesNotOpenTheBreaker가 그 그물이다.
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
    instances:
      translation:
        baseConfig: default
        waitDurationInOpenState: 120s
        # 429는 "우리가 너무 빨리 물었다"이지 Gemini 장애가 아니다. 실패로 세면 무료 티어를
        # 스칠 때마다 브레이커가 열려 120초 동안 번역이 통째로 막힌다 — 리미터 거절(위의
        # RequestNotPermitted)을 빼 둔 것과 같은 이유다. 바이낸스가 4xx를 빼는 것도 같다.
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException.TooManyRequests
      telegram:
        baseConfig: default
        # ⚠️ 아래 목록이 configs.default의 것을 덮어쓴다 — 위 default 블록 주석 참조
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.saiden.economyhelper.telegram.TelegramClient.TelegramRateLimited
      # buzz는 랭킹의 부속 신호다. 끊겨도 나머지 세 지표로 순위가 매겨지므로
      # 빨리 열고 오래 닫아 둔다.
      hackerNews:
        baseConfig: default
        failureRateThreshold: 30
        waitDurationInOpenState: 300s
      upbit:
        baseConfig: default
      # 바이낸스는 4xx를 실패로 세지 않는다. 상장 안 된 심볼을 물으면 400인데
      # (실측: USDTUSDT → -1121 Invalid symbol) 그건 우리 잘못이지 거래소 장애가 아니다.
      # 실패로 세면 멀쩡한 거래소에 브레이커가 열려 다른 코인까지 막힌다.
      binance:
        baseConfig: default
        # ⚠️ **418(IP 밴)은 반드시 브레이커를 열어야 한다.** 바이낸스는 429를 받고도 계속 부르면
        #    IP를 자동 밴하고, 밴 중에 더 부르면 **밴이 길어진다**(2분~3일). 즉 여기서 옳은
        #    대응은 "물러서기"이고 그 수단이 브레이커다.
        #    예전에는 아래 목록이 HttpClientErrorException을 **통째로** 무시했다. 취지는
        #    옳았다 — 없는 심볼의 400이 브레이커를 열면 멀쩡한 다른 코인까지 막힌다. 그런데
        #    418·429도 같은 4xx라 함께 빠져, IP가 밴된 동안에도 브레이커가 안 열리고 매 호출이
        #    그대로 나갔다. **우리가 우리 밴을 늘리고 있었다.** 그래서 400만 좁은 타입으로
        #    갈라(BinanceApi.UnknownSymbol) 그것만 무시한다.
        #    ⚠️ 그래도 **브레이커만으로는 물러설 수 없다.** 기본이 10건 중 50%라 418 하나로는
        #    안 열리고 다섯 번을 더 부르는데, 그 다섯 번이 정확히 밴을 늘리는 호출이다.
        #    그래서 BinanceBanGate가 첫 418에 문을 닫고, 브레이커는 그 밖의 실패를 맡는다.
        #    Banned는 우리가 스스로 닫은 문이라 실패로 세지 않는다 — 세면 밴이 풀린 뒤에도
        #    브레이커가 열린 채 남아 **밴보다 오래 가는 정지**가 된다.
        # ⚠️ 아래 목록이 configs.default의 것을 덮어쓴다 — 위 default 블록 주석 참조
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.saiden.economyhelper.market.binance.BinanceApi$UnknownSymbol
          - io.saiden.economyhelper.market.binance.BinanceApi$Banned
        # 밴이 최소 2분이다. 기본 60초로는 아직 밴인 상태에서 반쯤 열려 다시 찌른다 —
        # 그 찌름이 밴을 연장하므로 밴 최소치보다 길게 잡는다
        waitDurationInOpenState: 150s
      # 환율은 출처별로 따로 연다. 하나로 묶으면 토스 장애가 수출입은행까지 끊어
      # CLAUDE.md가 요구한 이중화가 성립하지 않는다.
      fxFrankfurter:
        baseConfig: default
      fxKexim:
        baseConfig: default
      # KIS는 환율과 국내 주식이 같은 호스트·같은 앱키지만 브레이커를 나눈다 — 하나로 묶으면
      # 주식 장애가 환율 이중화까지 끊는다. 환율·날씨에서 이미 세운 규칙이다.
      #
      # ⚠️ **KIS는 「우리 잘못」을 두 가지로 던지고, 둘 다 실패로 세면 안 된다.**
      #    (1) KisThrottle$Congested — 우리가 스스로 건 간격 문이 거절한 것이다. 위 default
      #        블록이 RequestNotPermitted를 빼 둔 이유가 바로 이것인데, **KIS는 그 리미터를
      #        걷어내고 KisThrottle로 바꿨다** — 그 순간 거절이 맨 IllegalStateException이 되어
      #        보호에서 조용히 빠졌다. 브리핑이 KIS를 9번 연달아 부르는 동안 사용자의 /stock
      #        하나가 max-wait(20s)를 넘겨 밀리면 그것이 상대 장애로 기록된다.
      #    (2) KisStockApi$Unsupported — 업종코드가 없는 지수, KIS 해외 표에 없는 심볼이다.
      #        같은 입력이면 영원히 같은 실패이고, **HTTP 호출조차 없이** 난다 — 상대를
      #        건드리지도 않고 상대의 브레이커를 태운다. 게다가 캐시가 브레이커보다 바깥이라
      #        (cacheSitsOutsideTheResilienceAspects) 성공한 일봉은 12시간 캐시에 들어가 다시
      #        안 세어지는데 **실패는 캐시되지 않아 매번 세어진다** — 비율이 실패로 기운다.
      #        설정에 없는 지수를 다섯 번 물으면(조회당 시세 1 + 차트 1) 창이 실패로 찬다.
      #    열리면 국내 시세는 전일 종가로 강등되고 **미국 시세는 2순위(FMP)가 대부분 402라
      #    통째로 빈손**이 된다 — fmpOutlook을 시세와 가른 것과 같은 자리다.
      # ⚠️ 아래 목록이 configs.default의 것을 덮어쓴다 — 위 default 블록 주석 참조
      kisFx:
        baseConfig: default
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          # 환율에는 Unsupported가 없다 — 심볼이 FX@KRW 하나로 고정이다
          - io.saiden.economyhelper.market.kis.KisThrottle$Congested
      kisStock:
        baseConfig: default
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.saiden.economyhelper.market.kis.KisThrottle$Congested
          - io.saiden.economyhelper.market.kis.KisStockApi$Unsupported
      dataGo:
        baseConfig: default
      fmp:
        baseConfig: default
      # ⚠️ FMP도 시세와 전망을 나눈다 — KIS를 환율·주식으로 나눈 것과 똑같은 자리다.
      #    무료 티어가 심볼별 허용목록이라 PATH·ORCL의 **전망**은 늘 402다. 하나로 묶어 두면
      #    그 402가 쌓여 브레이커가 열리고, 그 순간 **미국 시세의 2순위(FMP)까지 함께 막힌다** —
      #    KIS가 죽었을 때 기대던 폴백이 전망 조회 때문에 끊기는, 「보충이 폴백을 죽이는」 모양이다.
      fmpOutlook:
        baseConfig: default
      # 날씨도 출처별로 따로 연다 — 환율과 같은 이유다. 하나로 묶으면 AccuWeather 장애가
      # Open-Meteo까지 끊어 이중화가 성립하지 않는다.
      # 국내 1순위. 여기가 열리면 국내는 AccuWeather로 내려앉는다 — 값은 나가고 정밀도만
      # 낮아진다.
      weatherKma:
        baseConfig: default
      # AccuWeather는 지점 조회와 예보가 한 브레이커를 쓴다 — 같은 키·같은 호스트라 하나가
      # 죽으면 다른 하나도 못 쓴다. 하루 50회를 넘겨 503이 이어질 때 이 브레이커가 열려
      # 헛호출을 멈추는 것이, 따로 쿼터 카운터를 두지 않는 대신의 방어다.
      weatherAccuWeather:
        baseConfig: default
      weatherOpenMeteo:
        baseConfig: default
      # ⚠️ 강수 시각 **보충**도 예보와 나눈다 — fmpOutlook을 시세와 가른 것과 똑같은 자리다.
      #    보충은 AccuWeather가 답할 때마다(즉 평상시 매 조회마다) 불리고, 알람은 지역 넷을
      #    겹쳐 물어 한 번에 넷이 나간다 — 창 열 칸을 이쪽이 거의 다 채운다. 한 브레이커면
      #    그 실패가 쌓여 열리는 순간 **2순위 폴백(OpenMeteoForecastClient)까지 함께 막힌다.**
      #    그러면 AccuWeather가 하루 50회를 넘긴 날 남는 것은 아카이브뿐인데 그쪽은
      #    supports()에서 미래를 빼므로 **날씨가 통째로 빈손**이 된다 — 「보충이 폴백을
      #    죽이는」 모양이고, 증상은 조용하다(일별은 1순위 것이라 통이 멀쩡해 보인다).
      weatherOpenMeteoHourly:
        baseConfig: default
      # 지나간 날짜 전용. 이중화 상대가 없어(다른 곳에는 아카이브가 없다) 여기가 열리면
      # 과거 조회는 그대로 멈춘다 — 그래서 예보와 한 브레이커를 쓰지 않는다.
      weatherOpenMeteoArchive:
        baseConfig: default
      # 지오코딩은 4xx를 실패로 세지 않는다. 없는 지명이나 이상한 문자가 섞인 검색어에
      # 400이 오는 건 우리 잘못이지 상대 장애가 아닌데, 그걸 세면 검색 몇 번에 브레이커가
      # 열려 멀쩡한 지오코딩이 60초 끊긴다 — 바이낸스가 미상장 심볼의 400을 빼는 것과 같다.
      weatherGeocoding:
        baseConfig: default
        # ⚠️ 아래 목록이 configs.default의 것을 덮어쓴다 — 위 default 블록 주석 참조
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - org.springframework.web.client.HttpClientErrorException
  # 재시도 — **폴백이 없거나 한도가 없는 곳에만** 건다.
  #
  # 규칙 하나로 압축하면: **한도가 있으면 안 걸고, 다음 출처가 있으면 안 걸고, 실패가 영구인
  # 게 흔하면 안 건다.** 아래 여덟이 그 셋 다 아니다. 안 거는 이유는 instances 끝에 적었다.
  #
  # ⚠️ configs.default가 없으면 ratelimiter보다 나쁜 함정이다. 선언 없는 인스턴스는 라이브러리
  #    기본값(3회 · 500ms · **모든 예외 재시도**)으로 만들어진다. 리미터는 아무것도 막지 않는
  #    쪽으로 조용히 망가졌지만(met.no가 그 상태였다) 이쪽은 **우리 잘못(4xx)까지 세 번 부르는**
  #    쪽으로 망가진다. 그래서 default를 먼저 적고 전부 baseConfig로 물려받는다.
  #
      # ⚠️ 애스펙트 order는 적지 않는다 — 기본값이 이미 원하는 순서다(ARCHITECTURE.md 4-3).
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 300ms
        # 두 번째가 곧 실패면 세 번째도 대개 실패다. 실측 지연이 37ms~1.1초인 상대들이라
        # 배수를 두면 마지막 시도만 유의미하게 뒤로 밀린다
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # **재시도할 것을 적는다 — 뺄 것을 적지 않는다.** 빼는 규칙은 새 예외가 생길 때마다
        # 조용히 넓어지고, 넓어진 순간 우리 잘못을 세 번 부른다(Failover.order가 "적힌 것만
        # 쓴다"인 것과 같은 방향이다). HttpClientErrorException(4xx)은 HttpServerErrorException의
        # 하위가 아니라 형제라(둘 다 HttpStatusCodeException) **4xx가 타입으로 막힌다** —
        # 없는 심볼·없는 지명은 우리 잘못이고 상대는 멀쩡하다.
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          # 커넥션 리셋·연결/읽기 타임아웃이 전부 여기로 온다 — Spring이 IOException을
          # 이 타입으로 감싼다(DefaultRestClient)
          - org.springframework.web.client.ResourceAccessException
        # 위 열거만으로도 이 둘은 안 걸린다. 그래도 적는 이유가 둘이다:
        # (1) retryExceptions를 넓히는 인스턴스(telegram)에서도 뜻이 유지돼야 한다,
        # (2) 무엇을 재시도하지 않기로 했는지를 설정이 스스로 말해야 한다.
        ignoreExceptions:
          # 우리 리미터가 거절한 것이다 — 재시도는 퍼밋을 더 먹으려고 줄에 다시 서는 일이고,
          # Gemini(12/60s · timeout 20s)에서는 그게 곧 한도 소진이다.
          # 브레이커가 이걸 실패로 세지 않는 것과 같은 판단이다
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          # ⚠️ 재시도가 브레이커 **바깥**이라 이것이 실제로 온다. 안 빼면 브레이커가 열린
          #    뒤에도 대기 시간을 두 번 지불하고 같은 답을 받는다. 빼 두면 브레이커가 열리는
          #    순간 재시도가 즉시 멈춘다 — 그게 원하는 것이다
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      # ── 이중화 상대가 없는 곳 셋. 재시도가 가장 값을 하는 자리다 ──
      # 지오코딩은 AccuWeather 지점 검색이 좌표를 받아 이중화 상대가 아예 없다.
      # /weather 검색의 첫 단계라 여기가 죽으면 그 명령이 통째로 빈손이다. 키도 한도도 없다
      weatherGeocoding:
        baseConfig: default
        maxAttempts: 3
      # ⚠️ **기상청에는 재시도를 걸지 않는다.** 폴백이 둘이라 규칙대로이기도 하고, 걸어 봤자
      #    발동하지 않는다 — KmaRequest가 키를 지우려고 모든 실패를 IllegalStateException으로
      #    감싸는데 위 retryExceptions는 HttpServerErrorException·ResourceAccessException만
      #    센다. 한동안 선언만 있고 아무 일도 안 하는 상태였다.
      # 폴백의 끝자리다 — AccuWeather가 이미 실패했거나 5일을 넘겨 supports()에서 빠진 뒤다
      weatherOpenMeteo:
        baseConfig: default
        maxAttempts: 3
      # 보충도 재시도를 따로 센다 — 브레이커를 나눈 것과 같은 이유다. 한 이름이면 보충의
      # 재시도가 폴백의 창을 함께 쓴다.
      weatherOpenMeteoHourly:
        baseConfig: default
        maxAttempts: 3
      # 지난 날짜 단일 경로. 브레이커 주석이 이미 "여기가 열리면 과거 조회는 멈춘다"고 적었다
      weatherOpenMeteoArchive:
        baseConfig: default
        maxAttempts: 3
      # ── 실측이 빠른 시세 셋. 재시도 비용이 사실상 없다 ──
      # 실측 37ms(2026-08-20). /crypto의 유일한 원화 출처이고, 초당 8건 리미터가 재시도까지
      # 페이싱해 준다 — 재시도가 리미터 바깥이라 attempt마다 퍼밋을 얻는다
      upbit:
        baseConfig: default
        waitDuration: 200ms
      # 실측 86ms. 글로벌 시세 단일 출처다.
      # ⚠️ 451(지역 차단)은 4xx라 위 열거에 안 걸린다 — 재시도해도 안 낫는 것이 맞다.
      #    리전을 옮기는 것만이 답이고, FailureReason이 로그에 그렇게 적는다
      binance:
        baseConfig: default
        waitDuration: 200ms
      # 실측 142ms, 키도 한도도 없다. ⚠️ 여기서 한 번 더 시도하는 것이 3순위(수출입은행
      #    하루 1,000회, 캐시 미스 하나가 최대 14회)를 안 태우는 길이다 —
      #    재시도가 폴백보다 싼 유일한 자리다
      fxFrankfurter:
        baseConfig: default
      # ── 답이 나가는 것 자체가 목적인 자리 ──
      # 웹훅은 텔레그램에 200을 이미 줬으므로 저쪽이 다시 보내지 않는다(ARCHITECTURE 3-2의 대가).
      # 우리가 재시도하지 않으면 그 답은 영영 없다
      telegram:
        baseConfig: default
        maxAttempts: 3
        # ⚠️ 300ms가 아니다. 텔레그램은 같은 방에 초당 한 통을 권고하고
        #    TelegramClient.BETWEEN_MESSAGES가 그 값이다 — 더 빨리 다시 쏘면 429를 우리가 만든다
        waitDuration: 1s
        enableExponentialBackoff: false
        # ⚠️ retryExceptions·ignoreExceptions는 둘 다 baseConfig의 것을 **덮어쓴다** —
        #    이어 붙이지 않는다(브레이커의 ignoreExceptions와 같은 함정이다). 그래서 기본의
        #    둘을 여기 다시 적는다. 안 적으면 물려받던 규칙이 조용히 사라진다
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          # **닿지 못한 것만** 다시 시도한다. ok:false 거절(chat not found)은 설정이 틀린 것이라
          # 세 번 불러도 같은 답이고, 그동안 브리핑 여섯 통이 통마다 두 배로 늦어진다
          - io.saiden.economyhelper.telegram.TelegramClient$TelegramUnavailable
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          # 429는 우리가 빨리 물은 것이다. TelegramUnavailable의 형제가 아니라
          # TelegramException의 하위라 위 목록에 안 걸리지만, 적어 두는 편이 뜻이 분명하다
          - io.saiden.economyhelper.telegram.TelegramClient$TelegramRateLimited
      # 매체 하나가 곧 출처 하나다 — 빠지면 그 매체가 브리핑 후보에서 통째로 사라진다.
      # 키도 한도도 없고 캐시가 10분이다. 실측 최대 1.5초(BBC는 콜드 DNS가 1.3초).
      # ⚠️ 애너테이션이 아니다. 이유가 둘이고 브레이커의 것과 다르다 — 브레이커는 이름이
      #    매체별이어야 해서이고, 재시도는 fetch()가 예외를 스스로 삼켜 빈 목록을 주므로
      #    @Retry를 달아도 **발동조차 하지 않기** 때문이다
      feed:
        baseConfig: default
        waitDuration: 500ms
      # ⚠️ 여기 **없는** 출처가 아홉이고, 없는 이유가 이 설계의 절반이다 —
      #    KIS(주식·환율·토큰) · FMP · AccuWeather · 수출입은행 · 공공데이터포털 ·
      #    Gemini · Hacker News. 규칙 하나로: **한도가 있으면 안 걸고, 다음 출처가 있으면
      #    안 걸고, 실패가 영구인 게 흔하면 안 건다.** 출처별 근거는 ARCHITECTURE.md 4-3의
      #    표에 있다 — 여기 옮겨 적으면 설정 파일이 설계 문서가 되고 둘이 어긋난다.

  ratelimiter:
    instances:
      # Gemini 무료 티어는 보장된 한도가 아니다. 스스로 낮게 잡아 429를 피한다.
      gemini:
        limitForPeriod: 12
        limitRefreshPeriod: 60s
        # 허가가 날 때까지 기다린다. 짧게 잡으면 거절이 곧 실패가 되는데, 그 실패는 언제나
        # 번역 쪽으로 떨어진다 — 관련도 채점(매체당 1회)이 먼저 줄을 서고 번역이 그 뒤라서다.
        # 브리핑은 백그라운드이고 /news도 이미 수 초를 기다리므로, 몇 초 더 기다리는 편이
        # 영문 원문으로 강등되는 것보다 낫다.
        timeoutDuration: 20s
      # 업비트는 초당 10회/IP(quotation 그룹 공유)를 명시한다. 8로 낮춰 경계에서 429를 피한다.
      upbit:
        limitForPeriod: 8
        limitRefreshPeriod: 1s
        timeoutDuration: 3s
      # 바이낸스는 분당 1200 weight/IP다 — /ticker/24hr는 심볼 수에 따라 무거워지지만
      # 우리는 3~5개라 한 자릿수다. /ticker/price에서 옮긴 이유는 등락률이 24hr에만 있어서다.
      # 넉넉하다고 안 걸면 버그로 폭주할 때 IP가 밴된다.
      binance:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 3s
      # 공공데이터포털은 일 1만회다. 캐시(1h)가 실질 방어이고 이건 폭주만 막는다.
      dataGo:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      # FMP는 하루 250회다 — 일 단위 총량이라 이 리미터로는 못 지킨다(FmpQuotaGuard가 센다).
      # 여기서는 연타로 초당 여러 번 나가는 것만 막는다.
      fmp:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 3s
      # 수출입은행은 하루 1,000회다 — 초 단위로는 지킬 수 없어 캐시(1h)가 실질 방어다.
      # 이 리미터는 영업일 후퇴 루프가 폭주하는 것만 막는다.
      # ⚠️ 5는 "조회 한 번에 호출 한 번"을 가정한 값이었다. 실제로는 캐시가 빈 조회 하나가
      #    되짚기 7 + 등락률용 되짚기 7 = 최대 14회를 태우므로, 퍼밋을 호출마다 얻게 고친
      #    지금은 5로는 연휴에 조회가 통째로 실패한다. 최악을 덮되 하루 한도(1,000)에는
      #    한참 못 미치는 값으로 둔다 — 1시간 캐시가 있어 실제로는 하루 24회 남짓이다.
      kexim:
        limitForPeriod: 20
        limitRefreshPeriod: 60s
        timeoutDuration: 3s
      # ⚠️ KIS는 여기 없다. 리미터로 표현할 수 없는 제약이라 KisThrottle이 맡는다 —
      #    "1초에 1건"이 아니라 "호출 사이 1초"여서다. 고정 윈도는 경계에서 두 호출을
      #    120ms 간격으로 내보내고(실측) KIS가 그 두 번째를 거절한다.
      #    설정은 economy-helper.market.kis.min-interval에 있다.
      # ⚠️ 날씨에는 @RateLimiter를 달지 않는다. AccuWeather의 제약은 초 단위가 아니라 일 단위라
