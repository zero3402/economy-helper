# 테스트에서만 얹히는 설정 — **본 application.yml을 가리지 않는다.**
#
# ⚠️ 파일 이름이 중요하다. `src/test/resources/application.yml`로 두면 같은 이름의 클래스패스
#    자원이 되어 **본 yml을 통째로 덮는다**(테스트 클래스 디렉터리가 앞에 선다) — 그러면
#    EconomyHelperPropertiesTest가 보는 실제 설정이 사라진다. `.properties`는 `.yml`과
#    **함께 로드되고 겹치는 키만 이긴다.**
#
# ⚠️ **테스트가 스케줄 잡을 띄우고 실제 외부 호출을 냈다.** @EnableScheduling이 여섯
#    @SpringBootTest 컨텍스트에서 살아 있고, @DirtiesContext가 없어 그 컨텍스트가 포크 JVM이
#    끝날 때까지 캐시에 남는다. 그래서 운영 크론(브리핑 09~10시 · 날씨 06~07시 KST)이
#    테스트 도중 발화해, 키가 필요 없는 곳으로 **실제 호출**이 나갔다 —
#    업비트·바이낸스·Frankfurter·Open-Meteo 셋·HN Algolia·RSS 여섯 곳.
#
#    `-`는 스프링이 아는 「이 스케줄을 등록하지 않는다」다(Scheduled.CRON_DISABLED).
#    SchedulingConfig 자체를 프로파일로 끄지 않는 이유는 그것이 @EnableSchedulerLock도
#    들고 있어서다 — DigestIntegrationTest가 그 락 프록시를 단언한다.
economy-helper.digest.cron=-
economy-helper.weather.cron=-
economy-helper.keep-warm.cron=-
